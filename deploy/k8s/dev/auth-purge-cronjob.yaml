# Daily retention for sign-in data (expired login challenges, long-dead
# sessions). Dev namespace only. Replace IMAGE_TAG with the deployed migrator tag:
#   sed "s/IMAGE_TAG/<tag>/" deploy/k8s/dev/auth-purge-cronjob.yaml | kubectl apply -f -
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vnext-auth-purge
  namespace: lms-dev-2026
spec:
  schedule: "17 21 * * *" # 02:47 IST
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: purge
              image: asia-south1-docker.pkg.dev/students-384817/lms-vnext/migrator:IMAGE_TAG
              command: ["npm", "run", "auth:purge"]
              envFrom:
                - secretRef:
                    name: vnext-db
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 250m, memory: 256Mi }
