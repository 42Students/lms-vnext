# Dev-only one-minute due-announcement tick; respects 30-second Undo hold.
apiVersion: batch/v1
kind: CronJob
metadata: { name: vnext-tpo-due-notices, namespace: lms-dev-2026 }
spec:
  schedule: "* * * * *"
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: tick
              image: curlimages/curl:8.12.1
              command:
                - /bin/sh
                - -ec
                - |
                  curl -fsS --connect-timeout 3 --max-time 45 -o /dev/null \
                    -X POST -H "x-tpo-scheduler-key: $TPO_NOTICE_SCHEDULER_SECRET" \
                    http://lms-vnext.lms-dev-2026.svc.cluster.local:8080/api/internal/placements/tpo/notices/deliver
              env:
                - name: TPO_NOTICE_SCHEDULER_SECRET
                  valueFrom:
                    secretKeyRef: { name: vnext-integrations, key: TPO_NOTICE_SCHEDULER_SECRET }
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits: { cpu: 100m, memory: 64Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
