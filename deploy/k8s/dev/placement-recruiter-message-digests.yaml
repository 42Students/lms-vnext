# Dev-only recruiter unread digest scheduler. Same-origin and bearer
# checks in the existing route are deliberately retained. The worker enforces
# the legacy 90-second initial grace. Five-minute wall-clock ticks differ
# from Spring fixed delay; the actual CronJob still requires a dev rollout.
# Provision
# RECRUITER_MESSAGE_WORKER_SECRET (32+ bytes) in vnext-integrations.
apiVersion: batch/v1
kind: CronJob
metadata: { name: vnext-tpo-recruiter-message-digests, namespace: lms-dev-2026 }
spec:
  schedule: "*/5 * * * *"
  timeZone: "Asia/Kolkata"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: tick
              image: curlimages/curl:8.12.1
              command:
                - /bin/sh
                - -ec
                - |
                  curl -fsS --connect-timeout 3 --max-time 180 -o /dev/null \
                    -X POST \
                    -H "Origin: http://lms-vnext.lms-dev-2026.svc.cluster.local:8080" \
                    -H "Authorization: Bearer $RECRUITER_MESSAGE_WORKER_SECRET" \
                    http://lms-vnext.lms-dev-2026.svc.cluster.local:8080/api/internal/placements/recruiter-message-reminders
              env:
                - name: RECRUITER_MESSAGE_WORKER_SECRET
                  valueFrom:
                    secretKeyRef: { name: vnext-integrations, key: RECRUITER_MESSAGE_WORKER_SECRET }
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits: { cpu: 100m, memory: 64Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
