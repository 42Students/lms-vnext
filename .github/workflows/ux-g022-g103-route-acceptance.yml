name: UX-G022 G103 project-template and TPO route acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/(authenticated)/admin/projects/templates/[templateId]/tasks/**'
      - 'src/app/(authenticated)/admin/projects/templates/[templateId]/versions/**'
      - 'src/app/(authenticated)/admin/projects/templates/new/**'
      - 'src/app/(authenticated)/tpo/drive-day/[roundId]/no-shows/**'
      - 'src/app/(authenticated)/tpo/find/**'
      - 'src/app/(authenticated)/tpo/follow-ups/**'
      - 'src/app/(authenticated)/tpo/home/**'
      - 'tests/unit/ux-g022-g103-route-recovery.test.ts'
      - 'tests/e2e/ux-g022-g103-route-recovery.spec.ts'
      - 'scripts/seed-test-tenants.ts'
      - '.github/workflows/ux-g022-g103-route-acceptance.yml'

concurrency:
  group: ux-g022-g103-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scoped-route-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: 'true'
      APP_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact source SHA and committed browser cases
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f tests/e2e/ux-g022-g103-route-recovery.spec.ts
      - name: Focused source and existing journey regression
        run: |
          npx eslint \
            'src/app/(authenticated)/admin/projects/templates/[templateId]/tasks' \
            'src/app/(authenticated)/admin/projects/templates/[templateId]/versions' \
            'src/app/(authenticated)/admin/projects/templates/new' \
            'src/app/(authenticated)/tpo/drive-day/[roundId]/no-shows' \
            'src/app/(authenticated)/tpo/find' \
            'src/app/(authenticated)/tpo/follow-ups' \
            'src/app/(authenticated)/tpo/home' \
            tests/unit/ux-g022-g103-route-recovery.test.ts \
            tests/e2e/ux-g022-g103-route-recovery.spec.ts
          npx vitest run \
            tests/unit/ux-g022-g103-route-recovery.test.ts \
            tests/unit/chat12-tpo-find-ssr-role-search.test.tsx \
            tests/unit/tpo-followup-queue-filter-model.test.ts
      - name: Global TypeScript compatibility
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable E2E PostgreSQL
        run: npm run db:e2e:prepare
      - name: Seed real TPO, Mentor, and cross-college test memberships
        env:
          ALLOW_TEST_SEED: I_ACCEPT
          UX_ROLE_MEMBERSHIPS_ONLY: '1'
        run: npx tsx scripts/seed-test-tenants.ts
      - name: Ephemeral role-auth secrets
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Project and TPO responsive role-negative browser journeys
        run: npx playwright test tests/e2e/ux-g022-g103-route-recovery.spec.ts --project=chromium --reporter=line
      - name: Preserve desktop/mobile screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g022-g103-browser-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
