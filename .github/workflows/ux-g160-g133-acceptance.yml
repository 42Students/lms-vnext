name: UX G160 TPO and G133 authentication acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/components/tpo/tpo-timed-debar-control.tsx
      - src/components/tpo/tpo-topbar-new-menu.tsx
      - src/components/auth/device-list.tsx
      - src/components/auth/login-form.tsx
      - src/app/e2e/ux-g160-g133-fixture/**
      - tests/unit/tpo-timed-debar-ux.test.ts
      - tests/unit/auth-ux-group-g133.test.ts
      - tests/e2e/ux-g160-g133.spec.ts
      - .github/workflows/ux-g160-g133-acceptance.yml

permissions:
  contents: read

jobs:
  scoped-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      UX_G160_G133_FIXTURE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact triggering source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Scoped lint for authentic components and acceptance
        run: >-
          npx eslint
          src/components/tpo/tpo-timed-debar-control.tsx
          src/components/tpo/tpo-topbar-new-menu.tsx
          src/components/auth/device-list.tsx
          src/components/auth/login-form.tsx
          src/app/e2e/ux-g160-g133-fixture/page.tsx
          tests/unit/tpo-timed-debar-ux.test.ts
          tests/unit/auth-ux-group-g133.test.ts
          tests/e2e/ux-g160-g133.spec.ts
      - name: Positive and negative behavior invariants
        run: >-
          npx vitest run
          tests/unit/tpo-timed-debar-ux.test.ts
          tests/unit/auth-ux-group-g133.test.ts
          tests/unit/chat12-timed-debar-round3.test.ts
          tests/unit/tpo-topbar-links.test.ts
          --reporter=dot
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real component desktop/mobile browser acceptance
        run: >-
          npx playwright test
          tests/e2e/ux-g160-g133.spec.ts
          --project=chromium --reporter=line
      - name: TypeScript integrity
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Save screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g160-g133-browser-${{ github.run_id }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 7
