name: UX-G080 recruiter route UX acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/app/(authenticated)/recruiter/calendar/error.tsx
      - src/app/(authenticated)/recruiter/colleges/error.tsx
      - src/app/(authenticated)/recruiter/company/error.tsx
      - src/app/(authenticated)/recruiter/drives/error.tsx
      - src/app/(authenticated)/recruiter/error.tsx
      - src/app/(authenticated)/recruiter/not-found.tsx
      - src/app/(authenticated)/recruiter/colleges/loading.tsx
      - src/app/(authenticated)/recruiter/drives/loading.tsx
      - src/app/e2e/ux-recruiter-recovery/**
      - tests/unit/ux-g080-recruiter-recovery.test.tsx
      - tests/e2e/ux-g080-recruiter-recovery.spec.ts
      - .github/workflows/ux-g080-recruiter-acceptance.yml
permissions:
  contents: read
concurrency:
  group: ux-g080-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Scoped lint
        run: npx eslint 'src/app/(authenticated)/recruiter/{calendar,colleges,company,drives}/error.tsx' 'src/app/(authenticated)/recruiter/error.tsx' 'src/app/(authenticated)/recruiter/not-found.tsx' 'src/app/(authenticated)/recruiter/{colleges,drives}/loading.tsx' src/app/e2e/ux-recruiter-recovery tests/unit/ux-g080-recruiter-recovery.test.tsx tests/e2e/ux-g080-recruiter-recovery.spec.ts
      - name: Focused unit tests
        run: npx vitest run tests/unit/ux-g080-recruiter-recovery.test.tsx --reporter=dot
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive recovery acceptance
        run: npx playwright test tests/e2e/ux-g080-recruiter-recovery.spec.ts --project=chromium --reporter=line
      - name: Full TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Capture screenshots and trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g080-recruiter-desktop-mobile
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
