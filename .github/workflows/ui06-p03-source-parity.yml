name: UI-06 P03 — Source Parity (projects and mentorship)

on:
  push:
    paths:
      - "src/app/(authenticated)/admin/projects/**"
      - "src/app/(authenticated)/mentor/**"
      - "src/app/superadmin/projects/**"
      - "docs/planning/ui-inventory-ui06.json"
      - "tests/ui06-source-parity.test.mjs"
  pull_request:
    paths:
      - "src/app/(authenticated)/admin/projects/**"
      - "src/app/(authenticated)/mentor/**"
      - "tests/ui06-source-parity.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui06-p03-source-parity:
    name: UI-06 P03 source parity (no browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run UI-06 source parity test
        run: node --test tests/ui06-source-parity.test.mjs
