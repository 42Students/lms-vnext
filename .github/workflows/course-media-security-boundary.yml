# Narrow, fail-fast security regression gate for authenticated course media
# writes/reads. Real database, edge ingress and storage acceptance remain
# separate release gates; passing these unit/HTTP tests is not production proof.
name: Course media and content security boundary

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/api/courses/**"
      - "src/modules/courses/course-thumbnail-url-policy.ts"
      - "src/modules/courses/course-display-validation.ts"
      - "src/modules/courses/course-display-service.ts"
      - "src/modules/courses/course-image-service.ts"
      - "src/modules/courses/validation.ts"
      - "src/modules/courses/learner-course-card-media-model.ts"
      - "src/lib/bounded-json-request.ts"
      - "tests/unit/course-display-content.test.ts"
      - "tests/unit/learner-course-card-media-model.test.ts"
      - "tests/unit/chat3-course-cover-link-safety.test.ts"
      - "tests/unit/course-thumbnail-url-security.test.ts"
      - "tests/unit/course-image-bounded-http-security.test.ts"
      - "tests/unit/course-display-bounded-http-security.test.ts"
      - "tests/unit/course-display-private-cache-security.test.ts"
      - "tests/unit/course-image-private-response-security.test.ts"
      - ".github/workflows/course-media-security-boundary.yml"
  push:
    branches: [main]
    paths:
      - "src/app/api/courses/**"
      - "src/modules/courses/course-thumbnail-url-policy.ts"
      - "src/modules/courses/course-display-validation.ts"
      - "src/modules/courses/course-display-service.ts"
      - "src/modules/courses/course-image-service.ts"
      - "src/modules/courses/validation.ts"
      - "src/modules/courses/learner-course-card-media-model.ts"
      - "src/lib/bounded-json-request.ts"
      - "tests/unit/course-display-content.test.ts"
      - "tests/unit/learner-course-card-media-model.test.ts"
      - "tests/unit/chat3-course-cover-link-safety.test.ts"
      - "tests/unit/course-thumbnail-url-security.test.ts"
      - "tests/unit/course-image-bounded-http-security.test.ts"
      - "tests/unit/course-display-bounded-http-security.test.ts"
      - "tests/unit/course-display-private-cache-security.test.ts"
      - "tests/unit/course-image-private-response-security.test.ts"
      - ".github/workflows/course-media-security-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-media-security-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  course-media-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Course authoring, media URL policy and fallback contracts
        run: |
          npx vitest run \
            tests/unit/course-display-content.test.ts \
            tests/unit/learner-course-card-media-model.test.ts \
            tests/unit/chat3-course-cover-link-safety.test.ts \
            tests/unit/course-thumbnail-url-security.test.ts
      - name: Streamed input, authorization and no-cache HTTP boundaries
        run: |
          npx vitest run \
            tests/unit/course-image-bounded-http-security.test.ts \
            tests/unit/course-display-bounded-http-security.test.ts \
            tests/unit/course-display-private-cache-security.test.ts \
            tests/unit/course-image-private-response-security.test.ts
