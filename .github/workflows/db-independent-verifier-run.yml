# independent verifier refresh: 2026-10-12T14:38Z
name: Independent DB Verifier Exercise

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/db-independent-verifier-run.yml"
      - "scripts/db-independent-verify.mjs"
      - "tests/db-independent-verifier.test.mjs"
      - "tests/db09-collaboration-registered-pg-acceptance.mjs"
      - "tests/db09-share-registered-pg-acceptance.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact triggering commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "INDEPENDENT_VERIFY_SHA=$actual" >> "$GITHUB_ENV"
          echo "Verifying exact event commit $actual"
      - name: Run repository-owned CI-independent verifier
        run: npm run db:verify:independent
      - name: Show verifier evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ls -la .verification || true
          for f in .verification/db-independent-*.json; do
            test -f "$f" || continue
            cat "$f"
          done
      - name: Upload verifier evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: independent-db-verifier-${{ github.sha }}
          path: .verification/
          if-no-files-found: warn
          retention-days: 7
