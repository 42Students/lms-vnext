# independent verifier refresh: 2026-10-12T14:38Z
name: Independent DB Verifier Exercise

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/db-independent-verifier-run.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pin latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "INDEPENDENT_VERIFY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Verifying $(git rev-parse HEAD)"
      - name: Run repository-owned CI-independent verifier
        run: npm run db:verify:independent
      - name: Show verifier evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ls -la .verification || true
          for f in .verification/db-independent-*.json; do
            test -f "$f" || continue
            cat "$f"
          done
      - name: Upload verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-db-verifier-${{ github.sha }}
          path: .verification/
          if-no-files-found: warn
          retention-days: 7
