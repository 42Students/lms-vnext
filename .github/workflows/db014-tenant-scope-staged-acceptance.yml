
name: DB-014 cross-domain tenant boundary staged PostgreSQL acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/db014-cross-domain-scope-staged-pg.test.mjs"
      - "drizzle/0317_db014_placement_fk_validation.sql"
      - "drizzle/0318_db014_cross_domain_event_guards.sql"
      - "tests/db014-registered-guards-sql-source.test.mjs"
      - "drizzle/0319_db020_grade_event_source_action.sql"
      - "tests/db020-registered-grade-event-provenance-pg.test.mjs"
      - "tests/db014-registered-tenant-catalog-pg.test.mjs"
      - "tests/db014-cascade-retention-source.test.mjs"
      - "tests/db014-cascade-retention-registered-pg.test.mjs"
      - "drizzle/0325_db014_cascade_retention_fences.sql"
      - "tests/db014-placement-fk-validation-staged-pg.test.mjs"
      - "docs/planning/sql/db014-placement-fk-validation-candidate.sql"
      - "docs/planning/sql/db14-cross-domain-event-scope-candidate.sql"
      - ".github/workflows/db014-tenant-scope-staged-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: db014-staged-pg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  db014-staged-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB014_STAGED_PG: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pin triggering source SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Registered migration journal integrity
        run: npm run db:journal:verify
      - name: Registered DB014 SQL source parser/guard regression
        run: node --test tests/db014-registered-guards-sql-source.test.mjs
      - name: DB014 cascade retention migration source contract
        run: node --test tests/db014-cascade-retention-source.test.mjs
      - name: Reset, migrate and seed strictly disposable PostgreSQL 17
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: DB020 source_action registered nullable column proof
        run: node --test tests/db020-registered-grade-event-provenance-pg.test.mjs
      - name: Registered migration idempotence
        run: npm run db:migrate
      - name: Validate two legacy NOT VALID placement FKs in rollback-only PG transaction
        run: node --test tests/db014-placement-fk-validation-staged-pg.test.mjs
      - name: Read-only registered PostgreSQL FK catalog
        run: node --test tests/db014-registered-tenant-catalog-pg.test.mjs
      - name: DB014 registered retained-history parent DELETE and TRUNCATE negatives
        run: node --test tests/db014-cascade-retention-registered-pg.test.mjs
      - name: Registered 0318 event, notification and group-history tenant negatives
        run: node --test tests/db014-cross-domain-scope-staged-pg.test.mjs
      # A focused registered-guard witness cannot itself close the global
      # DB014 tenant, retention, authorizations and phase certification gate.
      - name: Registered journal must not have been modified by the witness
        run: |
          npm run db:journal:verify
          test -z "$(git status --porcelain -- drizzle/)"
