name: UX-G163 shared interactive kit acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/components/ui/avatar.tsx
      - src/components/ui/button.tsx
      - src/components/ui/filter-bar.tsx
      - src/components/ui/breadcrumbs.tsx
      - src/components/ui/error-state.tsx
      - src/app/e2e/ux-kit-actions/**
      - tests/unit/ux-g163-shared-actions.test.tsx
      - tests/e2e/ux-g163-shared-actions.spec.ts
      - .github/workflows/ux-g163-shared-actions-acceptance.yml
permissions:
  contents: read
concurrency:
  group: ux-g163-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: development
      E2E_AUTH_ENABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Lint affected components and fixtures
        run: npx eslint src/components/ui/avatar.tsx src/components/ui/button.tsx src/components/ui/filter-bar.tsx src/components/ui/breadcrumbs.tsx src/components/ui/error-state.tsx src/app/e2e/ux-kit-actions/page.tsx src/app/e2e/ux-kit-actions/ux-kit-actions-harness.tsx tests/unit/ux-g163-shared-actions.test.tsx tests/e2e/ux-g163-shared-actions.spec.ts
      - name: Focused unit regression
        run: npx vitest run tests/unit/ux-g163-shared-actions.test.tsx tests/ux-playbook-primitives.test.tsx --reporter=dot
      - name: Chromium setup
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile shared controls
        run: npx playwright test tests/e2e/ux-g163-shared-actions.spec.ts --project=chromium --reporter=line
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Save screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g163-desktop-mobile
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
