name: UX-G041 College workspaces template handoff acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/(authenticated)/college/projects/create/page.tsx'
      - 'src/app/(authenticated)/college/projects/workspaces/new/page.tsx'
      - 'src/app/(authenticated)/college/projects/workspaces/page.tsx'
      - 'src/app/(authenticated)/college/projects/workspaces/new/error.tsx'
      - 'src/modules/projects/legacy-college-workspaces-list-query.ts'
      - 'src/modules/projects/legacy-class-workspace-create-query.ts'
      - 'tests/unit/ux-g041-college-class-workspace-handoff.test.ts'
      - 'tests/e2e/ux-g041-college-workspace-handoff.spec.ts'
      - '.github/workflows/ux-g041-college-workspace-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: ux-g041-college-workspaces-${{ github.ref }}
  cancel-in-progress: false

jobs:
  college-workspace-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_JSON_OUTPUT_NAME: ux-g041-college-results.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact SHA and targeted lint
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx eslint 'src/app/(authenticated)/college/projects/create/page.tsx' \
            'src/app/(authenticated)/college/projects/workspaces/new/page.tsx' \
            'src/app/(authenticated)/college/projects/workspaces/page.tsx' \
            'src/app/(authenticated)/college/projects/workspaces/new/error.tsx' \
            src/modules/projects/legacy-college-workspaces-list-query.ts \
            src/modules/projects/legacy-class-workspace-create-query.ts \
            tests/unit/ux-g041-college-class-workspace-handoff.test.ts \
            tests/e2e/ux-g041-college-workspace-handoff.spec.ts
      - name: Types and regression tests
        run: |
          npm run typecheck
          npx vitest run tests/unit/ux-g041-college-class-workspace-handoff.test.ts \
            tests/unit/chat2-college-workspace-legacy-query.test.ts \
            tests/unit/UX-college-projects-workspaces-workspaceId-01.test.ts --reporter=dot
          node --test tests/ux-groups.test.mjs
      - name: Prepare isolated seeded database
        run: npm run db:e2e:prepare
      - name: Ephemeral browser-only secrets
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Authenticated desktop and mobile browser acceptance
        run: |
          npx playwright test tests/e2e/ux-g041-college-workspace-handoff.spec.ts --project=chromium --reporter=line,json
          node -e 'const s=require("./ux-g041-college-results.json").stats;if(s.expected!==8||s.unexpected!==0||s.flaky!==0||s.skipped!==0)process.exit(1)'
      - name: Preserve browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g041-college-${{ github.run_id }}
          path: |
            test-results/**
            playwright-report/**
            ux-g041-college-results.json
          if-no-files-found: ignore
          retention-days: 14
