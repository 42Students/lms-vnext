name: Faculty Students prototype acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/faculty-students-prototype-acceptance.yml"
      - "tests/e2e/faculty-students-prototype.spec.ts"
      - "tests/e2e/faculty-course-students.spec.ts"
      - "src/components/courses/faculty-prototype-student-directory.tsx"
      - "src/modules/courses/faculty-course-home-service.ts"
## Dedicated Faculty browser verification; repository-wide TypeScript
## remains a separate mandatory gate in CI.
permissions:
  contents: read
concurrency:
  group: faculty-students-prototype-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable E2E PostgreSQL
        run: npm run db:e2e:prepare
      - name: Generate isolated auth credentials
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Screenshot Students and retained privacy flows
        run: npx playwright test tests/e2e/faculty-students-prototype.spec.ts tests/e2e/faculty-course-students.spec.ts --workers=1
      # Do not let unrelated TPO/Recruiter TypeScript errors hide Faculty E2E.
      # Global TypeScript is still a mandatory final acceptance gate.
