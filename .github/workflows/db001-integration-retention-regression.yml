name: DB-001 full-verifier retained-fixture regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/db001-integration-retention-regression.yml"
      - "tests/integration/placements-p7-recruiters.test.ts"
      - "tests/integration/placements-p8-offers.test.ts"
      - "tests/integration/placements-requests.test.ts"
      - "tests/integration/courses-c3-progress.test.ts"
      - "tests/integration/courses-ui2a-faculty.test.ts"
      - "tests/support/learner-positive-fixture.ts"
      - "tests/integration/db06-assessment-parent-scope.test.ts"
      - "drizzle/meta/_journal.json"
permissions:
  contents: read
jobs:
  disposable-retention-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DATABASE_URL: ""
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB06_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact pinned migrations and disposable reset
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm run db:journal:verify
          npm run db:test:prepare
      - name: Retention-aware placement integration fixtures
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npx vitest run --config vitest.db.config.ts \
            tests/integration/placements-p7-recruiters.test.ts \
            tests/integration/placements-p8-offers.test.ts \
            tests/integration/placements-requests.test.ts
      - name: Keep verified source unchanged
        if: success()
        run: test -z "$(git diff --name-only HEAD)"
