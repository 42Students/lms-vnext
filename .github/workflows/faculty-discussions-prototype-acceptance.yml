name: Faculty Discussions prototype acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/faculty-discussions-prototype-acceptance.yml"
      - "src/app/(authenticated)/teacher/courses/*/discussions/**"
      - "src/components/courses/learner-course-discussion.tsx"
      - "tests/e2e/faculty-discussions-prototype.spec.ts"
      - "src/modules/courses/faculty-discussion-post-recovery.ts"
      - "tests/unit/faculty-discussion-post-recovery.test.ts"
## Focused Faculty E2E is independent of the repository-wide TS gate.
## Full TypeScript is still mandatory in the separate CI workflow.
permissions:
  contents: read
concurrency:
  group: faculty-discussions-prototype-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused discussion write recovery model
        run: npx vitest run tests/unit/faculty-discussion-post-recovery.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable E2E PostgreSQL
        run: npm run db:e2e:prepare
      - name: Ephemeral identity keys
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Screenshot #08 Faculty Discussions functional browser acceptance
        run: npx playwright test tests/e2e/faculty-discussions-prototype.spec.ts --workers=1
