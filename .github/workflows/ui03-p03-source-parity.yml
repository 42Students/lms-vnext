name: UI-03 P03 Source Parity — Learner/Faculty Profiles
on:
  push:
    paths:
      - 'src/app/(authenticated)/(learner)/profile/**'
      - 'src/app/(authenticated)/learn/profile/**'
      - 'src/app/(authenticated)/teacher/profile/**'
      - 'src/app/(authenticated)/college/profile/**'
      - 'src/app/(authenticated)/hr/profile/**'
      - 'src/app/(authenticated)/mentor/profile/**'
      - 'src/app/(authenticated)/tpo/profile/**'
      - 'src/app/(authenticated)/admin/people/**'
      - 'src/app/(authenticated)/college/people/**'
      - 'src/app/(authenticated)/admin/students/**'
      - 'src/app/(authenticated)/college/students/**'
      - 'src/app/(authenticated)/college/faculty/**'
      - 'src/app/(authenticated)/admin/faculty-assignment/**'
      - 'src/app/(authenticated)/tpo/students/**'
      - 'docs/planning/ui-inventory-ui03.json'
      - 'docs/planning/ui-strings-ui03.json'
      - 'tests/ui03-source-parity.test.mjs'
  workflow_dispatch:

jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: UI-03 source parity test
        run: node --test tests/ui03-source-parity.test.mjs
