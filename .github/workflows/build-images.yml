name: Build images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit SHA to build
        default: main
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Set short SHA
        run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build migrator image
        run: |
          docker build --target migrator \
            -t lms-vnext/migrator:${{ env.SHA }} .

      - name: Build web image
        run: |
          docker build --target runner \
            -t lms-vnext/web:${{ env.SHA }} .

      - name: Vulnerability scan of both images (report only; SEC-17-007, SEC-17-020)
        # Trivy is pinned by digest. HIGH and CRITICAL findings that already have a fix are listed in the job log and
        # in the trivy-reports artifact. Exit code stays 0 until the baseline is clean; then set --exit-code 1.
        run: |
          mkdir -p trivy-reports
          for image in web migrator; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              ghcr.io/aquasecurity/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format table \
              lms-vnext/$image:${{ env.SHA }} | tee trivy-reports/$image.txt
          done

      - name: Save images as tarballs
        run: |
          docker save lms-vnext/migrator:${{ env.SHA }} | gzip > migrator.tar.gz
          docker save lms-vnext/web:${{ env.SHA }}      | gzip > web.tar.gz
          echo "${{ env.SHA }}" > sha.txt
          # Integrity of what leaves CI (SEC-18-016): the sums are in the artifact AND printed in this log, so
          # the deploy script can compare the downloaded files with a second, independent record of this run.
          sha256sum migrator.tar.gz web.tar.gz > SHA256SUMS
          echo "IMAGE-SUMS-BEGIN"; cat SHA256SUMS; echo "IMAGE-SUMS-END"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-images-${{ env.SHA }}
          path: |
            migrator.tar.gz
            web.tar.gz
            sha.txt
            SHA256SUMS
            trivy-reports
          retention-days: 7
