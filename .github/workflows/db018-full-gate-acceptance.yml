# Independent DB-018 FULL witness gate, not a replacement for DB-020.
# All writes are confined to a seeded disposable PostgreSQL 17 test database.
name: DB-018 complete PostgreSQL negative and race acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/db018-full-gate-acceptance.yml"
      - "tests/support/db018-test-target.mjs"
      - "src/modules/activity/notification-service.ts"
      - "tests/integration/activity-foundation.test.ts"
      - "src/modules/activity/service.ts"
      - "src/db/schema/**"
      - "drizzle/meta/_journal.json"
      - "drizzle/meta/0330_snapshot.json"
      - "drizzle/*.sql"
      - "tests/integration/db018-relational-and-boundary-witnesses.test.ts"
      - "tests/integration/db18-registered-negative-witnesses.test.ts"
      - "tests/integration/db18-concurrency-witnesses.test.ts"
      - "tests/integration/db18-known-race-gaps.test.ts"
      - "tests/integration/db18-placement-race-gap.test.ts"
      - "tests/integration/db18-notification-race.test.ts"
      - "tests/integration/db18-scheduled-lease-race.test.ts"
      - "tests/integration/db18-outbound-service-race.test.ts"
      - "tests/integration/projects-p5-lifecycle.test.ts"
      - "tests/integration/placements-p8-offers.test.ts"
      - "tests/integration/placements-db08-batches.test.ts"
      - "tests/integration/db18-assignment-receipt-race.test.ts"
      - "tests/integration/db18-registered-file-one-shot-race.test.ts"
      - "src/modules/courses/assignment-submission-file-service.ts"
      - "tests/integration/db18-shared-ops-race.test.ts"
      - "tests/integration/super-admin-db10-tracker-workflow.test.ts"
      - "tests/db-parity-pass5.test.mjs"
      - "tests/integration/db18-witness-index.json"
      - "docs/planning/database-parity-pass5-probe-manifest.json"
      - "tests/integration/groups-db03.test.ts"
      - "tests/integration/academics-a2.test.ts"
      - "tests/integration/graceful-telegram-persistence.test.ts"
      - "tests/integration/db067-global-email-pre-send.test.ts"
      - "src/modules/log-alerts/reporter.ts"
      - "tests/integration/faculty-c4-reports-audit-contact.test.ts"
      - "tests/integration/college-admin-attendance.test.ts"
      - "src/modules/attendance/faculty-service.ts"
      - "src/modules/attendance/admin-service.ts"
      - "src/modules/academics/schedule-service.ts"
      - "src/modules/placements/application-service.ts"
      - "src/modules/groups/service.ts"
      - "src/modules/academics/enrollment-service.ts"
      - "src/modules/academics/period-service.ts"
      - "src/modules/academics/college-period-lifecycle-service.ts"
      - "drizzle/0317_db014_placement_fk_validation.sql"
      - "drizzle/0318_db014_cross_domain_event_guards.sql"
      - "drizzle/0319_db020_grade_event_source_action.sql"
      - "tests/db014-cross-domain-scope-staged-pg.test.mjs"
      - "tests/db014-registered-tenant-catalog-pg.test.mjs"
      - "tests/db020-registered-grade-event-provenance-pg.test.mjs"

permissions:
  contents: read

concurrency:
  group: lms-db018-full-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  db018-full-negative-race:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB018_ISOLATED_TEST_DATABASE: "1"
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB06_ISOLATED_TEST_DATABASE: "1"
      DB014_STAGED_PG: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Source manifest and witness identity cross-check
        run: node --test tests/db-parity-pass5.test.mjs
      - name: Confirm registered migration journal and disposable target
        run: npm run db:journal:verify
      - name: Prepare isolated PostgreSQL and full seed
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Prove idempotent migration replay
        run: npm run db:migrate
      - name: Run all relational, direct-negative and two-session race witnesses
        run: |
          npx vitest run --config vitest.db.registered.config.ts \
            tests/integration/db018-relational-and-boundary-witnesses.test.ts \
            tests/integration/db18-registered-negative-witnesses.test.ts \
            tests/integration/db18-concurrency-witnesses.test.ts \
            tests/integration/db18-known-race-gaps.test.ts \
            tests/integration/db18-placement-race-gap.test.ts \
            tests/integration/db18-notification-race.test.ts \
            tests/integration/groups-db03.test.ts \
            tests/integration/courses-c4b-quizzes.test.ts \
            tests/integration/db18-scheduled-lease-race.test.ts
      - name: P5-R09 and P5-R21 registered real outbound producer and fake provider
        run: |
          npx vitest run --config vitest.db.registered.config.ts tests/integration/db18-outbound-service-race.test.ts
      - name: P5-R18 announcement edit/delete/restore CAS and P5-R19 tracker event atomicity on registered PG17
        run: |
          npx vitest run --config vitest.db.registered.config.ts tests/integration/db18-shared-ops-race.test.ts
      - name: P5-R19 competing tracker status and root-cause writers on registered PG17
        run: |
          npx vitest run --config vitest.db.registered.config.ts tests/integration/super-admin-db10-tracker-workflow.test.ts -t P5-R19
      - name: P5-R14 competing sprint starts and reopen on registered PG17
        run: |
          npx vitest run --config vitest.db.registered.config.ts tests/integration/projects-p5-lifecycle.test.ts -t P5-R14
      - name: P5-R15 competing application against close, coordinator and role state on registered PG17
        run: |
          npx vitest run --config vitest.db.registered.config.ts tests/integration/placements-p8-offers.test.ts -t P5-R15
      - name: P5-R17 concurrent offer issuance and learner response on registered PG17
        run: |
          npx vitest run --config vitest.db.registered.config.ts tests/integration/placements-p8-offers.test.ts -t P5-R17
      - name: P5-R16 ordered bulk eligibility decisions and stale undo on registered PG17
        env:
          DB08_ISOLATED_TEST_DATABASE: "1"
          DB08_MIGRATION_APPLIED: "1"
        run: |
          npx vitest run --config vitest.db.config.ts tests/integration/placements-db08-batches.test.ts -t P5-R16
      - name: P5-R11 schedule and period-close race with real A2 producer
        run: |
          npx vitest run --config vitest.db.registered.config.ts tests/integration/academics-a2.test.ts
      - name: P5-R10 real log-alert producer and concurrent signature/regression witness
        env:
          DB10_DISPOSABLE_TEST_DATABASE: "true"
        run: |
          npx vitest run --config vitest.db.registered.config.ts tests/integration/graceful-telegram-persistence.test.ts
      - name: P5-R09 and P5-R21 registered outbound worker claim and late suppression
        env:
          DATABASE_URL: ""
          DB067_DISPATCH_ACCEPTANCE: "1"
        run: |
          npx vitest run --config vitest.db.registered.config.ts tests/integration/db067-global-email-pre-send.test.ts
      - name: DB045 learner revocation race and immutable audit consumer witnesses
        run: |
          npx vitest run --config vitest.db.registered.config.ts \
            tests/integration/faculty-c4-reports-audit-contact.test.ts \
            tests/integration/college-admin-attendance.test.ts
      - name: Current registered DB014 tenant scope, catalog and DB020 provenance negatives
        run: |
          node --test tests/db014-registered-tenant-catalog-pg.test.mjs tests/db014-cross-domain-scope-staged-pg.test.mjs tests/db020-registered-grade-event-provenance-pg.test.mjs
      - name: P5-R13 registered live FILE producer one-shot race (distinct from staged receipt)
        run: |
          npx vitest run --config vitest.db.registered.config.ts tests/integration/db18-registered-file-one-shot-race.test.ts
      - name: P5-R13 scanned FILE receipt duplicate submission on registered PG17
        run: |
          npx vitest run --config vitest.db.registered.config.ts tests/integration/db18-assignment-receipt-race.test.ts -t P5-R13
      - name: Explicit evidence scope
        if: always()
        run: |
          echo "DB018 execution covers registered PG17 direct SQL and race tests."
          echo "A green job alone does not sign off source field parity DB019 or global DB020."
