name: UI-08 P03 — Source Parity (TPO and recruiter CRM)

on:
  push:
    paths:
      - "src/app/(authenticated)/tpo/**"
      - "src/app/(authenticated)/hr/**"
      - "src/app/(authenticated)/recruiter/**"
      - "docs/planning/ui-inventory-ui08.json"
      - "tests/ui08-source-parity.test.mjs"
  pull_request:
    paths:
      - "src/app/(authenticated)/tpo/**"
      - "tests/ui08-source-parity.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui08-p03-source-parity:
    name: UI-08 P03 source parity (no browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run UI-08 source parity test
        run: node --test tests/ui08-source-parity.test.mjs
