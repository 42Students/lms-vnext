name: API04-P01 Courses content resources learner progress crosswalk gate

on:
  push:
    branches: [main]
    paths:
      - 'docs/planning/api-crosswalk-api04.json'
      - 'docs/planning/api-inventory-api04.json'
      - 'tests/api04-endpoint-crosswalk.test.mjs'
      - '.github/workflows/api04-p01-crosswalk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api04-p01-${{ github.sha }}
  cancel-in-progress: false

jobs:
  crosswalk:
    name: "API04-P01 courses/content/resources endpoint crosswalk"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact commit SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: API04-P01 endpoint crosswalk gate
        run: node --test tests/api04-endpoint-crosswalk.test.mjs
      - name: Print summary
        if: always()
        run: |
          node -e "
            const c = JSON.parse(require('fs').readFileSync('docs/planning/api-crosswalk-api04.json','utf8'));
            const s = c.summary;
            console.log('=== API04-P01 CROSSWALK SUMMARY ===');
            console.log('Total: ' + s.total + ' | MAPPED: ' + s.mapped + ' | REDESIGNED: ' + s.redesigned + ' | RETIRED: ' + s.retired + ' | MISSING: ' + s.missing);
          "
      - name: Scope boundary
        if: always()
        run: |
          echo "API04-P01: Courses/content/resources/learner-progress endpoint crosswalk only."
          echo "Integration tests (API04-P02) and other milestones remain OPEN."
