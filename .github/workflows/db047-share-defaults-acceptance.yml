name: DB-047 registered company relationship share-defaults acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/db09-company-share-defaults-staging.test.mjs"
      - "scripts/db017-share-defaults-pg-acceptance.mjs"
      - "src/db/schema/placements.ts"
      - "drizzle/0043_db09_share_column_defaults.sql"
      - ".github/workflows/db047-share-defaults-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: db047-registered-${{ github.ref }}
  cancel-in-progress: false

jobs:
  db047-company-share-defaults:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB017_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify registered journal and canonical relationship field disposition
        run: |
          npm run db:journal:verify
          node --test tests/db09-company-share-defaults-staging.test.mjs
      - name: Replay all registered migrations and seed disposable PG17
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Verify migration idempotence
        run: npm run db:migrate
      - name: Verify same-company separate-college defaults and invalid disclosure JSON
        run: node scripts/db017-share-defaults-pg-acceptance.mjs
