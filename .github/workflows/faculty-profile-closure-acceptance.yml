name: Faculty Profile closure acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/faculty-profile-closure-acceptance.yml"
      - "drizzle/0318_db014_cross_domain_event_guards.sql"
      - "src/app/(authenticated)/teacher/profile/**"
      - "src/components/people/faculty-profile-editor.tsx"
      - "src/components/people/faculty-avatar-upload.tsx"
      - "src/modules/people/faculty-profile-readiness.ts"
      - "src/modules/people/faculty-profile-completeness-model.ts"
      - "tests/unit/faculty-profile-completeness-closure.test.ts"
      - "tests/unit/faculty-profile-social-merge-closure.test.ts"
      - "src/modules/people/faculty-self-section-model.ts"
      - "src/modules/people/faculty-profile-self.staged.ts"
      - "src/modules/people/faculty-self-section-service.ts"
      - "tests/unit/faculty-profile-page-closure.test.tsx"
      - "tests/integration/faculty-profile-schema-ready.test.ts"
      - "tests/integration/faculty-self-document-scope.test.ts"
      - "tests/e2e/faculty-profile-account.spec.ts"
permissions:
  contents: read
  statuses: write
concurrency:
  group: faculty-profile-closure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB06_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:journal:verify
      - name: Prepare real disposable PostgreSQL
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Verify private profile migration and real self-edit writes
        run: >-
          npx vitest run --config vitest.db.config.ts
          tests/integration/faculty-profile-schema-ready.test.ts
          tests/integration/faculty-self-document-scope.test.ts
      - name: Verify authorized UI, role denial and sensitive-data schemas
        run: >-
          npx vitest run
          tests/unit/faculty-profile-page-closure.test.tsx
          tests/unit/faculty-profile-completeness-closure.test.ts
          tests/unit/faculty-profile-social-merge-closure.test.ts
          tests/unit/faculty-profile-storage-contract.test.ts
          tests/unit/faculty-profile-error-model.test.ts

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:e2e:prepare
      - name: Authorize disposable E2E faculty
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Verify full Faculty self-profile on desktop and mobile
        run: npx playwright test tests/e2e/faculty-profile-account.spec.ts --workers=1

  record_result:
    if: ${{ always() }}
    needs: [postgres, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const postgres = "${{ needs.postgres.result }}";
            const browser = "${{ needs.browser.result }}";
            const success = postgres === "success" && browser === "success";
            await github.rest.repos.createCommitStatus({
              owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,
              state:success ? "success" : "failure",
              context:"faculty-profile-closure-acceptance/pg-browser",
              description:"Faculty Profile PostgreSQL, UI and browser",
              target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
