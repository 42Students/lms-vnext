# Source-quality acceptance for DB19-P29 — admin audit, settings and job locks.
name: Admin audit settings job locks source acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/db019-p29-field-review.test.mjs"
      - "docs/planning/db019-p29-field-review.json"
      - '.github/workflows/db019-p29-source-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: db019-p29-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-quality:
    name: "DB19-P29 admin audit/settings field census"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact commit SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: "DB19-P29 source field census (no database)"
        run: node --test tests/db019-p29-field-review.test.mjs
      - name: Scope boundary
        if: always()
        run: |
          echo "DB19-P29 source-quality gate only."
          echo "Runtime PG17 producer/consumer acceptance and DB019/DB020 remain OPEN."
