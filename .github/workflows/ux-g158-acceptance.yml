name: UX G158 TPO interaction acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/components/tpo/tpo-notice-delete-confirm.tsx
      - src/components/tpo/tpo-notice-read-progress.tsx
      - src/components/tpo/tpo-notice-undo-toast.tsx
      - src/app/e2e/ux-g158-fixture/**
      - tests/unit/ux-g158-notices.test.ts
      - tests/e2e/ux-g158.spec.ts
      - .github/workflows/ux-g158-acceptance.yml

permissions:
  contents: read

jobs:
  scoped-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      UX_G158_FIXTURE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify triggering source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Scoped lint
        run: >-
          npx eslint
          src/components/tpo/tpo-notice-delete-confirm.tsx
          src/components/tpo/tpo-notice-read-progress.tsx
          src/components/tpo/tpo-notice-undo-toast.tsx
          src/app/e2e/ux-g158-fixture/page.tsx
          tests/unit/ux-g158-notices.test.ts
          tests/e2e/ux-g158.spec.ts
      - name: Positive and negative unit checks
        run: npx vitest run tests/unit/ux-g158-notices.test.ts --reporter=dot
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile real-component acceptance
        run: npx playwright test tests/e2e/ux-g158.spec.ts --project=chromium --reporter=line
      - name: TypeScript integrity
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Attach browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-g158-browser-evidence
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 7
