# Focused source-level regression gate for two privileged machine-only writers.
# This is not deployment configuration or malware-scanning certification.
name: Security - machine scheduler and scanner boundaries

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/api/internal/operations/notification-scheduler/route.ts"
      - "src/app/api/internal/storage/scan-verdict/route.ts"
      - "src/modules/storage/scan-verdict-request-guard.ts"
      - "tests/unit/security-machine-only-scheduler-and-scanner.test.ts"
      - "tests/unit/api-origin-guard.test.ts"
      - ".github/workflows/security-machine-workers.yml"
  push:
    branches: [main]
    paths:
      - "src/app/api/internal/operations/notification-scheduler/route.ts"
      - "src/app/api/internal/storage/scan-verdict/route.ts"
      - "src/modules/storage/scan-verdict-request-guard.ts"
      - "tests/unit/security-machine-only-scheduler-and-scanner.test.ts"
      - "tests/unit/api-origin-guard.test.ts"
      - ".github/workflows/security-machine-workers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: machine-worker-security-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  machine-worker-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Machine-only origin, secret, parameter and body checks
        run: npx vitest run tests/unit/security-machine-only-scheduler-and-scanner.test.ts tests/unit/api-origin-guard.test.ts
