# API02-P02: Academics, groups, electives integration gate.
# Source-only — no database needed.
# Verifies crosswalk integrity, MAPPED/REDESIGNED file existence, auth guard
# coverage on academics/college routes, and 24-gap MISSING catalogue.
name: API02-P02 Academics groups electives integration gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/api02-integration.test.mjs"
      - "docs/planning/api-crosswalk-api02.json"
      - "src/app/api/academics/**"
      - "src/app/api/college/**"
      - ".github/workflows/api02-p02-integration.yml"

permissions:
  contents: read

concurrency:
  group: api02-p02-${{ github.sha }}
  cancel-in-progress: false

jobs:
  integration:
    name: "API02-P02 academics/groups/electives integration gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact commit SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: API02-P02 academics integration gate
        run: node --test tests/api02-integration.test.mjs
      - name: Scope boundary
        if: always()
        run: |
          echo "API02-P02: Academics/groups/electives source-only integration gate."
          echo "94 legacy endpoints crosswalked: 6 MAPPED, 64 REDESIGNED, 0 RETIRED, 24 MISSING."
          echo "API-03 through API-10 remain OPEN."
