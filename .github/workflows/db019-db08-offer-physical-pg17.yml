# DB019 bounded physical target check, not DB019/DB020 acceptance or
# proof of semantic parity, employer authorization or live consumer workflows.
name: DB-019 placement-offer registered physical source crosswalk PG17
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/db019-db08-offer-physical-pg17.yml"
      - "tests/db019-db08-offer-physical-pg.test.mjs"
      - "tests/unit/placement-saved-jobs-main.test.ts"
      - "src/modules/placements/saved-job-service.ts"
      - "src/modules/placements/candidate-preferences-service.ts"
      - "tests/integration/learner-preferences-write.test.ts"
      - "docs/planning/database-parity-db08-field-ledger.json"
      - "drizzle/*.sql"
      - "drizzle/meta/_journal.json"
permissions:
  contents: read
concurrency:
  group: db019-offer-physical-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offer-physical-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB019_DISPOSABLE_TEST_DATABASE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact-head journal verification
        run: npm run db:journal:verify
      - name: Replay all registered schema from zero against disposable PostgreSQL 17
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Registered schema idempotence
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
        run: npm run db:migrate
      - name: Verify P21 learner bookmark visibility and role regression policy
        run: npx vitest run tests/unit/placement-saved-jobs-main.test.ts
      - name: Verify 28 offer plus P21 saved-job/preferences physical source candidates
        run: node --test tests/db019-db08-offer-physical-pg.test.mjs
      - name: Execute P21 notification consent regression on disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
        run: npx vitest run --config vitest.db.registered.config.ts tests/integration/learner-preferences-write.test.ts -t "does not silently opt"
      - name: Execute real offer, joining, IDOR and revoked-role consumer witnesses
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
          DB03_ISOLATED_TEST_DATABASE: "1"
        run: |
          npx vitest run --config vitest.db.registered.config.ts \
            tests/integration/placements-p8-offers.test.ts \
            -t "issues an idempotent offer|keeps declined offers durable|PLACEMENTS-IDOR-01|PLACEMENTS-TPO-REVOKED-DB-01|TPO-JOIN-TRACKER-DB-35"
      - name: Scope boundary
        if: always()
        run: |
          echo "Physical source-candidate evidence only."
          echo "28 legacy offer rows and P21 26 source fields remain UNVERIFIED until exact producer/consumer and legacy semantic approval."
          echo "DB019 and DB020 task acceptance remain OPEN."
