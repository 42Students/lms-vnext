name: UX mentor teaching and TPO groups acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/app/(authenticated)/mentor/task-reviews/**
      - src/app/(authenticated)/mentor/team-coverage/**
      - src/app/(authenticated)/teach/courses/**
      - src/app/(authenticated)/tpo/team/everyone/**
      - src/app/(authenticated)/tpo/verification/**
      - tests/e2e/ux-mentor-teach-tpo-groups.spec.ts
      - .github/workflows/ux-mentor-teach-tpo-acceptance.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      MENTOR_E2E_SEED_PROJECT: "true"
      UX_SCOPED_ROLE_SEED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check scoped source and browser lint
        run: npx eslint 'src/app/(authenticated)/mentor/task-reviews/page.tsx' 'src/app/(authenticated)/mentor/team-coverage/page.tsx' 'src/app/(authenticated)/teach/courses/page.tsx' 'src/app/(authenticated)/teach/courses/[deliveryId]/page.tsx' 'src/app/(authenticated)/tpo/team/everyone/page.tsx' 'src/app/(authenticated)/tpo/verification/page.tsx' tests/e2e/ux-mentor-teach-tpo-groups.spec.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable E2E database
        run: npm run db:e2e:prepare
      - name: Seed synthetic Mentor and TPO role memberships
        env:
          ALLOW_TEST_SEED: I_ACCEPT
        run: npx tsx scripts/seed-test-tenants.ts
      - name: Generate ephemeral E2E auth secret
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Execute 7 actual desktop/mobile role UX scenarios
        run: npx playwright test tests/e2e/ux-mentor-teach-tpo-groups.spec.ts --project=chromium --reporter=line
      - name: Full TypeScript validation
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
