name: Mentor meeting capability and UI-surface acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/mentor-legacy-visual-capture.yml"
      - "src/app/(authenticated)/mentor/calendar/**"
      - "src/components/projects/mentor-meetings-calendar*"
      - "tests/e2e/mentor-legacy-calendar-visual.spec.ts"
      - "tests/e2e/w03-mentor-surfaces.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mentor-meeting-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
      MENTOR_E2E_SEED_PROJECT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare disposable Mentor browser fixture
        run: npm run db:e2e:prepare
      - name: Seed two real requested and completed meeting workflow states
        run: npx tsx scripts/audit/seed-mentor-visual-fixture.ts
      - name: Generate isolated browser authentication keys
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Verify required Mentor meeting actions and desktop/mobile usability
        run: npx playwright test --project=chromium tests/e2e/mentor-legacy-calendar-visual.spec.ts tests/e2e/w03-mentor-surfaces.spec.ts
      - name: Archive safe browser evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mentor-meeting-capability-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
