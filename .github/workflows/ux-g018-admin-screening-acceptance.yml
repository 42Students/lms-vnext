name: UX-G018 Super Admin screening seasons shortlist acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/(authenticated)/admin/placements/screenings/**'
      - 'src/app/(authenticated)/admin/placements/seasons/**'
      - 'src/app/(authenticated)/admin/placements/shortlisted/**'
      - 'tests/e2e/ux-g018-admin-screening-seasons-shortlist.spec.ts'
      - '.github/workflows/ux-g018-admin-screening-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: ux-g018-screening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scoped-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: development
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_JSON_OUTPUT_NAME: ux-g018-admin-results.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact revision, lint and tracker consistency
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx eslint tests/e2e/ux-g018-admin-screening-seasons-shortlist.spec.ts
          npm run ux:groups -- --check
      - name: Full TypeScript integrity
        run: npm run typecheck
      - name: Privacy-sensitive screening, season and shortlist unit regressions
        run: |
          npx vitest run             tests/unit/super-admin-placement-screenings-query.test.ts             tests/unit/super-admin-placement-seasons-query.test.ts             tests/unit/super-admin-placement-shortlisted-query.test.ts             tests/unit/super-admin-screening-detail.test.ts             tests/unit/super-admin-season-detail.test.ts             tests/unit/super-admin-shortlisted-detail.test.ts             tests/unit/chat13-admin-ui-placements-tenant-matrix.test.ts             --reporter=dot
      - name: Prepare disposable PostgreSQL 17 with pending and shortlisted candidates
        run: npm run db:e2e:prepare
      - name: Ephemeral actor keys
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive six page browser and learner negatives
        run: |
          npx playwright test tests/e2e/ux-g018-admin-screening-seasons-shortlist.spec.ts --project=chromium --reporter=line,json
          node -e 'const s=require("./ux-g018-admin-results.json").stats;if(s.expected!==4||s.unexpected!==0||s.flaky!==0||s.skipped!==0)process.exit(1)'
      - name: Preserve evidence artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-g018-screening-${{ github.run_id }}
          path: |
            test-results/**
            playwright-report/**
            ux-g018-admin-results.json
          if-no-files-found: ignore
          retention-days: 14
