name: UX-G005–G009 Real Super Admin UX acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/(authenticated)/admin/academics/**'
      - 'src/app/(authenticated)/admin/audit/**'
      - 'src/app/(authenticated)/admin/batch-promotion/**'
      - 'src/app/(authenticated)/admin/colleges/[collegeId]/admins/[userId]/**'
      - 'src/app/(authenticated)/admin/colleges/[collegeId]/signin/**'
      - 'src/app/(authenticated)/admin/colleges/[collegeId]/subdomain/**'
      - 'src/app/(authenticated)/admin/course-progress/**'
      - 'src/components/ux/ux-admin-ten-recovery-fixture.tsx'
      - 'tests/e2e/ux-g005-g009-real-admin.spec.ts'
      - 'tests/e2e/ux-g005-g014-admin-recovery.spec.ts'
      - 'tests/unit/ux-g005-g014-admin-route-recovery.test.ts'
      - '.github/workflows/ux-g005-g009-admin-real-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: ux-g005-g009-real-${{ github.ref }}
  cancel-in-progress: true
jobs:
  admin-five-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: 'true'
      APP_ENV: development
      UX_G005_G014_FIXTURE: '1'
      PLATFORM_HOSTS: localhost,127.0.0.1
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_JSON_OUTPUT_NAME: ux-g005-g009-results.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assert exact SHA and run scoped lint
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx eslint \
            'src/app/(authenticated)/admin/academics/loading.tsx' \
            'src/app/(authenticated)/admin/academics/sections/[sectionId]/loading.tsx' \
            'src/app/(authenticated)/admin/batch-promotion/error.tsx' \
            'src/app/(authenticated)/admin/colleges/[collegeId]/admins/[userId]/history/page.tsx' \
            'src/app/(authenticated)/admin/colleges/[collegeId]/signin/page.tsx' \
            'src/app/(authenticated)/admin/colleges/[collegeId]/subdomain/page.tsx' \
            'src/app/(authenticated)/admin/course-progress/error.tsx' \
            src/components/ux/ux-admin-ten-recovery-fixture.tsx \
            tests/e2e/ux-g005-g014-admin-recovery.spec.ts \
            tests/e2e/ux-g005-g009-real-admin.spec.ts \
            tests/unit/ux-g005-g014-admin-route-recovery.test.ts
      - name: Full TypeScript and UX group coverage
        run: |
          npm run typecheck
          node --test tests/ux-groups.test.mjs
      - name: Existing and new scoped unit assertions
        run: |
          npx vitest run \
            tests/unit/ux-g005-g014-admin-route-recovery.test.ts \
            tests/unit/chat4-superadmin-college-admin-sessions-page.test.tsx \
            tests/unit/chat4-superadmin-college-signin-page-states.test.tsx \
            tests/unit/chat3-sa-section-workspace-permission-matrix.test.ts \
            tests/unit/sa-batch-promotion-execute.test.ts \
            tests/unit/chat11-super-admin-course-progress-tenant-guard.test.ts --reporter=dot
      - name: Prepare isolated PostgreSQL, Super Admin and college data
        run: npm run db:e2e:prepare
      - name: G006 persisted batch preview and cross-college negative
        env:
          DB03_ISOLATED_TEST_DATABASE: '1'
        run: npx vitest run --config vitest.db.config.ts tests/integration/admin-batch-promotion-preview.test.ts --reporter=dot
      - name: Create ephemeral development-only identity secrets
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real responsive, persisted-scope, denial and recovery checks
        run: |
          npx playwright test tests/e2e/ux-g005-g014-admin-recovery.spec.ts tests/e2e/ux-g005-g009-real-admin.spec.ts --project=chromium --workers=1 --reporter=line,json
          node -e 'const s=require("./ux-g005-g009-results.json").stats;if(s.expected!==5||s.unexpected!==0||s.flaky!==0||s.skipped!==0)process.exit(1)'
      - name: Store desktop/mobile screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g005-g009-real-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            ux-g005-g009-results.json
          if-no-files-found: ignore
          retention-days: 14
