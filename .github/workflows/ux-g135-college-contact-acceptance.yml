name: UX-G135 College contact profile acceptance

concurrency:
  group: ux-g135-college-contact-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/components/colleges/college-contact-profile-form.tsx
      - src/app/e2e/ux-g135-contact-profile/**
      - tests/unit/ux-g135-college-contact-profile.test.tsx
      - tests/e2e/ux-g135-college-contact-profile.spec.ts
      - .github/workflows/ux-g135-college-contact-acceptance.yml

permissions:
  contents: read

jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scoped lint
        run: npx eslint src/components/colleges/college-contact-profile-form.tsx src/app/e2e/ux-g135-contact-profile/page.tsx tests/unit/ux-g135-college-contact-profile.test.tsx tests/e2e/ux-g135-college-contact-profile.spec.ts
      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Unit and existing college regression
        run: npx vitest run tests/unit/ux-g135-college-contact-profile.test.tsx tests/unit/UX-college-college-college-profile-01.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance with strict result count
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ux-g135-results.json
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/e2e/ux-g135-college-contact-profile.spec.ts --project=chromium --reporter=line,html,json
          node -e 'const s=require("./ux-g135-results.json").stats;console.log("Browser proof:",s);if(s.expected!==6||s.unexpected!==0||s.flaky!==0||s.skipped!==0)process.exit(1)'
      - name: Upload screenshots and HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g135-contact-proof
          path: |
            test-results/
            playwright-report/
            ux-g135-results.json
          if-no-files-found: ignore
