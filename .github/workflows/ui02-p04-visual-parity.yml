name: UI-02 P04 Visual Parity — Academics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  visual-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        run: bunx playwright install --with-deps chromium

      - name: Create snapshot output directory
        run: mkdir -p tests/ui-snapshots/ui02

      - name: UI-02 visual parity — batches / superadmin academics
        run: bunx playwright test tests/ui02-visual-parity.spec.ts --grep "Batches"
        env:
          TEST_BASE_URL: https://testa.development.42lms.com
          PLAYWRIGHT_BASE_URL: https://testa.development.42lms.com

      - name: UI-02 visual parity — college admin academics
        run: bunx playwright test tests/ui02-visual-parity.spec.ts --grep "College Admin"
        env:
          TEST_BASE_URL: https://testa.development.42lms.com
          PLAYWRIGHT_BASE_URL: https://testa.development.42lms.com

      - name: UI-02 visual parity — learner academic surfaces
        run: bunx playwright test tests/ui02-visual-parity.spec.ts --grep "Learner"
        env:
          TEST_BASE_URL: https://testa.development.42lms.com
          PLAYWRIGHT_BASE_URL: https://testa.development.42lms.com

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui02-visual-parity-screenshots
          path: tests/ui-snapshots/ui02/
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui02-playwright-report
          path: playwright-report/
          retention-days: 14
