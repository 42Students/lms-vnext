name: UI-08 P04 Visual Parity — TPO / Recruiter CRM

on:
  workflow_dispatch:
  schedule:
    # Run nightly at 02:30 UTC
    - cron: '30 2 * * *'

permissions:
  contents: read

jobs:
  visual-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        run: bunx playwright install --with-deps chromium

      - name: Create snapshot output directory
        run: mkdir -p tests/ui-snapshots/ui08

      - name: UI-08 visual parity — TPO surfaces
        run: bunx playwright test tests/ui08-visual-parity.spec.ts --grep "TPO surfaces"
        env:
          TEST_BASE_URL: https://testa.development.42lms.com
          PLAYWRIGHT_BASE_URL: https://testa.development.42lms.com

      - name: UI-08 visual parity — TPO surfaces mobile
        run: bunx playwright test tests/ui08-visual-parity.spec.ts --grep "TPO surfaces \(mobile"
        env:
          TEST_BASE_URL: https://testa.development.42lms.com
          PLAYWRIGHT_BASE_URL: https://testa.development.42lms.com

      - name: UI-08 visual parity — HR/Recruiter surfaces
        run: bunx playwright test tests/ui08-visual-parity.spec.ts --grep "HR/Recruiter surfaces"
        env:
          TEST_BASE_URL: https://testa.development.42lms.com
          PLAYWRIGHT_BASE_URL: https://testa.development.42lms.com

      - name: UI-08 visual parity — HR surfaces mobile
        run: bunx playwright test tests/ui08-visual-parity.spec.ts --grep "HR surfaces \(mobile"
        env:
          TEST_BASE_URL: https://testa.development.42lms.com
          PLAYWRIGHT_BASE_URL: https://testa.development.42lms.com

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui08-visual-parity-screenshots
          path: tests/ui-snapshots/ui08/
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui08-playwright-report
          path: playwright-report/
          retention-days: 14
