name: Faculty Quiz Report acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/faculty-quiz-report-acceptance.yml"
      - "tests/e2e/faculty-quiz-report.spec.ts"
      - "tests/integration/faculty-section-authoring.test.ts"
      - "src/modules/courses/faculty-report-csv-service.ts"
      - "src/app/(authenticated)/teacher/report/quiz/**"
      - "src/modules/courses/faculty-quiz-question-csv*"
permissions:
  contents: read
concurrency:
  group: faculty-quiz-report-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB06_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify registered journal
        run: npm run db:journal:verify
      - name: Seed disposable PostgreSQL
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Faculty Quiz Report and safe filtered CSV PostgreSQL contracts
        run: npx vitest run --config vitest.db.config.ts tests/integration/faculty-section-authoring.test.ts
      - name: Question accuracy formula neutralization and 500-row cap
        run: npx vitest run tests/unit/faculty-quiz-question-csv.test.ts tests/unit/faculty-quiz-csv-cap.test.ts tests/unit/faculty-assessment-report.test.ts
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable E2E database
        run: npm run db:e2e:prepare
      - name: Ephemeral browser secrets
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Verify responsive Quiz Report and filtered safe CSV
        run: npx playwright test tests/e2e/faculty-quiz-report.spec.ts --workers=1
      # This proof is distinct from the prototype's Assignment Report: quiz
      # accuracy, attempts and question-level exports are retained.
