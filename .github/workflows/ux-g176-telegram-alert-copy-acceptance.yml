name: UX-G176 Telegram alert copy responsive acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/e2e/ux-g176-telegram-alert/**'
      - 'tests/e2e/ux-g176-telegram-alert-copy.spec.ts'
      - '.github/workflows/ux-g176-telegram-alert-copy-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: ux-g176-telegram-copy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  copy-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      UX_G176_TELEGRAM_FIXTURE: '1'
      PLATFORM_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact SHA and production notifier plus witness source lint
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx eslint src/modules/log-alerts/telegram-notifier.ts src/modules/log-alerts/telegram-webhook.ts src/app/e2e/ux-g176-telegram-alert/page.tsx tests/e2e/ux-g176-telegram-alert-copy.spec.ts
          npm run typecheck
      - name: Provider payload redaction and callback authorization regressions
        run: npx vitest run tests/unit/graceful-telegram-webhook.test.ts tests/unit/security-telegram-acknowledgement-authorization.test.ts tests/unit/graceful-webhook-route.test.ts --reporter=dot
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop/mobile production-copy rendering in dev-only fixture
        run: npx playwright test tests/e2e/ux-g176-telegram-alert-copy.spec.ts --project=chromium --reporter=line
      - name: Preserve viewport screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g176-telegram-copy-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
