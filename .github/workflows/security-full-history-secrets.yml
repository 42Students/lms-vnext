# Periodic complete-history scan complements the mandatory per-commit gate.
# Historical baseline findings are NOT cleared/verified keys. The incremental
# scan intentionally does NOT use this baseline, so new credentials cannot be
# silently suppressed by an old path/line match.
name: Security - full-history secret scan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-full-history-secrets.yml'
      - '.gitleaks-baseline.json'
      - '.gitleaks.toml'
      - 'tests/security-provider-credential-signatures.test.mjs'
      - 'scripts/security/**'
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-full-history-secrets
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          # Needed only because this job fetches all remote refs of a private
          # repository. Checkout cleans up its credential after the job.
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache: false
      - name: Validate redacted historical baseline and log-safety contracts
        run: |
          node --test tests/security-gitleaks-report-gate.test.mjs tests/security-secrets-workflow-policy.test.mjs tests/security-provider-credential-signatures.test.mjs
          node scripts/security/gitleaks-report-gate.mjs --validate-baseline .gitleaks-baseline.json
      - name: Install pinned open-source Gitleaks
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          test -x "$(go env GOPATH)/bin/gitleaks"
      - name: Scan all locally reachable branches and tags with no secret logging
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          GL="$(go env GOPATH)/bin/gitleaks"
          report="$RUNNER_TEMP/history-secret-candidates.json"
          if ! "$GL" git --config=.gitleaks.toml --log-opts='--all' --redact --exit-code=0 \
               --baseline-path=.gitleaks-baseline.json \
               --report-format=json --report-path="$report" . \
               > "$RUNNER_TEMP/history-gitleaks-stdout.txt" 2>&1; then
            echo "::error::Full-history scan failed to complete; no assurance can be recorded."
            exit 2
          fi
          # Missing/malformed reports FAIL rather than becoming clean evidence.
          node scripts/security/gitleaks-report-gate.mjs --fail-on-findings "$report"
