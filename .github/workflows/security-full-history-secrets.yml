name: Security - full-history secret scan
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-full-history-secrets.yml'
      - 'scripts/security/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-full-history-secrets
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Install pinned open-source Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - name: Scan all locally reachable branches and tags without disclosing secrets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          export PATH="$(go env GOPATH)/bin:$PATH"
          set +e
          gitleaks git --source . --log-opts='--all' --redact --report-format=json --report-path="$RUNNER_TEMP/secret-findings.json" --exit-code=0 > "$RUNNER_TEMP/scan-output.txt" 2>&1
          scan_status=$?
          set -e
          if [ "$scan_status" -ne 0 ]; then
            echo "::error::Full-history scanner failed to complete (exit $scan_status); results not trustworthy."
            exit 2
          fi
          python3 - <<'PY'
          import collections,json,os,pathlib,sys
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'secret-findings.json'
          if not p.exists():
              print('Scan completed without a findings report.')
              sys.exit(0)
          reports=json.loads(p.read_text()) or []
          if not isinstance(reports,list):
              raise SystemExit('Unexpected scanner result; failing closed.')
          by_rule=collections.Counter(str(item.get('RuleID','unknown')) for item in reports)
          print('Potential secret findings in history:', len(reports))
          for rule,count in sorted(by_rule.items()):
              # No values, hashes, individual commits or matching lines in logs.
              safe=''.join(c for c in rule if c.isalnum() or c in '-_')[:64]
              print(f'  {safe}: {count}')
          if reports:
              print('::error::Potential credentials found. Review privately and rotate confirmed keys before history purge.')
              sys.exit(1)
          PY
