# Exact-SHA, account-wide Faculty acceptance. Separate from rolling global CI:
# parallel DB/API lanes must not cancel these independent browser witnesses.
# Clone for another role only after replacing its role-specific test selection.
name: Faculty full-account acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/faculty-account-acceptance.yml"
      - "tests/e2e/faculty-profile-account.spec.ts"
permissions:
  contents: read
concurrency:
  group: faculty-full-account-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The full 42LMS type graph exceeds the default ~4 GiB Node heap.
      # Retain full type diagnostics rather than excluding unrelated modules.
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirm checked out acceptance SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Typecheck Faculty source in full project context
        run: npm run typecheck
      - name: Faculty models, boundaries and form regression
        run: npx vitest run tests/unit/faculty-*.test.ts tests/unit/chat3-faculty-*.test.ts

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB06_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Registered migration journal
        run: npm run db:journal:verify
      - name: Seed disposable PostgreSQL, no production DB
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: All Faculty integration and tenant-negative tests
        run: npx vitest run --config vitest.db.config.ts tests/integration/faculty-

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify no wrong revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable E2E database
        run: npm run db:e2e:prepare
      - name: Generate per-shard disposable credentials
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Full Faculty account journeys, desktop/mobile, all pages
        run: >-
          npx playwright test
          tests/e2e/faculty-*.spec.ts
          tests/e2e/graceful-faculty.spec.ts
          --workers=1
          --shard=${{ matrix.shard }}/2
          --reporter=line
