name: UX-G003 G067 device and login acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/app/login/**
      - src/app/(authenticated)/account/security/**
      - tests/unit/ux-g003-g067-devices-login.test.ts
      - tests/e2e/ux-devices-login-journeys.spec.ts
      - .github/workflows/ux-devices-login-acceptance.yml
concurrency:
  group: ux-devices-login-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verified:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      APP_ENV: development
      E2E_AUTH_ENABLED: "true"
      AUTH_TEST_OTP: "135790"
      AUTH_TEST_EMAILS: superadmin.seed@example.com
      AUTH_TEST_PHONES: "+919000000001"
      PLATFORM_HOSTS: localhost,127.0.0.1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scoped lint
        run: npx eslint 'src/app/(authenticated)/account/security/page.tsx' 'src/app/(authenticated)/account/security/error.tsx' 'src/app/(authenticated)/account/security/loading.tsx' src/app/login/page.tsx src/app/login/error.tsx src/app/login/loading.tsx tests/unit/ux-g003-g067-devices-login.test.ts tests/e2e/ux-devices-login-journeys.spec.ts
      - name: Project TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Focused unit regression
        run: npx vitest run tests/unit/ux-g003-g067-devices-login.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare isolated seeded database
        run: npm run db:e2e:prepare
      - name: Set ephemeral session and browser secrets
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Verify 320-1280px real session journeys and revocation
        run: npx playwright test tests/e2e/ux-devices-login-journeys.spec.ts --project=chromium --workers=1 --reporter=line
      - name: Upload responsive browser artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g003-g067-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
