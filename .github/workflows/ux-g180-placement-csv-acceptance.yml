name: UX-G180 Learner and TPO batch/company CSV acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/modules/placements/learner-csv-safe-cell-model.ts
      - src/modules/placements/tpo-batch-history-csv-model.ts
      - src/modules/placements/tpo-batch-student-filtered-export-model.ts
      - src/modules/placements/tpo-company-drive-export-model.ts
      - src/modules/placements/tpo-company-engagement-csv-model.ts
      - src/app/e2e/ux-g180-placement-csv/**
      - tests/unit/ux-g180-placement-csv-acceptance.test.ts
      - tests/e2e/ux-g180-placement-csv.spec.ts
      - .github/workflows/ux-g180-placement-csv-acceptance.yml
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      UX_G180_FIXTURE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scoped ESLint
        run: |
          npx eslint src/modules/placements/learner-csv-safe-cell-model.ts src/modules/placements/tpo-batch-history-csv-model.ts src/modules/placements/tpo-batch-student-filtered-export-model.ts src/modules/placements/tpo-company-drive-export-model.ts src/modules/placements/tpo-company-engagement-csv-model.ts src/app/e2e/ux-g180-placement-csv/page.tsx tests/unit/ux-g180-placement-csv-acceptance.test.ts tests/e2e/ux-g180-placement-csv.spec.ts
      - name: Full project TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: New and existing CSV regression tests
        run: |
          npx vitest run tests/unit/ux-g180-placement-csv-acceptance.test.ts tests/unit/learner-csv-safe-cell.test.ts tests/unit/tpo-batch-history-csv-model.test.ts tests/unit/tpo-batch-student-filtered-export-model.test.ts
      - name: Chromium dependencies
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile download tests
        run: npx playwright test tests/e2e/ux-g180-placement-csv.spec.ts --project=chromium --reporter=line
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g180-placement-csv-browser
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
