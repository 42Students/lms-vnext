name: UX-G058 G187 G188 Public journey acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/app/jobs/external/**
      - src/components/placements/public-external-job-details.tsx
      - src/app/loading.tsx
      - src/app/not-found.tsx
      - src/app/e2e/ux-g058-external-job/**
      - src/app/e2e/ux-g187-loading/**
      - tests/unit/ux-public-job-and-fallback-groups.test.tsx
      - tests/unit/chat16-public-platform-error-loading-pages-16.test.tsx
      - tests/e2e/ux-public-jobs-fallback.spec.ts
      - .github/workflows/ux-public-jobs-fallback-acceptance.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scoped ESLint
        run: |
          npx eslint 'src/app/jobs/external/[slug]/page.tsx' 'src/app/jobs/external/[slug]/loading.tsx' 'src/app/jobs/external/[slug]/error.tsx' src/components/placements/public-external-job-details.tsx src/app/loading.tsx src/app/not-found.tsx src/app/e2e/ux-g058-external-job/page.tsx src/app/e2e/ux-g187-loading/page.tsx tests/unit/ux-public-job-and-fallback-groups.test.tsx tests/e2e/ux-public-jobs-fallback.spec.ts
      - name: Full TypeScript check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Focused UX and existing security regression
        run: |
          npx vitest run tests/unit/ux-public-job-and-fallback-groups.test.tsx tests/unit/security-public-external-job-page-boundary.test.ts tests/unit/chat16-public-platform-error-loading-pages-16.test.tsx tests/unit/public-error-pages.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop/mobile real route and fixture acceptance
        shell: bash
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ux-public-jobs-results.json
        run: |
          set -euo pipefail
          npx playwright test tests/e2e/ux-public-jobs-fallback.spec.ts --project=chromium --reporter=line,html,json
          node -e 'const stats=require("./ux-public-jobs-results.json").stats;console.log("Playwright proof:",stats);if(stats.expected!==6||stats.unexpected!==0||stats.flaky!==0||stats.skipped!==0){console.error("Browser acceptance NOT green");process.exit(1)}'
      - name: Preserve viewport screenshots and HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-public-jobs-fallback-evidence
          path: |
            test-results/
            playwright-report/
            ux-public-jobs-results.json
          if-no-files-found: ignore
