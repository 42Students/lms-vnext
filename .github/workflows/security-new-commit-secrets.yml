# Run for EVERY pull request and every main push, not only security-script edits.
# Scan each new commit without the historical baseline; old-baseline suppressions
# must never hide a newly introduced credential on the same path and line.
name: Security - no new committed credentials

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-new-credentials-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  incremental-credential-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache: false
      - name: Validate baseline redaction and secret-report handling
        run: |
          node --test tests/security-gitleaks-report-gate.test.mjs tests/security-secrets-workflow-policy.test.mjs tests/security-provider-credential-signatures.test.mjs
          node scripts/security/gitleaks-report-gate.mjs --validate-baseline .gitleaks-baseline.json
      - name: Install pinned open-source secret scanner
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          test -x "$(go env GOPATH)/bin/gitleaks"
      - name: Scan all new commits without any baseline or allowlist override
        shell: bash
        run: |
          set -euo pipefail
          zeros=0000000000000000000000000000000000000000
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            base="$(git rev-parse HEAD^)"
          elif [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$BASE_SHA" != "$zeros" ] &&
               git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            base="$BASE_SHA"
          else
            echo "::error::Unable to establish trusted commit range; refusing to pass secret gate."
            exit 2
          fi
          range="$base..HEAD"
          GL="$(go env GOPATH)/bin/gitleaks"
          report="$RUNNER_TEMP/new-commit-candidates.json"
          if ! "$GL" git --config=.gitleaks.toml --log-opts="$range" --redact --exit-code=0 \
               --report-format=json --report-path="$report" . \
               > "$RUNNER_TEMP/gitleaks-stdout.txt" 2>&1; then
            echo "::error::Secret scanner failed to complete; results cannot be trusted."
            exit 2
          fi
          node scripts/security/gitleaks-report-gate.mjs --fail-on-findings "$report"
