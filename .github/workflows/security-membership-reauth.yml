# Prove membership provisioning, role changes and lifecycle writes cannot be
# committed by a stale/impersonated session or oversized/CSRF request.
name: Security - actor-bound authentication for privileged account writes

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/api/people/onboard/route.ts"
      - "src/app/api/people/**/roles/route.ts"
      - "src/app/api/people/**/lifecycle/route.ts"
      - "src/app/api/admin/hr/route.ts"
      - "src/app/api/admin/hr/**/route.ts"
      - "src/app/api/admin/people/platform/**/route.ts"
      - "src/auth/recent-device-auth.ts"
      - "src/modules/auth/bounded-json.ts"
      - "tests/unit/security-membership-reauth-http.test.ts"
      - "tests/unit/security-recent-device-subject-binding.test.ts"
      - "tests/unit/security-super-admin-account-reauth.test.ts"
      - "tests/unit/recent-device-privileged-role-security.test.ts"
      - ".github/workflows/security-membership-reauth.yml"
  push:
    branches: [main]
    paths:
      - "src/app/api/people/onboard/route.ts"
      - "src/app/api/people/**/roles/route.ts"
      - "src/app/api/people/**/lifecycle/route.ts"
      - "src/app/api/admin/hr/route.ts"
      - "src/app/api/admin/hr/**/route.ts"
      - "src/app/api/admin/people/platform/**/route.ts"
      - "src/auth/recent-device-auth.ts"
      - "src/modules/auth/bounded-json.ts"
      - "tests/unit/security-membership-reauth-http.test.ts"
      - "tests/unit/security-recent-device-subject-binding.test.ts"
      - "tests/unit/security-super-admin-account-reauth.test.ts"
      - "tests/unit/recent-device-privileged-role-security.test.ts"
      - ".github/workflows/security-membership-reauth.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-membership-reauth-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  privilege-write-authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact tested source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Actual API role, lifecycle and onboarding negative/positive tests
        run: npx vitest run tests/unit/security-membership-reauth-http.test.ts tests/unit/security-recent-device-subject-binding.test.ts tests/unit/security-super-admin-account-reauth.test.ts tests/unit/recent-device-privileged-role-security.test.ts tests/unit/private-bulk-csv-security.test.ts
      - name: TypeScript typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
