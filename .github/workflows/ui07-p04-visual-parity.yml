name: UI-07 P04 Visual Parity (placements learner and admin)

on:
  push:
    paths:
      - "src/app/(authenticated)/learn/my-placements/**"
      - "src/app/(authenticated)/tpo/**"
      - "src/app/(authenticated)/admin/placements/**"
      - "tests/ui07-visual-parity.spec.ts"
  workflow_dispatch:

jobs:
  ui07-visual-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run UI-07 visual parity tests
        run: npx playwright test tests/ui07-visual-parity.spec.ts
        env:
          TEST_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL || 'https://testa.development.42lms.com' }}
