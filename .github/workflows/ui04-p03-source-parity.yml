name: UI-04 P03 — Source Parity (courses and learning content)

on:
  push:
    paths:
      - "src/app/(authenticated)/admin/courses/**"
      - "src/app/(authenticated)/learn/**"
      - "docs/planning/ui-inventory-ui04.json"
      - "docs/planning/ui-strings-ui04.json"
      - "tests/ui04-source-parity.test.mjs"
  pull_request:
    paths:
      - "src/app/(authenticated)/admin/courses/**"
      - "src/app/(authenticated)/learn/**"
      - "tests/ui04-source-parity.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui04-p03-source-parity:
    name: UI-04 P03 source parity (no browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run UI-04 source parity test
        run: node --test tests/ui04-source-parity.test.mjs

      - name: Print surface count
        run: |
          node -e "
            const inv = JSON.parse(require('fs').readFileSync('docs/planning/ui-inventory-ui04.json','utf8'));
            console.log('Surfaces:', inv.surfaces.length, '(total declared:', inv.totalSurfaces + ')');
            console.log('Missing:', inv.surfaces.filter(s => s.disposition === 'MISSING').length);
          "
