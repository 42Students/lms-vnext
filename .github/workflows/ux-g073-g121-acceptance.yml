name: UX-G073 G121 Mentor reports and Tracker recovery acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/(authenticated)/mentor/reports/**'
      - 'src/app/(authenticated)/mentor/review-history/**'
      - 'src/app/(authenticated)/mentor/reviews/**'
      - 'src/app/(authenticated)/mentor/sprint-progress/**'
      - 'src/app/(authenticated)/mentor/task-review-history/**'
      - 'src/app/(authenticated)/tracker/issues/**'
      - 'src/app/(authenticated)/tracker/audit-findings/**'
      - 'tests/ux-g073-g121-contract.test.mjs'
      - 'tests/e2e/ux-g073-g121-recovery.spec.ts'
      - '.github/workflows/ux-g073-g121-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: ux-g073-g121-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scoped-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: 'true'
      UX_G073_G121_SEED: 'true'
      DB10_TRACKER_READY: DB10_VERIFIED
      APP_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record exact commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "$GITHUB_SHA" > ux-g073-g121-sha.txt
      - name: Scoped source behavior contracts
        run: node --test tests/ux-g073-g121-contract.test.mjs
      - name: Lint touched pages and browser scenarios
        run: |
          npx eslint \
            'src/app/(authenticated)/mentor/reports/page.tsx' \
            'src/app/(authenticated)/mentor/review-history/page.tsx' \
            'src/app/(authenticated)/mentor/reviews/page.tsx' \
            'src/app/(authenticated)/mentor/sprint-progress/page.tsx' \
            'src/app/(authenticated)/mentor/task-review-history/page.tsx' \
            'src/app/(authenticated)/tracker/issues/page.tsx' \
            'src/app/(authenticated)/tracker/issues/[publicId]/page.tsx' \
            'src/app/(authenticated)/tracker/issues/[publicId]/loading.tsx' \
            'src/app/(authenticated)/tracker/audit-findings/page.tsx' \
            'src/app/(authenticated)/tracker/audit-findings/[publicId]/page.tsx' \
            tests/e2e/ux-g073-g121-recovery.spec.ts
          npm run typecheck
      - name: Prepare disposable PostgreSQL
        run: npm run db:e2e:prepare
      - name: Seed synthetic Mentor role membership
        env:
          ALLOW_TEST_SEED: I_ACCEPT
          UX_ROLE_MEMBERSHIPS_ONLY: '1'
        run: npx tsx scripts/seed-test-tenants.ts
      - name: Ephemeral local browser authentication
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Authenticated desktop/mobile and negative-role browser checks
        run: npx playwright test tests/e2e/ux-g073-g121-recovery.spec.ts --project=chromium --reporter=line
      - name: Collect screenshots and trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g073-g121-acceptance-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            ux-g073-g121-sha.txt
          if-no-files-found: ignore
          retention-days: 14
