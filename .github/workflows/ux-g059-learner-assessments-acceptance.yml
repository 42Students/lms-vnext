name: UX-G059 learner assessment route acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/app/(authenticated)/learn/allAssignments/**
      - src/app/(authenticated)/learn/allQuizzes/**
      - src/modules/courses/learner-assignment-page-model.ts
      - src/app/e2e/ux-learner-assessments/**
      - tests/unit/ux-g059-learner-assessments.test.tsx
      - tests/e2e/ux-g059-learner-assessments.spec.ts
      - .github/workflows/ux-g059-learner-assessments-acceptance.yml
permissions:
  contents: read
concurrency:
  group: ux-g059-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Lint scoped routes and tests
        run: npx eslint 'src/app/(authenticated)/learn/allAssignments/page.tsx' 'src/app/(authenticated)/learn/allQuizzes/page.tsx' 'src/app/(authenticated)/learn/allAssignments/[assignmentId]/page.tsx' 'src/app/(authenticated)/learn/allQuizzes/[quizId]/page.tsx' src/modules/courses/learner-assignment-page-model.ts src/app/e2e/ux-learner-assessments tests/unit/ux-g059-learner-assessments.test.tsx tests/e2e/ux-g059-learner-assessments.spec.ts
      - name: Focused units
        run: npx vitest run tests/unit/ux-g059-learner-assessments.test.tsx --reporter=dot
      - name: Setup Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop/mobile assessment UX acceptance
        run: npx playwright test tests/e2e/ux-g059-learner-assessments.spec.ts --project=chromium --reporter=line
      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Save proof images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-g059-learner-desktop-mobile
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
