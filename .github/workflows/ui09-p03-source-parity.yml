name: UI-09 P03 — Source Parity (notifications, announcements, operations)

on:
  push:
    paths:
      - "src/app/(authenticated)/notifications/**"
      - "src/app/(authenticated)/announcements/**"
      - "src/app/(authenticated)/discussions/**"
      - "src/app/(authenticated)/admin/notifications/**"
      - "src/app/(authenticated)/admin/skills/**"
      - "src/components/notification*/**"
      - "docs/planning/ui-inventory-ui09.json"
      - "docs/planning/ui-strings-ui09.json"
      - "tests/ui09-source-parity.test.mjs"
  pull_request:
    paths:
      - "src/app/(authenticated)/notifications/**"
      - "src/app/(authenticated)/announcements/**"
      - "tests/ui09-source-parity.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui09-p03-source-parity:
    name: UI-09 P03 source parity (no browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run UI-09 source parity test
        run: node --test tests/ui09-source-parity.test.mjs

      - name: Verify inventory and catalogue files exist
        run: |
          test -f docs/planning/ui-inventory-ui09.json && echo "inventory OK" || (echo "MISSING: ui-inventory-ui09.json" && exit 1)
          test -f docs/planning/ui-strings-ui09.json && echo "strings OK" || (echo "MISSING: ui-strings-ui09.json" && exit 1)

      - name: Print surface count
        run: |
          node -e "
            const inv = JSON.parse(require('fs').readFileSync('docs/planning/ui-inventory-ui09.json','utf8'));
            const cat = JSON.parse(require('fs').readFileSync('docs/planning/ui-strings-ui09.json','utf8'));
            console.log('Surfaces:', inv.surfaces?.length || inv.totalSurfaces);
            console.log('Missing:', (inv.surfaces||[]).filter(s => s.disposition === 'MISSING').length);
            console.log('Strings:', Object.keys(cat.strings||{}).length);
          "
