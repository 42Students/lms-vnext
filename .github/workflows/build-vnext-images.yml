name: Build vNext images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push images
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::8}"
          BASE="ghcr.io/42students/lms-vnext"
          docker build --target migrator -t "${BASE}/migrator:${SHORT}" .
          docker build --target runner -t "${BASE}/web:${SHORT}" .
          docker push "${BASE}/migrator:${SHORT}"
          docker push "${BASE}/web:${SHORT}"
          echo "Pushed ${BASE}/web:${SHORT} and ${BASE}/migrator:${SHORT}" >> "$GITHUB_STEP_SUMMARY"
