name: Build vNext images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build images and save as tarballs
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::8}"
          BASE="asia-south1-docker.pkg.dev/students-384817/lms-vnext"
          mkdir -p out
          docker build --target migrator -t "${BASE}/migrator:${SHORT}" .
          docker build --target runner -t "${BASE}/web:${SHORT}" .
          docker save "${BASE}/migrator:${SHORT}" -o out/migrator.tar
          docker save "${BASE}/web:${SHORT}" -o out/web.tar
          ls -lh out >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vnext-images-${{ github.sha }}
          path: out/*.tar
          retention-days: 1
          compression-level: 6
