name: Drizzle Drift Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/schema-drift-capture.yml"

permissions:
  contents: read

jobs:
  promote-file-enum:
    # Writes a migration commit to main; the only job that needs more than read.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate, prove and promote one semantic delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "42Students DB17 Integrator"
          git config user.email "actions@users.noreply.github.com"

          success=0
          for attempt in 1 2 3 4 5 6; do
            echo "DB017 promotion attempt $attempt"
            git fetch origin main
            base="$(git rev-parse origin/main)"
            git reset --hard "$base"
            git clean -fd drizzle/

            # FILE is compile-time-visible but DB-persistence must still be
            # fail-closed until DB053 installs receipt/file completeness.
            python - <<'PY'
          from pathlib import Path
          s=Path("src/db/schema/assessments.ts").read_text()
          start=s.index('"assignment_submissions_payload_ck"')
          end=s.index('"assignment_submissions_points_ck"', start)
          payload=s[start:end]
          if "= 'FILE'" in payload:
              raise SystemExit("active payload CHECK already accepts FILE; refuse enum-only promotion")
          PY

            last_idx="$(node -e 'const j=require("./drizzle/meta/_journal.json"); process.stdout.write(String(j.entries.at(-1).idx))')"
            next_idx="$(printf '%04d' "$((last_idx + 1))")"
            prev_idx="$(printf '%04d' "$last_idx")"
            prev_snapshot="drizzle/meta/${prev_idx}_snapshot.json"

            npm run db:generate

            mapfile -t candidates < <(git ls-files --others --exclude-standard "drizzle/${next_idx}_*.sql")
            test "${#candidates[@]}" -eq 1
            candidate="${candidates[0]}"
            new_snapshot="drizzle/meta/${next_idx}_snapshot.json"
            test -f "$prev_snapshot"
            test -f "$new_snapshot"

            python - "$prev_snapshot" "$new_snapshot" "$candidate" <<'PY'
          import json, re, sys
          old_path,new_path,sql_path=sys.argv[1:]
          old=json.load(open(old_path,encoding="utf-8"))
          new=json.load(open(new_path,encoding="utf-8"))

          diffs=[]
          def walk(a,b,path=""):
              if type(a) is not type(b):
                  diffs.append((path,a,b)); return
              if isinstance(a,dict):
                  for k in sorted(set(a)|set(b)):
                      p=f"{path}/{k}"
                      if k not in a: diffs.append((p,"<MISSING>",b[k]))
                      elif k not in b: diffs.append((p,a[k],"<MISSING>"))
                      else: walk(a[k],b[k],p)
              elif isinstance(a,list):
                  if a != b: diffs.append((path,a,b))
              elif a != b:
                  diffs.append((path,a,b))

          walk(old,new)
          substantive=[]
          enum_seen=False
          for path,a,b in diffs:
              if path in ("/id","/prevId"):
                  continue
              if path == "/enums/public.assignment_submission_type/values":
                  if b == [*a, "FILE"] and "FILE" not in a:
                      enum_seen=True
                      continue
              if path.endswith("/default"):
                  # Older hand-curated snapshots sometimes stored primitive
                  # defaults as strings; generated metadata normalizes types.
                  def canon(v):
                      if isinstance(v,bool): return str(v).lower()
                      return str(v)
                  if canon(a).lower() == canon(b).lower():
                      continue
              if "/checkConstraints/" in path and path.endswith("/value"):
                  def norm(v):
                      return re.sub(r"\s+"," ",str(v).replace("\\n"," ")).strip()
                  if norm(a) == norm(b):
                      continue
              substantive.append((path,a,b))

          if not enum_seen:
              raise SystemExit("expected FILE enum delta was not generated")
          if substantive:
              print(json.dumps(substantive,indent=2,default=str))
              raise SystemExit("unexpected substantive Drizzle snapshot drift")

          sql=open(sql_path,encoding="utf-8").read()
          required='ALTER TYPE "public"."assignment_submission_type" ADD VALUE \'FILE\';'
          if required not in sql:
              raise SystemExit("generated SQL missing FILE enum addition")
          for token in [
              "CREATE TABLE", "DROP TABLE", "DELETE FROM", "TRUNCATE",
              "ADD COLUMN", "DROP COLUMN", "assignment_submissions_payload_ck",
          ]:
              if token.lower() in sql.lower():
                  raise SystemExit(f"unsafe generated SQL token: {token}")

          open(sql_path,"w",encoding="utf-8").write(
              "-- DB-017 semantic-only schema alignment.\n"
              "-- FILE remains rejected by assignment_submissions_payload_ck until DB053.\n"
              + required + "--> statement-breakpoint\n"
          )
          print(f"validated snapshot diffs={len(diffs)}; semantic delta=FILE enum only")
          PY

            npm run db:journal:verify
            git add drizzle/
            git diff --cached --stat
            git diff --cached -- "$candidate" drizzle/meta/_journal.json
            git commit -m "db17: register fail-closed assignment FILE enum"

            git fetch origin main
            if test "$(git rev-parse origin/main)" != "$base"; then
              echo "main advanced; regenerate from newest head"
              git reset --hard origin/main
              git clean -fd drizzle/
              continue
            fi

            if git push origin HEAD:main; then
              success=1
              break
            fi
          done

          test "$success" -eq 1
      - name: Upload final Drizzle state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drizzle-db17-semantic-promotion-${{ github.sha }}
          path: drizzle/
          if-no-files-found: error
          retention-days: 7
