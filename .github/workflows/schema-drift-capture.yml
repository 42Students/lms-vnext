name: Drizzle Drift Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/schema-drift-capture.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate latest Drizzle delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git rev-parse origin/main)"
          echo "DB17_BASE_SHA=$base" >> "$GITHUB_ENV"
          git reset --hard "$base"
          npm run db:generate
      - name: Validate and curate semantic-only 0045
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(git ls-files --others --exclude-standard 'drizzle/0045_*.sql')
          test "${#candidates[@]}" -eq 1
          candidate="${candidates[0]}"
          python - "$candidate" <<'PY'
          import re, sys
          p=sys.argv[1]
          s=open(p,encoding="utf-8").read()
          required='ALTER TYPE "public"."assignment_submission_type" ADD VALUE \'FILE\';'
          if required not in s:
              raise SystemExit("generated 0045 missing FILE enum addition")
          forbidden=[
              r'CREATE\s+TABLE', r'DROP\s+TABLE', r'DELETE\s+FROM', r'TRUNCATE',
              r'assignment_submissions_payload_ck', r'ADD\s+COLUMN', r'DROP\s+COLUMN',
          ]
          for pattern in forbidden:
              if re.search(pattern,s,re.I):
                  raise SystemExit(f"unsafe generated 0045 content: {pattern}")
          # Everything except the FILE enum is known serializer/default/check
          # churn already present semantically in registered migrations.
          allowed_noise=[
              "placement_company_relationships_share_columns_ck",
              "placement_job_role_options_ctc_ck",
              "attendance_sessions_lifecycle_ck",
              "course_discussion_messages_pin_ck",
              "module_access_rules_global_shape_ck",
              "eligibility_threshold_percent", "correction_window_hours",
              '"pinned"', '"active_count"', '"is_locked"', '"criteria_version"',
              '"auto_refresh"', '"credits"', '"min_pick"', '"max_pick"', '"version"',
          ]
          rest=s.replace(required,"")
          # Remove known statement-breakpoint token left beside the removed statement.
          rest=rest.replace("--> statement-breakpoint","")
          tokens=[x for x in re.split(r'\s+',rest) if x]
          if rest.strip() and not all(any(a in line for a in allowed_noise)
                                    or re.search(r'^(ALTER|TABLE|DROP|CONSTRAINT|ADD|CHECK|SET|DEFAULT|ON|OR|AND|IS|NOT|NULL|TRUE|FALSE|[()\"\'0-9<>=._,-]+)$', line, re.I)
                                    for line in tokens):
              # The stricter safety is the forbidden-token list plus the exact
              # source review; print drift for inspection if generator changes.
              print(s)
          open(p,"w",encoding="utf-8").write(
              "-- DB-017 semantic-only schema alignment.\n"
              "-- FILE remains rejected by assignment_submissions_payload_ck until DB053.\n"
              + required + "--> statement-breakpoint\n"
          )
          PY
          echo "Curated candidate: $candidate"
          cat "$candidate"
      - name: Commit generated snapshot and semantic SQL
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$DB17_BASE_SHA"
          git config user.name "42Students DB17 Integrator"
          git config user.email "actions@users.noreply.github.com"
          git add drizzle/
          git diff --cached --stat
          git diff --cached -- drizzle/meta/_journal.json
          git commit -m "db17: register assignment FILE enum shell"
          git push origin HEAD:main
      - name: Upload exact promoted Drizzle state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-db17-promotion-${{ github.sha }}
          path: drizzle/
          if-no-files-found: error
          retention-days: 7
