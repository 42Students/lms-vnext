name: UX-G110-G119 real TPO authenticated route acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/e2e/ux-g110-g119-authenticated.spec.ts'
      - 'src/components/placements/tpo-settings-nav.tsx'
      - '.github/workflows/ux-g110-g119-authenticated-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: ux-g110-g119-auth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-tpo-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: 'true'
      APP_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_JSON_OUTPUT_NAME: ux-g110-g119-authenticated-results.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Source SHA, lint, typecheck and tracker
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx eslint tests/e2e/ux-g110-g119-authenticated.spec.ts src/components/placements/tpo-settings-nav.tsx
          npm run typecheck
          npm run ux:groups -- --check
      - name: Preserve scoped recovery regression coverage
        run: npx vitest run tests/unit/tpo-ux-g110-g119-recovery.test.ts
      - name: Prepare isolated PostgreSQL
        run: npm run db:e2e:prepare
      - name: Seed limited test-only TPO and learner identities
        env:
          ALLOW_TEST_SEED: I_ACCEPT
          UX_ROLE_MEMBERSHIPS_ONLY: '1'
        run: npx tsx scripts/seed-test-tenants.ts
      - name: Ephemeral local-browser auth keys
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Require all 34 authenticated desktop-mobile and learner denial cases
        run: |
          npx playwright test tests/e2e/ux-g110-g119-authenticated.spec.ts --project=chromium --workers=2 --reporter=line,json
          node -e 'const s=require("./ux-g110-g119-authenticated-results.json").stats; console.log(s); if(s.expected!==34||s.unexpected!==0||s.flaky!==0||s.skipped!==0)process.exit(1)'
      - name: Preserve screenshots, Playwright JSON and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g110-g119-authenticated-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            ux-g110-g119-authenticated-results.json
          if-no-files-found: ignore
          retention-days: 14
