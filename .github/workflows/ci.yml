name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - academics-a2-schema-gen

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Deployment config validator
        env:
          GCP_PROJECT_ID: lms-vnext-dev
          GCP_REGION: asia-south1
          GAR_REPOSITORY: lms-vnext
          CLOUD_RUN_SERVICE: lms-vnext-dev
          CLOUD_SQL_CONNECTION_NAME: lms-vnext-dev:asia-south1:lms-vnext-dev
          CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: runtime@lms-vnext-dev.iam.gserviceaccount.com
          GCP_WORKLOAD_IDENTITY_PROVIDER: projects/123456789/locations/global/workloadIdentityPools/github/providers/github
          GCP_DEPLOYER_SERVICE_ACCOUNT: deployer@lms-vnext-dev.iam.gserviceaccount.com
          DB_USER: lms_vnext_app
          DB_NAME: lms_vnext
          DB_PASSWORD_SECRET: lms-vnext-db-password
        run: node scripts/validate-deployment-config.mjs

      - name: Deployment config validator rejects mismatched Cloud SQL
        env:
          GCP_PROJECT_ID: lms-vnext-dev
          GCP_REGION: asia-south1
          GAR_REPOSITORY: lms-vnext
          CLOUD_RUN_SERVICE: lms-vnext-dev
          CLOUD_SQL_CONNECTION_NAME: other-project:asia-south1:lms-vnext-dev
          CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: runtime@lms-vnext-dev.iam.gserviceaccount.com
          GCP_WORKLOAD_IDENTITY_PROVIDER: projects/123456789/locations/global/workloadIdentityPools/github/providers/github
          GCP_DEPLOYER_SERVICE_ACCOUNT: deployer@lms-vnext-dev.iam.gserviceaccount.com
          DB_USER: lms_vnext_app
          DB_NAME: lms_vnext
          DB_PASSWORD_SECRET: lms-vnext-db-password
        shell: bash
        run: |
          if node scripts/validate-deployment-config.mjs; then
            echo "Expected malformed deployment config to fail validation"
            exit 1
          fi

      - name: Validate database schema
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle/

      - name: Prepare integration database
        run: npm run db:test:prepare

      - name: Migration command smoke
        run: npm run db:migrate

      - name: Database integration tests
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: Public runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/lms-vnext-smoke.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          SMOKE_RETRIES=20 SMOKE_RETRY_DELAY_MS=500 npm run smoke:public -- http://127.0.0.1:3000 || {
            cat /tmp/lms-vnext-smoke.log
            exit 1
          }
