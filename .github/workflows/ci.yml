name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate database schema
        run: npm run db:generate

      - name: Export DB bootstrap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: db-bootstrap-artifacts
          path: |
            package-lock.json
            drizzle/
          if-no-files-found: error
          retention-days: 1

      - name: Build
        run: npm run build
