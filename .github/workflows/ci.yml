name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Nine independent required jobs: failing lint must not suppress DB acceptance.
# One run per branch at a time: the running run finishes, and only the newest
# pending push waits behind it (older pending runs are dropped). Frequent merges
# to main therefore neither starve the runner pool nor cancel every run.
concurrency:
  group: lms-vnext-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
  db00-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Single tracker structural integrity (not database certification)
        run: node scripts/tracker.mjs --check
      - name: Independently prove required staging coverage for registered CI exclusions
        run: node --test tests/db020-ci-matrix-coverage.test.mjs
      - name: Native DB003 exclusion acceptance
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/db00-retirement-disposition.test.mjs tests/db19-db00-disposition-crosscheck.test.mjs
          node scripts/db19-db00-disposition-crosscheck.mjs
      - name: DB025 destructive database reset fail-closed native tests
        run: node --test tests/db01-test-database-guard.test.mjs tests/db-independent-verifier.test.mjs
      - name: DB058 negative-witness no-connect target guards
        run: node --test tests/db058-witness-target-safety.test.mjs tests/db-staged-pg-witnesses.test.mjs
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: LMS page-closure index — false-green prevention and structural validation
        run: |
          npm run test:parity:closure
          npm run parity:closure:check
      - name: Legacy dev census coverage (structure, not final UI parity)
        run: |
          npm run test:parity:legacy:census
          npm run parity:legacy:census:check
      - name: Journal and DB04 source checks
        shell: bash
        run: |
          set -euo pipefail
          npm run db:journal:verify
          node --test tests/drizzle-journal-guard.test.mjs
          npm run db04:promotion:verify
      - name: Database source parity
        run: npm run test:db:parity
      - name: Prototype portal source contracts (TPO, Recruiter, Mentor)
        run: node --test tests/prototype-parity-shell-contract.test.mjs
      - name: Nine-domain crosswalk regression
        run: node --test tests/db019-crosswalk-identity.test.mjs
      - name: Global 2,829-field census and unresolved-evidence preflight
        run: node --test tests/db019-source-ledger-preflight.test.mjs
      - name: Global source audit and crosswalk gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/db19-field-disposition-audit.mjs
          node scripts/db019-crosswalk-identity.mjs
  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Committed Drizzle generation integrity
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          # Evidence only. Printed SQL is NOT automatically applied or approved.
          for candidate in drizzle/00[0-9][0-9]_*.sql; do
            if test -f "$candidate" && ! git ls-files --error-unmatch "$candidate" >/dev/null 2>&1; then
              echo "::group::UNREGISTERED GENERATED MIGRATION $candidate"
              cat "$candidate"
              echo "::endgroup::"
            fi
          done
          git diff --exit-code -- drizzle/
          test -z "$(git ls-files --others --exclude-standard drizzle/)"
      - name: Upload generated Drizzle drift diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-schema-drift-${{ github.sha }}
          path: drizzle/
          if-no-files-found: error
          retention-days: 7
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB06_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migration journal
        run: npm run db:journal:verify
      - name: Disposable PostgreSQL 17 replay from empty and seed
        # Only the ephemeral TEST_DATABASE_URL may be reset.
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Migration replay idempotence
        run: npm run db:migrate
      - name: Read-only PostgreSQL 17 migration/catalog witness
        run: node scripts/db002-postgres-catalog-acceptance.mjs
      - name: DB017 relationship-scoped disclosure defaults negative and tenant checks
        env:
          DB017_ISOLATED_TEST_DATABASE: "1"
        run: node scripts/db017-share-defaults-pg-acceptance.mjs
      - name: DB-005 registered academic parent ownership guards against direct SQL
        env:
          DB02_REGISTERED_PARENT_GUARDS: "YES"
        run: node --test tests/db02-registered-parent-guards-pg.test.mjs
      - name: DB-005 registered program curriculum mapping and term bounds
        env:
          DB02_REGISTERED_CURRICULUM: "YES"
        run: node --test tests/db02-registered-curriculum-pg.test.mjs
      - name: DB-005 registered cohort progression, CAS and history acceptance
        env:
          DB02_REGISTERED_PROGRESSION: "YES"
        run: node --test tests/db02-registered-progression-pg.test.mjs
      - name: DB-005 registered lecture halls, tenant protection and booking overlap
        env:
          DB02_REGISTERED_HALLS: "YES"
        run: node --test tests/db02-registered-lecture-halls-pg.test.mjs
      - name: DB-005 registered academic parent and calendar integrity
        env:
          DB02_REGISTERED_PARENT_PERIODS: "YES"
        run: node --test tests/db02-registered-parent-periods-pg.test.mjs
      # Registered-schema matrix runs ONLY against committed numbered Drizzle
      # migrations. DB08/DB10 unregistered proposals run in their independent
      # DB08, DB10-skills and DB10-outbound jobs above with explicit PG fixtures.
      - name: DB-005 registered program/cohort archive lifecycle and concurrent insert
        env:
          DB02_REGISTERED_PROGRAM_ARCHIVE: "YES"
        run: node --test tests/db02-registered-program-archive-pg.test.mjs
      - name: Registered-schema PostgreSQL integration and tenant-negative tests
        run: npx vitest run --config vitest.db.registered.config.ts
  # Independent original-core DB-030 acceptance: a fresh, disposable PG17
  # fixture ensures failures in unrelated unregistered DB08/DB10 suites cannot
  # conceal the exact assessment lineage/tenant/roster/race witness result.
  # It does not certify global DATABASE parity or run against shared data.
  db06-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB06_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Registered database journal
        run: npm run db:journal:verify
      - name: Reset and seed isolated PostgreSQL 17
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: DB-030 PostgreSQL parent, tenant, grading and concurrency acceptance
        run: npm run test:db06:pg


  # DB-004 partial acceptance against a fresh PostgreSQL 17 fixture. This is
  # independent of the general database matrix; it does NOT certify the 312
  # legacy field dispositions, staged DB01 schemas, or provider/OTP cutover.
  db01-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB018_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify registered Drizzle journal
        run: npm run db:journal:verify
      - name: Safely reset and seed disposable DB01 PostgreSQL 17
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: DB-004 active identity and field disposition source contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/db01-final-field-disposition-audit.mjs
          node scripts/db004-identity-disposition-audit.mjs
          node --test tests/db004-identity-disposition-audit.test.mjs tests/db004-session-revocation-ownership.test.mjs
      - name: DB-004 tenant identity FK, constraints, repository and concurrent races
        run: >
          npx vitest run --config vitest.db.config.ts
          tests/integration/db01-tenant-identity-invariants.test.ts
          tests/integration/db01-identity-fk-invariants.test.ts
          tests/integration/db01-core-structure-invariants.test.ts
          tests/integration/db01-concurrent-integrity.test.ts
          tests/integration/db01-tenant-routing-lifecycle.test.ts
          tests/integration/db01-membership-role-parent-lock.test.ts


  # DB-005 registered DB02 academy and schedule acceptance on clean PG17.
  # Migration 0303 is applied through the normal journal, not a staging overlay.
  # This proves the final registered schema and the negative/concurrency suite.
  db02-registered-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB02_EXPECTED_DATABASE: lms_vnext_test
      DB02_DISPOSABLE_ACCEPTANCE: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify currently registered journal
        run: npm run db:journal:verify
      - name: Safely reset and seed disposable PostgreSQL 17 baseline
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: DB-005 registered migration replay idempotence
        run: npm run db:migrate
      - name: DB-005 registered journal provenance source checks
        run: node --test tests/db005-registered-canonical-source-contract.test.mjs
      - name: DB-005 registered schema, authorization and concurrent SQL acceptance
        shell: bash
        run: bash scripts/sql/db02-run-disposable-acceptance.sh


  # DB-007 pre-promotion PostgreSQL evidence for the DB04 privacy and
  # education/image proposal. SQL is applied ONLY to this throwaway runner's
  # database. It remains unregistered and must not be called DB-007 closure.
  db04-staged-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB04_PROFILE_DISPOSABLE: I_ACCEPT_DESTRUCTIVE_TEMP_SCHEMA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify journal without promoting DB04
        run: npm run db:journal:verify
      - name: Safely reset and seed isolated baseline PostgreSQL 17
        run: npm run db:test:prepare
      - name: DB-007 profile private-receipt, GPA, owner and image negative witnesses
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/db04-profile-education-images-pg.test.mjs
          node --test tests/db04-candidate-sql-integrity.test.mjs tests/db04-profile-education-images-staged.test.mjs


  # DB-012 partial live PG witness of already registered policy and CRM.
  # This job cannot certify the entire recruiter/TPO field ledger.
  db09-staged-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB09_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify currently registered journal
        run: npm run db:journal:verify
      - name: Reset and seed disposable PostgreSQL 17
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Confirm DB09 college policy is in registered PostgreSQL schema
        shell: bash
        run: |
          set -euo pipefail
          result="$(psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "SELECT to_regclass('public.placement_college_rules') IS NOT NULL AND to_regclass('public.placement_company_visibility_settings') IS NOT NULL")"
          test "$result" = t
      - name: DB-012 live recruiter CRM and tenant policy negative integration
        run: npm run test:db09:pg


  # DB-022: preserve the legacy two-counter and non-unique synonym semantics.
  # The canonical SQL remains UNREGISTERED; this exercises real SQL and the
  # production read service on an isolated PostgreSQL fixture, not deployment.
  db10-skills-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB018_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify registered journal integrity
        run: npm run db:journal:verify
      - name: Prepare isolated disposable PostgreSQL 17
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Apply DB10 unregistered skill staging to disposable fixture ONLY
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/sql/db10-skills-catalog-staging.sql
      - name: Apply DB10 unregistered log-alert triage proposal to isolated fixture
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/sql/db10-log-alerts-staging.sql
      - name: DB-022 and DB-023 skill catalog, synonym and private admin triage acceptance
        env:
          DB10_DISPOSABLE_TEST_DATABASE: "true"
        run: >
          npx vitest run --config vitest.db.config.ts
          tests/integration/db10-skills-catalog.test.ts
          tests/integration/db10-log-alert-admin.test.ts


  # DB08-A/B/C: disposable-only placement batch, registration, debarment
  # and outside-offer SQL acceptance. These four staged drafts are NOT in the
  # registered Drizzle journal and do not qualify as production schema proof.
  db08-staged-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB018_ISOLATED_TEST_DATABASE: "1"
      W04_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify registered schema journal
        run: npm run db:journal:verify
      - name: Reset and seed strictly disposable PG17
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Confirm DB08 batch, registration, debarment and external-offer tables are in the registered schema
        shell: bash
        run: |
          set -euo pipefail
          result="$(psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "SELECT to_regclass('public.placement_batch_lifecycles') IS NOT NULL AND to_regclass('public.placement_batch_registrations') IS NOT NULL AND to_regclass('public.placement_debarments') IS NOT NULL AND to_regclass('public.placement_external_offers') IS NOT NULL AND to_regclass('public.placement_saved_jobs') IS NOT NULL")"
          test "$result" = t
      - name: DB08-A/B/C batch, registration, debarment and external offer integration
        env:
          DB08_ISOLATED_TEST_DATABASE: "1"
          DB08_MIGRATION_APPLIED: "1"
          DB08_B_MIGRATION_APPLIED: "1"
          DB08_C_MIGRATION_APPLIED: "1"
        run: >
          npx vitest run --config vitest.db.config.ts
          tests/integration/placements-db08-batches.test.ts
          tests/integration/placements-db08-registration.test.ts
          tests/integration/placements-db08-external-offers.test.ts
          tests/integration/placements-w04-company-drive-facts.test.ts
          tests/integration/placements-phase2-learner-gates.test.ts
          tests/integration/tpo-batch-workspace-db08.test.ts


  # DB-024/050/067: verify encrypted outbox queue, private opt-outs and
  # composite organization-college FK using an independent disposable fixture.
  # This NEVER sends email and does NOT register or activate draft tables.
  db10-outbound-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB10_ISOLATED_TEST_DATABASE: "1"
      DB10_OUTBOUND_SCOPE_FK_ENFORCED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate registered database journal
        run: npm run db:journal:verify
      - name: Prepare ephemeral PostgreSQL without application DB alias
        run: npm run db:test:prepare
      - name: Apply encrypted outbox and both suppression layers to disposable PG only
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/sql/db10-outbound-queue-staging.sql
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f docs/planning/sql/db10-global-email-suppression-candidate.sql
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f docs/planning/sql/db10-outbound-scope-fk-staging.sql
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f docs/planning/sql/db10-outbound-dispatch-lease-candidate.sql
      - name: DB10 queue confidentiality, idempotency, suppression, tenant and dispatch-fence PG
        env:
          DB067_DISPATCH_ACCEPTANCE: "1"
        run: >
          npx vitest run --config vitest.db.config.ts
          tests/integration/db10-outbound-queue.test.ts
          tests/integration/db10-outbound-scope-fk.test.ts
          tests/integration/db067-global-email-pre-send.test.ts
          tests/integration/db10-global-email-suppression-service.test.ts


  # Original core DB-008: SQL-only evidence for source-backed COURSE identity
  # and parent facets. Both drafts remain unregistered; this cannot certify
  # service/API slug cutover, hierarchy racing or full DB05 field parity.
  db05-staged-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB05_IDENTITY_DISPOSABLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify registered Drizzle journal first
        run: npm run db:journal:verify
      - name: Safely reset and seed disposable PG17 baseline
        run: npm run db:test:prepare
      - name: Apply UNREGISTERED DB05 identity and parent drafts on disposable PG17 ONLY
        shell: bash
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/sql/db05-course-identity.draft.sql
          psql "$TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/sql/db05-course-parent-facets.draft.sql
      - name: DB-008 SQL slug, name, short title, archive and parent FK negative acceptance
        run: node --test tests/db05-course-identity-parent-pg.test.mjs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Readiness is deliberately strict: a healthy application must have a
    # reachable, fully migrated database. Give standalone smoke a disposable
    # PostgreSQL 17 instance instead of teaching /ready to ignore failures.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_smoke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_smoke_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_smoke_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_smoke_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deployment configuration
        env:
          GCP_PROJECT_ID: lms-vnext-dev
          GCP_REGION: asia-south1
          GAR_REPOSITORY: lms-vnext
          CLOUD_RUN_SERVICE: lms-vnext-dev
          CLOUD_SQL_CONNECTION_NAME: lms-vnext-dev:asia-south1:lms-vnext-dev
          CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: runtime@lms-vnext-dev.iam.gserviceaccount.com
          GCP_WORKLOAD_IDENTITY_PROVIDER: projects/123456789/locations/global/workloadIdentityPools/github/providers/github
          GCP_DEPLOYER_SERVICE_ACCOUNT: deployer@lms-vnext-dev.iam.gserviceaccount.com
          DB_USER: lms_vnext_app
          DB_NAME: lms_vnext
          DB_PASSWORD_SECRET: lms-vnext-db-password
        run: node scripts/validate-deployment-config.mjs
      - name: Reject cross-project Cloud SQL target
        env:
          GCP_PROJECT_ID: lms-vnext-dev
          GCP_REGION: asia-south1
          GAR_REPOSITORY: lms-vnext
          CLOUD_RUN_SERVICE: lms-vnext-dev
          CLOUD_SQL_CONNECTION_NAME: other-project:asia-south1:lms-vnext-dev
          CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: runtime@lms-vnext-dev.iam.gserviceaccount.com
          GCP_WORKLOAD_IDENTITY_PROVIDER: projects/123456789/locations/global/workloadIdentityPools/github/providers/github
          GCP_DEPLOYER_SERVICE_ACCOUNT: deployer@lms-vnext-dev.iam.gserviceaccount.com
          DB_USER: lms_vnext_app
          DB_NAME: lms_vnext
          DB_PASSWORD_SECRET: lms-vnext-db-password
        shell: bash
        run: |
          if node scripts/validate-deployment-config.mjs; then
            echo "Invalid Cloud SQL target passed validation"
            exit 1
          fi
      - name: Production build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build
      - name: Prepare disposable PostgreSQL 17 for strict standalone readiness
        # The reset guard rejects production/shared targets. DATABASE_URL is
        # empty ONLY for the destructive setup step, then restored for smoke.
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Standalone HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/lms-vnext-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          SMOKE_RETRIES=20 SMOKE_RETRY_DELAY_MS=500 npm run smoke:public -- http://127.0.0.1:3000 || {
            cat /tmp/lms-vnext-smoke.log
            exit 1
          }
