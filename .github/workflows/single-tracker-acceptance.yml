name: Single Execution Tracker Acceptance
on:
  push:
    paths:
      - docs/tracker.json
      - AGENTS.md
      - README.md
      - docs/project-status.md
      - docs/database-workflow.md
      - docs/parity/README.md
      - scripts/tracker.mjs
      - scripts/verify-db08-cross-parent-source.mjs
      - src/modules/placements/result-service.ts
      - src/db/schema/placements.ts
      - scripts/progress-evidence.mjs
      - tests/tracker-progress-evidence.test.mjs
      - tests/tracker.test.mjs
      - tests/database-domain-packages.test.mjs
      - tests/tracker-ten-lanes.test.mjs
      - tests/closure-first-protocol.test.mjs
      - .github/workflows/single-tracker-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the canonical tracker and open task selection
        run: node scripts/tracker.mjs --check
      - name: Verify domain, phase and closure-first rendering
        run: |
          node scripts/tracker.mjs --domains
          node scripts/tracker.mjs --roadmap
          node scripts/tracker.mjs --progress
          node scripts/tracker.mjs --closure-next
      - name: Execute DB035 DB038 and DB042 source-staging contracts
        run: node --test tests/db06-history-staging.test.mjs tests/db06-assessment-retention-staging.test.mjs tests/db06-attendance-scope-staging.test.mjs
      - name: Verify DB066 locked result staging source guard
        run: node scripts/verify-db08-cross-parent-source.mjs
      - name: Execute plan and task acceptance tests
        run: node --test tests/tracker.test.mjs tests/database-domain-packages.test.mjs tests/tracker-ten-lanes.test.mjs tests/tracker-progress-evidence.test.mjs tests/closure-first-protocol.test.mjs
