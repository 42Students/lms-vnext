name: Generate academics A2 schema

on:
  push:
    branches:
      - academics-a2-schema-gen

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[schema-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: academics-a2-schema-gen

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Drizzle migration
        run: npm run db:generate

      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- drizzle/; then
            echo "No Drizzle changes generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/
          git commit -m "chore: commit academics A2 drizzle output [schema-generated]"
          git push origin HEAD:academics-a2-schema-gen
