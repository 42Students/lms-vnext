name: DB-001 standalone verifier with disposable PostgreSQL 17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/db-independent-verify.mjs"
      - "scripts/db-independent-verifier-redaction.mjs"
      - "scripts/db-independent-verifier-generation-guard.mjs"
      - "drizzle/meta/0316_snapshot.json"
      - "drizzle/meta/_journal.json"
      - "tests/db001-drizzle-deferred-fk-snapshot-contract.test.mjs"
      - "drizzle/0327_db001_canonical_metadata_baseline.sql"
      - "drizzle/meta/0327_snapshot.json"
      - "tests/db001-canonical-baseline-source.test.mjs"
      - "tests/db-independent-verifier-target-preflight.test.mjs"
      - "tests/db-independent-verifier-zero-exit-generation.test.mjs"
      - "tests/db076-independent-verifier-drift.test.mjs"
      - "tests/db-parity-pass5.test.mjs"
      - "tests/integration/db18-witness-index.json"
      - "tests/db41-history-schema-drift.test.mjs"
      - "scripts/db41-history-schema-drift.mjs"
      - "docs/planning/sql/db06-assessment-attendance-history-candidate.sql"
      - "scripts/db-independent-postgres-version.mjs"
      - "tests/integration/db001-canonical-baseline-pg.test.ts"
      - ".github/workflows/db001-independent-verifier-acceptance.yml"
permissions:
  contents: read
concurrency:
  group: db001-independent-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stand-alone-command:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Exact same CLI/target mode runs outside CI. The runner merely supplies
      # a disposable PG17 target, not a CI-specific verifier implementation.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DATABASE_URL: ""
      DB_VERIFY_EVIDENCE_PATH: .verification/db001-pinned.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pin exact code SHA and clean checkout before independent command
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          node --check scripts/db-independent-verify.mjs
      - name: Verify Drizzle v7 representability and deferred SQL integrity
        run: node --test tests/db001-drizzle-deferred-fk-snapshot-contract.test.mjs tests/db-independent-postgres-version.test.mjs tests/db001-canonical-baseline-source.test.mjs
      - name: Execute all 12 independently invocable verification gates
        run: npm run db:verify:independent
      - name: Prove independent evidence really passed on pinned source
        if: success()
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const e=JSON.parse(fs.readFileSync(".verification/db001-pinned.json","utf8")); if(!e.passed || !e.gitHeadUnchanged || !e.sourceTreeCleanAtEnd || e.steps.length!==12 || e.steps.some(s=>s.exitCode!==0)) process.exit(1); console.log("DB001 12/12 PASS",e.gitSha,"runInActions=",e.githubActionsUsed);'
      - name: Preserve generated unregistered schema delta for reconciliation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .verification/db001-generator-diagnostic
          # Diagnostic only. Never promote or execute generated DDL.
          while IFS= read -r path; do
            case "$path" in
              drizzle/[0-9][0-9][0-9][0-9]_*.sql|drizzle/meta/[0-9][0-9][0-9][0-9]_snapshot.json)
                cp -- "$path" ".verification/db001-generator-diagnostic/$(basename "$path")" ;;
            esac
          done < <(git ls-files --others --exclude-standard -- 'drizzle/')
      - name: Upload generated schema diagnosis (NOT a migration)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db001-generated-drift-diagnostic
          path: .verification/db001-generator-diagnostic/
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain redacted acceptance or failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db001-independent-verifier-evidence
          path: .verification/db001-pinned.json
          retention-days: 7
          if-no-files-found: warn
