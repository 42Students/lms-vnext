name: UX-G004 Activity Log acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/app/(authenticated)/activity/**
      - src/modules/activity/ux-query.ts
      - tests/unit/UX-G004-activity-navigation.test.ts
      - tests/e2e/ux-activity-journey.spec.ts
      - .github/workflows/ux-activity-acceptance.yml

concurrency:
  group: ux-g004-activity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused lint and TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npx eslint src/modules/activity/ux-query.ts 'src/app/(authenticated)/activity/page.tsx' 'src/app/(authenticated)/activity/[eventId]/page.tsx' 'src/app/(authenticated)/activity/[eventId]/loading.tsx' tests/unit/UX-G004-activity-navigation.test.ts tests/e2e/ux-activity-journey.spec.ts
          npm run typecheck
      - name: Activity Log focused regression
        run: npx vitest run tests/unit/UX-G004-activity-navigation.test.ts tests/unit/UX-activity-index-01.test.ts tests/unit/UX-activity-event-detail-01.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable E2E database
        run: npm run db:e2e:prepare
      - name: Ephemeral E2E credentials
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Desktop 1280 and mobile 320/390 acceptance
        run: npx playwright test tests/e2e/ux-activity-journey.spec.ts --project=chromium --reporter=line
      - name: Preserve viewport and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-g004-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
