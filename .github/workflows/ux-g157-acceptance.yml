name: UX G157 TPO component acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/components/tpo/tpo-company-team-composer.tsx
      - src/components/tpo/tpo-blocked-dates-editor.tsx
      - src/components/tpo/tpo-batch-student-saved-views.tsx
      - src/app/e2e/ux-g157-fixture/**
      - tests/unit/ux-g157-interactions.test.ts
      - tests/e2e/ux-g157.spec.ts
      - .github/workflows/ux-g157-acceptance.yml

permissions:
  contents: read

jobs:
  scoped-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      UX_G157_FIXTURE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact triggering commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Scoped source and test lint
        run: >-
          npx eslint
          src/components/tpo/tpo-company-team-composer.tsx
          src/components/tpo/tpo-blocked-dates-editor.tsx
          src/components/tpo/tpo-batch-student-saved-views.tsx
          src/app/e2e/ux-g157-fixture/page.tsx
          src/app/e2e/ux-g157-fixture/client.tsx
          tests/unit/ux-g157-interactions.test.ts
          tests/e2e/ux-g157.spec.ts
      - name: Unit behavior guard checks
        run: npx vitest run tests/unit/ux-g157-interactions.test.ts --reporter=dot
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile real-component acceptance
        run: npx playwright test tests/e2e/ux-g157.spec.ts --project=chromium --reporter=line
      - name: TypeScript integrity
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Store screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g157-browser-evidence
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 7
