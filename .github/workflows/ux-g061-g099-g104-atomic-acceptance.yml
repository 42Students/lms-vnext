name: UX-G061 G099 G104 atomic authenticated closure acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/(authenticated)/learn/courses/[deliveryId]/[...courseTab]/**'
      - 'src/app/(authenticated)/tpo/batches/[batchId]/classes/**'
      - 'src/app/(authenticated)/tpo/batches/[batchId]/error.tsx'
      - 'src/app/(authenticated)/tpo/messages/**'
      - 'tests/e2e/ux-g061-course-route-acceptance.spec.ts'
      - 'tests/e2e/ux-g099-tpo-batch-classes-acceptance.spec.ts'
      - 'tests/e2e/ux-g104-tpo-messages-acceptance.spec.ts'
      - 'tests/unit/ux-five-doing-groups-context-recovery.test.ts'
      - '.github/workflows/ux-g061-g099-g104-atomic-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: ux-g061-g099-g104-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: 'true'
      APP_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_JSON_OUTPUT_NAME: ux-g061-g099-g104.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact-SHA and scoped source ESLint
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx eslint \
            'src/app/(authenticated)/learn/courses/[deliveryId]/[...courseTab]' \
            'src/app/(authenticated)/tpo/batches/[batchId]/classes' \
            'src/app/(authenticated)/tpo/batches/[batchId]/error.tsx' \
            'src/app/(authenticated)/tpo/messages' \
            tests/e2e/ux-g061-course-route-acceptance.spec.ts \
            tests/e2e/ux-g099-tpo-batch-classes-acceptance.spec.ts \
            tests/e2e/ux-g104-tpo-messages-acceptance.spec.ts \
            tests/unit/ux-five-doing-groups-context-recovery.test.ts
      - name: Focused UX recovery unit tests
        run: npx vitest run tests/unit/ux-five-doing-groups-context-recovery.test.ts --reporter=dot
      - name: Full TypeScript
        run: npm run typecheck
      - name: Prepare disposable database
        run: npm run db:e2e:prepare
      - name: Ephemeral auth keys
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Learner and TPO actual desktop/mobile and role negative journeys
        run: |
          npx playwright test \
            tests/e2e/ux-g061-course-route-acceptance.spec.ts \
            tests/e2e/ux-g099-tpo-batch-classes-acceptance.spec.ts \
            tests/e2e/ux-g104-tpo-messages-acceptance.spec.ts \
            --project=chromium --workers=1 --reporter=line,json
          node -e 'const s=require("./ux-g061-g099-g104.json").stats; console.log(s); if(s.expected!==5||s.unexpected!==0||s.skipped!==0||s.flaky!==0)process.exit(1)'
      - name: Preserve exact-SHA screenshots, traces and statistics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g061-g099-g104-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            ux-g061-g099-g104.json
          if-no-files-found: ignore
          retention-days: 14
