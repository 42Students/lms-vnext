name: Learner legacy assignments visual capture

on:
  pull_request:
    paths:
      - ".github/workflows/learner-legacy-assignments-visual.yml"
      - "src/app/(authenticated)/learn/allAssignments/page.tsx"
      - "src/components/courses/learner-assessment-overview.tsx"
      - "src/components/courses/learner-legacy-assignment-list.module.css"
      - "tests/e2e/learner-legacy-assignments-visual.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learner-candidate-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare disposable Learner browser fixtures
        run: npm run db:e2e:prepare
      - name: Generate isolated browser authentication keys
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Capture real Learner assignment candidate and test desktop/mobile
        run: npx playwright test --project=chromium tests/e2e/learner-legacy-assignments-visual.spec.ts
      - name: Archive candidate screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learner-legacy-assignments-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
