name: Learner legacy assignments visual capture

on:
  pull_request:
    paths:
      - ".github/workflows/learner-legacy-assignments-visual.yml"
      - "src/app/(authenticated)/learn/allAssignments/page.tsx"
      - "src/components/courses/learner-assessment-overview.tsx"
      - "src/components/courses/learner-legacy-assignment-list.module.css"
      - "tests/e2e/learner-legacy-assignments-visual.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learner-candidate-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare disposable Learner browser fixtures
        run: npm run db:e2e:prepare
      - name: Seed actual old LMS Java assignment only in disposable DB
        run: npx tsx scripts/audit/seed-learner-assignments-visual-fixture.ts
      - name: Generate isolated browser authentication keys
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Capture real Learner assignment candidate and test desktop/mobile
        run: npx playwright test --project=chromium tests/e2e/learner-legacy-assignments-visual.spec.ts
      - name: Checkout merged comparator into isolated directory
        uses: actions/checkout@v4
        with:
          ref: main
          path: .compare-tools
      - name: Checkout detached old LMS screenshots
        uses: actions/checkout@v4
        with:
          ref: parity-baseline
          path: .reference
      - name: Produce actual baseline-versus-candidate Learner screenshot diff
        shell: bash
        run: |
          candidate=$(find test-results -name learner-all-assignments-1280x800.png -print -quit)
          test -n "$candidate" || { echo "Candidate screenshot missing"; exit 2; }
          mkdir -p test-results/learner-legacy-pixel-comparison
          result=0
          node .compare-tools/scripts/audit/legacy-pixel-compare.mjs \
            --old .reference/old/learner/_learn_allAssignments__base__67d5d6264c.png \
            --new "$candidate" \
            --out test-results/learner-legacy-pixel-comparison || result=$?
          if [ "$result" -gt 1 ]; then
            echo "Unexpected comparator failure: $result"
            exit "$result"
          fi
          echo "Learner pixel comparison diagnostic code: $result (1 means differences remain)."
      - name: Checkout approved PNG comparator
        if: always()
        uses: actions/checkout@v4
        with:
          ref: main
          path: .compare-tools
      - name: Checkout independent legacy screenshots
        if: always()
        uses: actions/checkout@v4
        with:
          ref: parity-baseline
          path: .reference
      - name: Measure candidate against frozen learner-001 screenshot
        if: always()
        shell: bash
        run: |
          candidate=$(find test-results -name learner-all-assignments-1280x800.png -print -quit)
          if [ -z "$candidate" ]; then
            echo "No learner candidate PNG was captured; browser tests must be fixed first."
            exit 0
          fi
          mkdir -p test-results/learner-legacy-pixel-comparison
          result=0
          node .compare-tools/scripts/audit/legacy-pixel-compare.mjs \
            --old .reference/old/learner/_learn_allAssignments__base__67d5d6264c.png \
            --new "$candidate" \
            --out test-results/learner-legacy-pixel-comparison || result=$?
          if [ "$result" -gt 1 ]; then
            echo "Pixel comparator execution error: $result"
            exit "$result"
          fi
          echo "Visual comparison exit $result. Difference is diagnostic until independently reviewed."
      - name: Archive candidate screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learner-legacy-assignments-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
