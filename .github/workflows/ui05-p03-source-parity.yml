name: UI-05 P03 — Source Parity (assignments, quizzes, grading, attendance)

on:
  push:
    paths:
      - "src/app/(authenticated)/admin/assignments/**"
      - "src/app/(authenticated)/admin/quizzes/**"
      - "src/app/(authenticated)/admin/attendance/**"
      - "src/app/(authenticated)/admin/faculty-assignment/**"
      - "src/app/(authenticated)/college/assignments/**"
      - "src/app/(authenticated)/college/quizzes/**"
      - "src/app/(authenticated)/college/attendance/**"
      - "src/app/(authenticated)/college/faculty-assignment/**"
      - "src/app/(authenticated)/learn/allAssignments/**"
      - "src/app/(authenticated)/learn/allQuizzes/**"
      - "src/app/(authenticated)/learn/attendance/**"
      - "src/app/(authenticated)/learn/quizzes/**"
      - "src/app/(authenticated)/teacher/allAssignments/**"
      - "src/app/(authenticated)/teacher/allQuizzes/**"
      - "src/app/(authenticated)/teacher/courses/**"
      - "src/app/(authenticated)/teacher/report/**"
      - "src/app/(authenticated)/mentor/allQuizzes/**"
      - "docs/planning/ui-inventory-ui05.json"
      - "docs/planning/ui-strings-ui05.json"
      - "tests/ui05-source-parity.test.mjs"
  pull_request:
    paths:
      - "src/app/(authenticated)/admin/assignments/**"
      - "src/app/(authenticated)/admin/quizzes/**"
      - "src/app/(authenticated)/admin/attendance/**"
      - "src/app/(authenticated)/teacher/**"
      - "tests/ui05-source-parity.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui05-p03-source-parity:
    name: UI-05 P03 source parity (no browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run UI-05 source parity test
        run: node --test tests/ui05-source-parity.test.mjs

      - name: Verify inventory and catalogue files exist
        run: |
          test -f docs/planning/ui-inventory-ui05.json && echo "inventory OK" || (echo "MISSING: ui-inventory-ui05.json" && exit 1)
          test -f docs/planning/ui-strings-ui05.json && echo "strings OK" || (echo "MISSING: ui-strings-ui05.json" && exit 1)

      - name: Print surface count
        run: |
          node -e "
            const inv = JSON.parse(require('fs').readFileSync('docs/planning/ui-inventory-ui05.json','utf8'));
            const cat = JSON.parse(require('fs').readFileSync('docs/planning/ui-strings-ui05.json','utf8'));
            console.log('Surfaces:', inv.surfaces.length, '(total declared:', inv.totalSurfaces + ')');
            console.log('Missing:', inv.surfaces.filter(s => s.disposition === 'MISSING').length);
            console.log('Strings:', Object.keys(cat.strings).length);
          "
