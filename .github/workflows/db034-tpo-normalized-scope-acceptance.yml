name: DB-034 normalized TPO settings registered scope acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "drizzle/0314_db09_tpo_normalized_settings_scope_guards.sql"
      - "drizzle/meta/0314_snapshot.json"
      - "tests/db034-db036-registered-tpo-settings-pg.test.mjs"
      - ".github/workflows/db034-tpo-normalized-scope-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: db034-tpo-settings-scope-main
  cancel-in-progress: false

jobs:
  db034-registered-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB034_036_REGISTERED_PG: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Registered journal integrity and normalized source/runtime contract
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm run db:journal:verify
          node --test tests/db09-tpo-settings-normalization.test.mjs tests/db034-tpo-prep-courses-runtime-contract.test.mjs
      - name: Fresh disposable PG17 migration replay and canonical seed
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Registered replay idempotence
        run: npm run db:migrate
      - name: DB034 normalized domain, actor, same-org course and SQL negatives
        run: node --test --test-name-pattern=DB034 tests/db034-db036-registered-tpo-settings-pg.test.mjs
      - name: TPO settings writer and normalized reader model
        run: >-
          npx vitest run
          tests/unit/chat2-settings-people-trusted-links-cas.test.ts
          tests/unit/chat11-tpo-settings-write-model-matrix.test.ts
      - name: Verify journal not rewritten during acceptance
        run: |
          npm run db:journal:verify
          test -z "$(git status --porcelain -- drizzle/)"
