name: UX-G069 G091 Mentor Faculty recovery acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/(authenticated)/mentor/**'
      - 'src/app/(authenticated)/teacher/calendar/**'
      - 'src/app/(authenticated)/teacher/contacts/**'
      - 'src/app/(authenticated)/teacher/allQuizzes/**'
      - 'tests/ux-g069-g091-contract.test.mjs'
      - 'tests/e2e/ux-g069-g091-role-recovery.spec.ts'
      - '.github/workflows/ux-g069-g091-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: ux-g069-g091-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: lms_vnext_e2e }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: 'true'
      UX_G069_G091_SEED: 'true'
      APP_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Assert exact source commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && echo "$GITHUB_SHA" > ux-g069-g091-source-sha.txt
      - run: node --test tests/ux-g069-g091-contract.test.mjs
      - name: Scoped ESLint
        run: |
          npx eslint 'src/app/(authenticated)/mentor/allQuizzes/page.tsx' 'src/app/(authenticated)/mentor/fileExplorer/page.tsx' 'src/app/(authenticated)/mentor/courses/page.tsx' 'src/app/(authenticated)/mentor/contacts/[[...contactsTab]]/page.tsx' 'src/app/(authenticated)/mentor/courses/[courseId]/[[...courseTab]]/page.tsx' 'src/app/(authenticated)/mentor/calendar/page.tsx' 'src/app/(authenticated)/teacher/calendar/page.tsx' 'src/app/(authenticated)/teacher/contacts/[contactsTab]/page.tsx' 'src/app/(authenticated)/teacher/allQuizzes/page.tsx' tests/e2e/ux-g069-g091-role-recovery.spec.ts
          npm run typecheck
      - run: npm run db:e2e:prepare
      - name: Seed synthetic Mentor role
        env: { ALLOW_TEST_SEED: I_ACCEPT, UX_ROLE_MEMBERSHIPS_ONLY: '1' }
        run: npx tsx scripts/seed-test-tenants.ts
      - name: Ephemeral test secrets
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/ux-g069-g091-role-recovery.spec.ts --project=chromium --reporter=line
      - name: Save screenshots/traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g069-g091-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            ux-g069-g091-source-sha.txt
          if-no-files-found: ignore
