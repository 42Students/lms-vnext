name: Mentor required meeting behavior and overflow guards

on:
  pull_request:
    paths:
      - ".github/workflows/mentor-calendar-visual-guard.yml"
      - "src/components/projects/mentor-meetings-calendar.module.css"
      - "src/components/projects/mentor-meetings-calendar.tsx"
      - "src/app/(authenticated)/mentor/calendar/page.tsx"
      - "tests/mentor-meetings-calendar-grid-layout.test.mjs"
      - "src/modules/projects/mentor-calendar-viewer-time-model.ts"
      - "tests/unit/mentor-calendar-viewer-time-model.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mentor-detail-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run meeting detail grid and preserved-controls regression
        run: node --test tests/mentor-meetings-calendar-grid-layout.test.mjs
      - name: Verify viewer-local meeting date/time and historical meeting status rules
        run: npx vitest run tests/unit/mentor-calendar-viewer-time-model.test.ts tests/unit/w03-mentor-calendar.test.ts
      - name: Strict application typecheck on updated Mentor JSX
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
