name: UX-G178 real-device People CSV acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/e2e/ux-g178-real-device-people-exports.spec.ts'
      - '.github/workflows/ux-g178-real-device-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: ux-g178-real-device-${{ github.ref }}
  cancel-in-progress: false
jobs:
  otp-people-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      APP_ENV: development
      E2E_AUTH_ENABLED: 'true'
      PLATFORM_HOSTS: localhost,127.0.0.1
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_JSON_OUTPUT_NAME: ux-g178-real-otp-results.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact SHA, scoped lint and full TypeScript
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx eslint tests/e2e/ux-g178-real-device-people-exports.spec.ts
          npm run typecheck
      - name: Existing People export regression suites
        run: |
          npx vitest run tests/unit/ux-five-group-batch-20261107.test.ts tests/unit/college-people-export-model.test.ts tests/unit/college-contacts-export-model.test.ts tests/unit/private-bulk-csv-security.test.ts --reporter=dot
      - name: Prepare isolated PG17 and seeded role fixtures
        run: npm run db:e2e:prepare
      - name: Issue ephemeral OTP and first-party session secrets
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_TEST_OTP=$(shuf -i 100000-999999 -n 1)" >> "$GITHUB_ENV"
          echo "AUTH_TEST_EMAILS=collegeadmin.seed@example.com,superadmin.seed@example.com" >> "$GITHUB_ENV"
          echo "AUTH_TEST_PHONES=+919000000001,+919000000002" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: OTP-authenticated college, platform and denial browser cases
        run: |
          npx playwright test tests/e2e/ux-g178-real-device-people-exports.spec.ts --project=chromium --workers=1 --reporter=line,json
          node -e 'const s=require("./ux-g178-real-otp-results.json").stats;if(s.expected!==5||s.unexpected!==0||s.flaky!==0||s.skipped!==0)process.exit(1)'
      - name: Save real-download screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g178-otp-people-export-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            ux-g178-real-otp-results.json
          if-no-files-found: ignore
          retention-days: 14
