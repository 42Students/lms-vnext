name: DB-006 registered groups and elective integrity acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'drizzle/0306_db03_elective_kernel_integrity.sql'
      - 'tests/integration/groups-db03*.test.ts'
      - 'src/modules/groups/**'
      - 'src/modules/electives/**'
      - '.github/workflows/db006-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: db006-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  db03-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:journal:verify
      - name: Replay registered migration chain and seed disposable PG17
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Replay idempotence
        run: npm run db:migrate
      - name: DB03 PostgreSQL roster, tenant, rule and elective race tests
        run: >
          npx vitest run --config vitest.db.config.ts
          tests/integration/groups-db03.test.ts
          tests/integration/groups-db03-roster.test.ts
          tests/integration/groups-db03-project-team.test.ts
          tests/integration/groups-db03-actor-freshness.test.ts
      - name: DB03 source and rule-evaluator checks
        run: >
          node --test tests/db-parity-db03-schema.test.mjs
          tests/db03-elective-program-oracle.test.mjs
