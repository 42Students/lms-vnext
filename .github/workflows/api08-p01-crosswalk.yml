name: API-08-P01 Endpoint Crosswalk

on:
  push:
    branches: [main]
    paths:
      - 'docs/planning/api-crosswalk-api08.json'
      - 'docs/planning/api-inventory-api08.json'
      - 'tests/api08-endpoint-crosswalk.test.mjs'
      - '.github/workflows/api08-p01-crosswalk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosswalk:
    name: API-08-P01 TPO CRM crosswalk completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Verify crosswalk JSON exists
        run: |
          test -f docs/planning/api-crosswalk-api08.json || (echo "FAIL: crosswalk file missing" && exit 1)
          test -f docs/planning/api-inventory-api08.json || (echo "FAIL: inventory file missing" && exit 1)

      - name: Validate crosswalk JSON structure
        run: |
          node -e "
            const c = JSON.parse(require('fs').readFileSync('docs/planning/api-crosswalk-api08.json','utf8'));
            if (c.milestoneId !== 'API-08') throw new Error('wrong milestoneId');
            if (!Array.isArray(c.endpoints)) throw new Error('no endpoints array');
            console.log('crosswalk valid: ' + c.endpoints.length + ' endpoints');
          "

      - name: Run crosswalk completeness tests
        run: node --test tests/api08-endpoint-crosswalk.test.mjs

      - name: Print summary
        if: always()
        run: |
          node -e "
            const c = JSON.parse(require('fs').readFileSync('docs/planning/api-crosswalk-api08.json','utf8'));
            const s = c.summary;
            console.log('=== API-08-P01 CROSSWALK SUMMARY ===');
            console.log('Total endpoints : ' + s.total);
            console.log('MAPPED          : ' + s.mapped);
            console.log('REDESIGNED      : ' + s.redesigned);
            console.log('RETIRED         : ' + s.retired);
            console.log('MISSING (gaps)  : ' + s.missing);
            console.log('Coverage        : ' + Math.round((s.mapped+s.redesigned+s.retired)/s.total*100) + '%');
          "
