# Enforce academic API byte limits and unambiguous resource selectors.
name: Security - academic API input boundaries

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/bounded-json-body.ts"
      - "src/lib/bounded-utf8-body.ts"
      - "src/app/api/academics/**"
      - "src/app/api/v1/class/**"
      - "src/app/api/v1/new-program/**"
      - "src/app/api/v1/program/**"
      - "tests/unit/security-academic-program-bounded-body.test.ts"
      - "tests/unit/security-academic-collection-bounded-body.test.ts"
      - "tests/unit/security-academic-query-ambiguity.test.ts"
      - "tests/unit/security-academic-detail-bounded-body.test.ts"
      - ".github/workflows/security-academic-program-json.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/bounded-json-body.ts"
      - "src/lib/bounded-utf8-body.ts"
      - "src/app/api/academics/**"
      - "src/app/api/v1/class/**"
      - "src/app/api/v1/new-program/**"
      - "src/app/api/v1/program/**"
      - "tests/unit/security-academic-program-bounded-body.test.ts"
      - "tests/unit/security-academic-collection-bounded-body.test.ts"
      - "tests/unit/security-academic-query-ambiguity.test.ts"
      - "tests/unit/security-academic-detail-bounded-body.test.ts"
      - ".github/workflows/security-academic-program-json.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-academic-program-json-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  academic-input-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the exact source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Actual academic JSON size, CSRF, selector and positive-path tests
        run: npx vitest run tests/unit/security-academic-program-bounded-body.test.ts tests/unit/security-academic-collection-bounded-body.test.ts tests/unit/security-academic-query-ambiguity.test.ts tests/unit/security-academic-detail-bounded-body.test.ts
      - name: Full TypeScript typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
