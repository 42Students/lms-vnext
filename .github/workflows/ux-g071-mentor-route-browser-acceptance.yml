name: UX-G071 Mentor review five-route browser acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/e2e/ux-g071-mentor-route-surfaces.spec.ts'
      - 'scripts/db-e2e-prepare.ts'
      - 'tests/ux-groups.test.mjs'
      - '.github/workflows/ux-g071-mentor-route-browser-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: ux-g071-five-route-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mentor-route-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: 'true'
      APP_ENV: development
      MENTOR_E2E_SEED_PROJECT: 'true'
      UX_G071_SEED_REVIEW: 'true'
      PLATFORM_HOSTS: localhost,127.0.0.1
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_JSON_OUTPUT_NAME: ux-g071-route-browser-results.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact SHA, scoped ESLint and full TypeScript
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx eslint tests/e2e/ux-g071-mentor-route-surfaces.spec.ts tests/unit/ux-g071-mentor-review-drilldown.test.ts
          npm run typecheck
      - name: Existing Mentor review and route unit regressions
        run: |
          npx vitest run tests/unit/ux-g071-mentor-review-drilldown.test.ts --reporter=dot
          node --test tests/ux-groups.test.mjs
      - name: Prepare disposable Postgres, seeded faculty Mentor and project
        run: npm run db:e2e:prepare
      - name: Set ephemeral development-only test identity keys
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real five-route Mentor responsive, invalid filter and tenant-denial checks
        run: |
          npx playwright test tests/e2e/ux-g071-mentor-route-surfaces.spec.ts --project=chromium --workers=1 --reporter=line,json
          node -e 'const s=require("./ux-g071-route-browser-results.json").stats;if(s.expected!==3||s.unexpected!==0||s.flaky!==0||s.skipped!==0)process.exit(1)'
      - name: Preserve responsive screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g071-mentor-route-browser-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            ux-g071-route-browser-results.json
          if-no-files-found: ignore
          retention-days: 14
