name: UX-G050 G052 G077 marketing journeys acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/enterprises/**'
      - 'src/app/home/**'
      - 'src/app/platform/**'
      - 'tests/ux-marketing-trio-group.test.mjs'
      - 'tests/e2e/ux-marketing-trio.spec.ts'
      - '.github/workflows/ux-marketing-trio-acceptance.yml'

permissions:
  contents: read

jobs:
  public-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scope-owned ESLint and group contracts
        run: |
          npx eslint src/app/enterprises/page.tsx src/app/enterprises/error.tsx src/app/enterprises/loading.tsx src/app/home/page.tsx src/app/home/error.tsx src/app/home/loading.tsx src/app/platform/page.tsx src/app/platform/error.tsx src/app/platform/loading.tsx tests/e2e/ux-marketing-trio.spec.ts
          node --test tests/ux-marketing-trio-group.test.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile end-to-end acceptance
        run: npx playwright test tests/e2e/ux-marketing-trio.spec.ts --project=chromium --reporter=line
      - name: Preserve six viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-marketing-trio-${{ github.sha }}
          path: ux-marketing-trio-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Global TypeScript compatibility
        run: npm run typecheck
