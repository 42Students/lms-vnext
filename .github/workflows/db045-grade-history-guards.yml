name: DB-045 registered grade-history integrity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "drizzle/0320_db045_grade_event_guards.sql"
      - "drizzle/0321_db045_grade_event_completeness.sql"
      - "drizzle/0322_db045_grade_event_enum_cast.sql"
      - "drizzle/0324_db045_attendance_immutable_history.sql"
      - "drizzle/meta/0324_snapshot.json"
      - "drizzle/meta/0325_snapshot.json"
      - "tests/support/db045-attendance-fixture.mjs"
      - "src/modules/attendance/history-event.ts"
      - "src/modules/courses/delivery-roster.ts"
      - "src/modules/groups/roster-access.ts"
      - "tests/unit/chat7-course-delivery-roster-weak.test.ts"
      - "src/modules/attendance/faculty-service.ts"
      - "src/modules/attendance/faculty-correction-token-model.ts"
      - "tests/unit/attendance-record-token-monotonic.test.ts"
      - "src/modules/attendance/admin-service.ts"
      - "src/modules/people/e2e-fixture-seed-service.ts"
      - "drizzle/meta/0322_snapshot.json"
      - "drizzle/meta/0321_snapshot.json"
      - "drizzle/meta/_journal.json"
      - "drizzle/meta/0320_snapshot.json"
      - "tests/db045-registered-grade-history-pg.test.mjs"
      - "tests/support/db045-immutable-grade-fixture-cleanup.mjs"
      - "tests/integration/courses-c4a-assignments.test.ts"
      - "tests/integration/courses-c4c-assessment-progress.test.ts"
      - "tests/integration/faculty-mentor-positive-courses.test.ts"
      - "tests/integration/college-admin-attendance.test.ts"
      - "tests/integration/academics-a2.test.ts"
      - "tests/integration/faculty-c4-reports-audit-contact.test.ts"
      - "tests/support/db045-attendance-fixture.mjs"
      - ".github/workflows/db045-grade-history-guards.yml"
permissions:
  contents: read
jobs:
  grade-history:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB045_DISPOSABLE_PG: "1"
      DB03_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: DB045 roster-reader and monotonic attendance token regressions
        run: >
          npx vitest run
          tests/unit/attendance-record-token-monotonic.test.ts
          tests/unit/chat7-course-delivery-roster-weak.test.ts
      - name: Typecheck application DB045 producers
        # The full application graph exceeds V8's default ~4 GiB old-space on
        # this runner. Preserve the full tsc gate; give it available memory
        # rather than skipping or narrowing the security-sensitive check.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - run: npm run db:journal:verify
      - name: Disposable full registered replay and seed
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Registered migration idempotence
        run: npm run db:migrate
      - name: Grade-history protection and missing-submission negative witnesses
        run: node --test tests/db045-registered-grade-history-pg.test.mjs
      - name: Grade, publish and immutable test-fixture teardown integration
        run: >
          npx vitest run --config vitest.db.config.ts
          tests/integration/courses-c4a-assignments.test.ts
          tests/integration/courses-c4c-assessment-progress.test.ts
          tests/integration/faculty-mentor-positive-courses.test.ts

      - name: Attendance Faculty, Admin, learner schedule and report consumers
        run: >
          npx vitest run --config vitest.db.config.ts
          tests/integration/college-admin-attendance.test.ts
          tests/integration/academics-a2.test.ts
          tests/integration/faculty-c4-reports-audit-contact.test.ts
