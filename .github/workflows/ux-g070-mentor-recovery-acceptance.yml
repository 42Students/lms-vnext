name: UX-G070 mentor projects and notifications route acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/app/(authenticated)/mentor/notifications/error.tsx
      - src/app/(authenticated)/mentor/notifications/loading.tsx
      - src/app/(authenticated)/mentor/projects/[projectId]/board-review/**
      - src/app/(authenticated)/mentor/projects/[projectId]/activity-history/**
      - src/components/projects/mentor-project-filter-error.tsx
      - src/app/e2e/ux-mentor-route-recovery/**
      - tests/unit/ux-g070-mentor-route-recovery.test.tsx
      - tests/e2e/ux-g070-mentor-route-recovery.spec.ts
      - .github/workflows/ux-g070-mentor-recovery-acceptance.yml
permissions:
  contents: read
concurrency:
  group: ux-g070-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: development
      E2E_AUTH_ENABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Scoped lint
        run: npx eslint 'src/app/(authenticated)/mentor/notifications/error.tsx' 'src/app/(authenticated)/mentor/notifications/loading.tsx' 'src/app/(authenticated)/mentor/projects/[projectId]/board-review/page.tsx' 'src/app/(authenticated)/mentor/projects/[projectId]/board-review/error.tsx' 'src/app/(authenticated)/mentor/projects/[projectId]/activity-history/page.tsx' 'src/app/(authenticated)/mentor/projects/[projectId]/activity-history/error.tsx' src/components/projects/mentor-project-filter-error.tsx src/app/e2e/ux-mentor-route-recovery tests/unit/ux-g070-mentor-route-recovery.test.tsx tests/e2e/ux-g070-mentor-route-recovery.spec.ts
      - name: Unit route regressions
        run: npx vitest run tests/unit/ux-g070-mentor-route-recovery.test.tsx --reporter=dot
      - name: Setup Chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive route recovery browser
        run: npx playwright test tests/e2e/ux-g070-mentor-route-recovery.spec.ts --project=chromium --reporter=line
      - name: Full TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Preserve screenshots and trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g070-mentor-desktop-mobile
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
