# Independent path gate for credential files that content/entropy scanners
# can miss (e.g., binary .p12 and service-account JSON attachments).
name: Security - reject committed credential artifacts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-credential-artifacts-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  reject-credential-artifact-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove sensitive-path detection and redacted reporting
        run: node --test tests/security-credential-artifact-gate.test.mjs
      - name: Fail closed for committed credential files and intermediate commits
        shell: bash
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            base="$(git rev-parse HEAD^)"
          elif [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$BASE_SHA" != "$zero" ] &&
               git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            base="$BASE_SHA"
          else
            echo "::error::Cannot prove a trusted commit range."
            exit 2
          fi
          node scripts/security/credential-artifact-gate.mjs --range "$base..HEAD"
