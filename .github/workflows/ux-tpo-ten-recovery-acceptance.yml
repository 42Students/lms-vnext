name: UX-G098-G108 TPO ten-group browser and route acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/e2e/ux-tpo-ten-recovery/**'
      - 'tests/unit/ux-tpo-ten-recovery.test.ts'
      - 'tests/e2e/ux-tpo-ten-recovery.spec.ts'
      - 'tests/integration/ux-g098-audit-persisted-scope.test.ts'
      - '.github/workflows/ux-tpo-ten-recovery-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: ux-tpo-ten-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: 'true'
      UX_TPO_TEN_FIXTURE: '1'
      APP_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_JSON_OUTPUT_NAME: ux-tpo-ten-results.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirm exact commit, lint and full TypeScript
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx eslint src/app/e2e/ux-tpo-ten-recovery tests/unit/ux-tpo-ten-recovery.test.ts tests/e2e/ux-tpo-ten-recovery.spec.ts
          npm run typecheck
      - name: TPO security and recovery unit contracts
        run: |
          npx vitest run tests/unit/ux-tpo-ten-recovery.test.ts
          npm run ux:groups -- --check
      - name: Prepare isolated database
        run: npm run db:e2e:prepare
      - name: Seed real, test-only identities
        env:
          ALLOW_TEST_SEED: I_ACCEPT
          UX_ROLE_MEMBERSHIPS_ONLY: '1'
        run: npx tsx scripts/seed-test-tenants.ts
      - name: G098 persisted two-college actor audit and CSV evidence
        env:
          DB10_ISOLATED_TEST_DATABASE: '1'
          DB03_ISOLATED_TEST_DATABASE: '1'
        run: npx vitest run --config vitest.db.config.ts tests/integration/ux-g098-audit-persisted-scope.test.ts --maxWorkers=1
      - name: Ephemeral auth keys
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser desktop/mobile and learner denial, no skips/flakes
        run: |
          npx playwright test tests/e2e/ux-tpo-ten-recovery.spec.ts --project=chromium --workers=2 --reporter=line,json
          node -e 'const s=require("./ux-tpo-ten-results.json").stats; console.log(s); if(s.expected!==84||s.unexpected!==0||s.flaky!==0||s.skipped!==0)process.exit(1)'
      - name: Keep screenshots, logs and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-tpo-ten-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            ux-tpo-ten-results.json
          if-no-files-found: ignore
          retention-days: 14
