name: UX-G170 G172 Attendance and college export acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/modules/attendance/college-department-csv-model.ts
      - src/modules/attendance/college-department-csv-service.ts
      - src/modules/attendance/learner-attendance-history-csv-model.ts
      - src/modules/colleges/admin-history-export-model.ts
      - src/modules/colleges/admin-readiness-export-model.ts
      - src/modules/colleges/admin-tenant-export-model.ts
      - src/app/e2e/ux-g170-g172-csv/**
      - tests/unit/ux-g170-g172-csv-acceptance.test.ts
      - tests/e2e/ux-g170-g172-csv.spec.ts
      - tests/e2e/ux-g170-g172-authenticated-csv.spec.ts
      - .github/workflows/ux-g170-g172-csv-acceptance.yml

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      UX_EXPORT_FIXTURE: "1"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      DB03_ISOLATED_TEST_DATABASE: "1"
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify actual checkout matches triggering commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scoped lint
        run: |
          npx eslint src/modules/attendance/college-department-csv-model.ts src/modules/attendance/college-department-csv-service.ts src/modules/attendance/learner-attendance-history-csv-model.ts src/modules/colleges/admin-history-export-model.ts src/modules/colleges/admin-readiness-export-model.ts src/modules/colleges/admin-tenant-export-model.ts src/app/e2e/ux-g170-g172-csv/page.tsx tests/unit/ux-g170-g172-csv-acceptance.test.ts tests/e2e/ux-g170-g172-csv.spec.ts tests/e2e/ux-g170-g172-authenticated-csv.spec.ts
      - name: Full TypeScript verification
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Regression unit and export boundary tests
        run: |
          npx vitest run tests/unit/ux-g170-g172-csv-acceptance.test.ts tests/unit/learner-attendance-history-csv-model.test.ts tests/unit/college-department-attendance-export.test.ts tests/unit/chat4-college-admin-export-boundaries.test.ts tests/unit/super-admin-readiness-export.test.ts tests/unit/chat4-superadmin-readiness-csv-formula.test.ts tests/unit/admin-tenant-export-model.test.ts tests/unit/chat4-super-admin-tenant-export-security.test.ts
      - name: Chromium with OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Prepare guarded disposable E2E database
        run: npm run db:e2e:prepare
      - name: Real database tenant authorization integration
        run: npx vitest run --config vitest.db.config.ts tests/integration/college-department-attendance-export.test.ts
      - name: Configure ephemeral OTP-only test credentials
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
          echo "AUTH_TEST_OTP=$(shuf -i 100000-999999 -n 1)" >> "$GITHUB_ENV"
          echo "AUTH_TEST_EMAILS=superadmin.seed@example.com,collegeadmin.seed@example.com" >> "$GITHUB_ENV"
          echo "AUTH_TEST_PHONES=+919000000001" >> "$GITHUB_ENV"
      - name: Desktop and mobile download browser checks
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ux-g170-g172-browser-results.json
        run: |
          set -euo pipefail
          npx playwright test tests/e2e/ux-g170-g172-csv.spec.ts tests/e2e/ux-g170-g172-authenticated-csv.spec.ts --project=chromium --reporter=line,json,html
          node -e 'const s=require("./ux-g170-g172-browser-results.json").stats; if(s.expected!==5||s.unexpected!==0||s.flaky!==0||s.skipped!==0){console.error("CSV UX browser proof failed:",s);process.exit(1)};console.log("Browser proof:",s)'
      - name: Preserve real screenshot and download evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g170-g172-export-browser-evidence
          path: |
            test-results/
            playwright-report/
            ux-g170-g172-browser-results.json
          if-no-files-found: ignore
