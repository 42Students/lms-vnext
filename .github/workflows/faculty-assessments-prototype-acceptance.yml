name: Faculty unified Assessments prototype acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/faculty-assessments-prototype-acceptance.yml"
      - "src/app/(authenticated)/teacher/assessments/**"
      - "src/components/courses/faculty-prototype-assessment-directory.tsx"
      - "src/components/courses/faculty-assessment-create.tsx"
      - "tests/e2e/faculty-assessments-prototype.spec.ts"
permissions:
  contents: read
concurrency:
  group: faculty-assessments-prototype-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable PostgreSQL
        run: npm run db:e2e:prepare
      - name: Ephemeral identity keys
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Unified Assignments and quizzes screenshot #09 desktop/mobile browser
        run: npx playwright test tests/e2e/faculty-assessments-prototype.spec.ts --workers=1
      # Shared TPO/Recruiter typecheck failures must not obscure the focused
      # authenticated Faculty browser acceptance result. Still enforce the
      # repository-wide typecheck as a separate final, mandatory gate.
      - name: Type-check unified assessment creation and table
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
