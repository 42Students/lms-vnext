name: Faculty Blueprint prototype acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/faculty-blueprint-prototype-acceptance.yml"
      - "drizzle/0318_db014_cross_domain_event_guards.sql"
      - "src/components/courses/faculty-prototype-blueprint.tsx"
      - "src/modules/courses/faculty-blueprint-full-content-order.ts"
      - "tests/unit/faculty-blueprint-full-content-order.test.ts"
      - "tests/unit/faculty-blueprint-empty-states-closure.test.tsx"
      - "src/components/courses/faculty-prototype-lesson-items.tsx"
      - "src/components/courses/faculty-prototype-blueprint-row-actions.tsx"
      - "src/components/courses/faculty-content-editor.tsx"
      - "src/components/courses/faculty-assessment-editor.tsx"
      - "src/components/courses/faculty-course-workspace.tsx"
      - "tests/e2e/faculty-blueprint-prototype.spec.ts"
      - "tests/e2e/faculty-courses.spec.ts"
      - "tests/e2e/faculty-blueprint-external-content-closure.spec.ts"
      - "tests/e2e/faculty-blueprint-publication-closure.spec.ts"
      - "tests/unit/faculty-content-order-ui-model.test.ts"
      - "tests/unit/faculty-blueprint-sort-model.test.ts"
      - "tests/unit/faculty-blueprint-archive-receipt.test.ts"
      - "src/modules/courses/faculty-blueprint-archive-receipt-model.ts"
      - "src/modules/courses/faculty-blueprint-sort-model.ts"
## Focused Faculty E2E is independent of the repository-wide TS gate.
## Full TypeScript is still mandatory in the separate CI workflow.
permissions:
  contents: read
  statuses: write
concurrency:
  group: faculty-blueprint-prototype-acceptance-${{ github.sha }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      # The E2E job uses the same expressly disposable PG17 database for all test URLs.
      # DB018 guard permits this alias only with the independent DB03 verifier flag.
      DB03_ISOLATED_TEST_DATABASE: "1"
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit-test Blueprint models and write recovery
        run: npx vitest run tests/unit/faculty-content-order-ui-model.test.ts tests/unit/faculty-blueprint-sort-model.test.ts tests/unit/faculty-blueprint-archive-receipt.test.ts tests/unit/faculty-blueprint-add-target.test.ts tests/unit/faculty-blueprint-write-recovery.test.ts tests/unit/faculty-blueprint-lesson-engagement-model.test.ts tests/unit/faculty-blueprint-full-content-order.test.ts tests/unit/faculty-blueprint-empty-states-closure.test.tsx
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable E2E database
        run: npm run db:e2e:prepare
      - name: Persisted Faculty Blueprint quiz, assignment and schedule commands
        run: >-
          npx vitest run --config vitest.db.config.ts
          tests/integration/faculty-mentor-positive-courses.test.ts
          -t "authors Section quiz questions|writes a confirmed own-Section assignment draft|persists IST Faculty schedule inputs"
      - name: Generate isolated auth credentials
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Faculty Blueprint screenshot #05 desktop/mobile E2E
        run: npx playwright test tests/e2e/faculty-blueprint-prototype.spec.ts --workers=1
      # Keep repo-wide TS enforcement, but do not let unrelated account code
      # prevent the disposable-DB Faculty browser suite from running.
      - name: Confirm persisted Faculty Section resource edit and safe sibling isolation
        run: >-
          npx playwright test tests/e2e/faculty-courses.spec.ts
          --grep "Faculty Blueprint persists an authorized Section Resource edit after a full reload"
          --workers=1
      - name: Confirm real Faculty Section Resource create, edit and archive without storage
        run: >-
          npx playwright test tests/e2e/faculty-courses.spec.ts
          --grep "Faculty Blueprint creates, edits and archives an own-Section Resource without private storage"
          --workers=1
      - name: Verify Faculty YouTube and live-class non-storage lifecycle on persisted Section
        run: >-
          npx playwright test tests/e2e/faculty-blueprint-external-content-closure.spec.ts
          --workers=1
      - name: Verify Faculty publish and learner Section visibility through archive
        run: >-
          npx playwright test tests/e2e/faculty-blueprint-publication-closure.spec.ts
          --workers=1
      - name: Confirm real Section Assignment and Quiz create, edit and archive journeys
        run: >-
          npx playwright test tests/e2e/faculty-courses.spec.ts
          --grep "Faculty (Assignment|Quiz) aggregate"
          --workers=1

  record_result:
    if: ${{ always() }}
    needs: [browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const browser = "${{ needs.browser.result }}";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: browser === "success" ? "success" : "failure",
              context: "faculty-blueprint-acceptance/browser",
              description: browser === "success"
                ? "Blueprint unit + desktop/mobile + persisted resource E2E passed"
                : "Faculty Blueprint acceptance failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
