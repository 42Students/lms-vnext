# Read-only provenance audit; generated migrations never promoted or applied.
name: DB-020 disposable PostgreSQL vs generated schema diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/db020-registered-catalog-diff.yml"
      - "scripts/db020-registered-catalog-diff.mjs"
      - "scripts/db020-schema-semantics-diff.mjs"
      - "scripts/db020-default-parity.mjs"
      - "tests/db020-default-parity.test.mjs"
      - "tests/db020-schema-semantics-diff.test.mjs"
      - "scripts/db020-full-registered-catalog-export.mjs"
      - "drizzle/0323_db020_registered_column_and_index_parity.sql"
      - "drizzle/0326_db020_validate_registered_checks.sql"
      - "tests/db020-check-validation-pg.test.mjs"
      - "src/db/schema/placement-public-page-content.ts"
      - "tests/db020-registered-parity-delta-pg.test.mjs"
      - "src/db/schema/db10-log-alerts.draft.ts"
      - "src/db/schema/db10-audit-findings.draft.ts"
      - "src/db/schema/db04-profile-education-images.staged.ts"
      - "src/db/schema/attendance-parent-sms.ts"
      - "tests/db020-registered-alias-parity.test.mjs"
      - "tests/db020-sql-owned-fk-contract.test.mjs"
      - "tests/db10-log-alerts-staging.test.mjs"
      - "scripts/db020-fk-shape.mjs"
      - "scripts/db020-sql-type.mjs"
      - "tests/db020-sql-type.test.mjs"
      - "tests/db020-fk-shape.test.mjs"
      - "src/db/schema/tpo-company-team.ts"
      - "src/db/schema/academics.ts"
      - "src/db/schema/courses.ts"
      - "src/db/schema/colleges.ts"
      - "src/db/schema/placements.ts"
      - "tests/db020-placement-request-schema.test.mjs"
      - "tests/db020-college-index-schema.test.mjs"
      - "src/db/schema/db10-audit-findings.draft.ts"
      - "src/modules/people/e2e-fixture-seed-service.ts"
      - "src/db/schema/storage-files.ts"
      - "src/db/schema/placement-general-requests.ts"
      - "src/db/schema/placement-company-identities.ts"
      - "src/db/schema/placement-public-page.ts"
      - "src/db/schema/placement-drive-change-requests.ts"
      - "src/db/schema/tpo-collaboration.ts"
      - "src/db/schema/projects.ts"
      - "src/db/schema/profiles.ts"
      - "src/db/schema/project-audit-staged.ts"
      - "drizzle/meta/0318_snapshot.json"
      - "drizzle/0317_db014_placement_fk_validation.sql"
      - "drizzle/0318_db014_cross_domain_event_guards.sql"
      - "drizzle/0319_db020_grade_event_source_action.sql"
      - "drizzle/meta/0319_snapshot.json"
      - "drizzle/0320_db045_grade_event_guards.sql"
      - "drizzle/meta/0320_snapshot.json"
      - "tests/db045-registered-grade-history-pg.test.mjs"
      - "tests/db020-registered-grade-event-provenance-pg.test.mjs"
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB020_DISPOSABLE_PG: "1"
      DB03_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare FK signatures in static adversarial fixtures
        run: node --test tests/db020-fk-shape.test.mjs tests/db020-sql-type.test.mjs tests/db020-college-index-schema.test.mjs tests/db020-placement-request-schema.test.mjs tests/db020-schema-semantics-diff.test.mjs tests/db020-default-parity.test.mjs
      - name: Pinned journal and clean registration
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm run db:journal:verify
      - name: Disposable PG17 replay and seed
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Idempotent registered replay
        run: npm run db:migrate
      - name: Validate all registered PostgreSQL CHECK constraints on PG17
        run: node --test tests/db020-check-validation-pg.test.mjs
      - name: DB020 exact registered constraint, default and index parity
        run: node --test tests/db020-registered-parity-delta-pg.test.mjs
      - name: Require canonical Drizzle generation to be a clean no-op
        run: |
          npm run db:generate > .db020-generation.log 2>&1
          cat .db020-generation.log
          if grep -E "data is malformed|TypeError:|Error:" .db020-generation.log; then
            echo "Drizzle generation failed; refuse certification" >&2
            exit 1
          fi
          grep -q "No schema changes, nothing to migrate" .db020-generation.log
          test -z "$(git status --porcelain -- drizzle/)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Preserve exact canonical registered typed snapshot for PG17 audit
        run: |
          mkdir -p .verification
          index="$(node -p 'require("./drizzle/meta/_journal.json").entries.at(-1).idx.toString().padStart(4,"0")')"
          test -f "drizzle/meta/${index}_snapshot.json"
          cp "drizzle/meta/${index}_snapshot.json" .verification/db020-current-typed-snapshot.json
      - name: Compare the generated typed schema against registered PostgreSQL
        run: node scripts/db020-registered-catalog-diff.mjs
      - name: Export full registered SQL constraint and index definitions (read-only)
        run: node scripts/db020-full-registered-catalog-export.mjs
      - name: Diagnose CHECK, index and nullable schema semantics without DDL
        run: node scripts/db020-schema-semantics-diff.mjs
      - name: Prove registered typed defaults on physical PG17
        run: node scripts/db020-default-parity.mjs
      - name: Guard SQL-owned catalog FK edges on actual PG17
        run: node --test tests/db020-sql-owned-fk-contract.test.mjs
      - name: Confirm 15 constraint and index aliases on actual PG17
        run: node --test tests/db020-registered-alias-parity.test.mjs
      - name: Keep output as diagnostic only; never promote generated DDL
        run: |
          test -f .verification/db020-catalog-disposition.json
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node -e 'const j=require("./.verification/db020-catalog-disposition.json"); if(j.passCertification!==false)process.exit(1)'
      - name: Store exact-source diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db020-registered-catalog-diagnosis
          path: |
            .verification/db020-catalog-disposition.json
            .verification/db020-registered-catalog-full.json
            .verification/db020-semantic-disposition.json
            .verification/db020-default-parity.json
            .verification/db020-current-typed-snapshot.json
          retention-days: 7
          if-no-files-found: warn
