name: UX-G184 authenticated route states responsive acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/components/ux/ux-g184-authenticated-states-preview.tsx'
      - 'src/app/e2e/ux-g184-authenticated-states/**'
      - 'tests/e2e/ux-g184-authenticated-route-states.spec.ts'
      - '.github/workflows/ux-g184-authenticated-route-states-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: ux-g184-authenticated-states-${{ github.ref }}
  cancel-in-progress: true
jobs:
  route-states:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=6144'
      UX_G184_ROUTE_STATE_FIXTURE: '1'
      PLATFORM_HOSTS: 'localhost,127.0.0.1'
      PLAYWRIGHT_JSON_OUTPUT_NAME: ux-g184-results.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Scoped source lint and full TypeScript
        run: |
          npx eslint \
            src/components/ux/ux-g184-authenticated-states-preview.tsx \
            src/app/e2e/ux-g184-authenticated-states/page.tsx \
            tests/e2e/ux-g184-authenticated-route-states.spec.ts
          npm run typecheck
      - name: Shared error and group regression
        run: |
          npx vitest run tests/unit/ux-root-global-errors.test.ts tests/unit/ux-five-group-batch-20261107.test.ts --reporter=dot
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Thirteen actual role states at desktop and mobile
        run: |
          npx playwright test tests/e2e/ux-g184-authenticated-route-states.spec.ts --project=chromium --reporter=line,json
          node -e 'const s=require("./ux-g184-results.json").stats;console.log("G184:",s);if(s.expected!==27||s.unexpected!==0||s.flaky!==0||s.skipped!==0)process.exit(1)'
      - name: Preserve role-state screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g184-authenticated-states-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            ux-g184-results.json
          if-no-files-found: ignore
          retention-days: 14
