# Diagnostic only: four independently seeded PG17 shards accelerate failure localization.
# Not a substitute for the exact 12/12 DB-001 standalone verifier receipt.
name: DB-001 full integration matrix shard diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/db001-integration-shard-diagnostic.yml"
      - "tests/integration/db001-canonical-baseline-pg.test.ts"
      - "tests/support/learner-positive-fixture.ts"
      - "tests/integration/college-notice-inbox.test.ts"
      - "tests/integration/db10-outbound-queue.test.ts"
      - "tests/integration/tpo-self-profile-service.test.ts"
      - "tests/integration/tracker-report-sa-placements-projects-100.test.ts"
      - "tests/integration/college-department-insights-denial.test.ts"
      - "scripts/db-independent-verify.mjs"
      - "vitest.db.config.ts"
permissions:
  contents: read
jobs:
  pg17-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DATABASE_URL: ""
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB06_ISOLATED_TEST_DATABASE: "1"
      DB018_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pin exact SHA and source journal
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          npm run db:journal:verify
      - name: Prepare private disposable PG17 database from registered migrations
        run: npm run db:test:prepare
      - name: Run all integration tests in four non-overlapping isolated shards
        env:
          # Only after the registered replay above. Each job has its own
          # independently disposed PG17 service, never an application DB.
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DB08_ISOLATED_TEST_DATABASE: "1"
          DB08_MIGRATION_APPLIED: "1"
          DB08_B_MIGRATION_APPLIED: "1"
          DB08_C_MIGRATION_APPLIED: "1"
          W04_ISOLATED_TEST_DATABASE: "1"
          DB10_ISOLATED_TEST_DATABASE: "1"
          DB10_DISPOSABLE_TEST_DATABASE: "true"
          # Same disposable-only synthetic worker-readiness fixture as DB001.
          # This is not a claim of production recipient delivery.
          TPO_NOTICE_DELIVERY_VERIFIED: "VERIFIED"
          TPO_NOTICE_SCHEDULER_SECRET: "db001-disposable-pg17-tests-not-a-deployed-worker"
        run: npx vitest run --config vitest.db.config.ts --shard="${{ matrix.shard }}/4"
      - name: Require original pinned source revision
        if: always()
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
