name: SECURITY - Purge exposed ZeptoMail credential from Git history

'on':
  workflow_dispatch:
    inputs:
      confirm_all_writers_paused:
        description: "All repository writers, automated jobs and local worktrees are paused"
        required: true
        type: choice
        options: ["NO", "YES"]
        default: "NO"
      confirm_zeptomail_key_revoked:
        description: "Compromised ZeptoMail API key has been revoked and replaced"
        required: true
        type: choice
        options: ["NO", "YES"]
        default: "NO"

permissions:
  contents: write

concurrency:
  group: security-zeptomail-one-time-history-rewrite
  cancel-in-progress: false

jobs:
  purge-history:
    if: ${{ inputs.confirm_all_writers_paused == 'YES' && inputs.confirm_zeptomail_key_revoked == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout cleanup utility
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install supported history scrubber
        run: python3 -m pip install --disable-pip-version-check 'git-filter-repo>=2.47'
      - name: Perform guarded all-ref history rewrite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIRM_HISTORY_PURGE: I_UNDERSTAND_ALL_BRANCH_SHAS_CHANGE
          CONFIRM_ZEPTOMAIL_ROTATED: 'YES'
          GIT_TERMINAL_PROMPT: '0'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/zeptomail-askpass.sh" <<'EOF'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf 'x-access-token' ;;
            *Password*) printf '%s' "$GITHUB_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/zeptomail-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/zeptomail-askpass.sh"
          bash scripts/security/zeptomail-history-purge.sh
      - name: Document remaining GitHub-hosted cleanup
        if: success()
        run: |
          echo 'Heads and tags rewritten and verified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'NEXT: GitHub Support must remove hidden PR refs, cached pages and unreachable objects.' >> "$GITHUB_STEP_SUMMARY"
          echo 'NEXT: All developers must re-clone or rebase; never merge old history.' >> "$GITHUB_STEP_SUMMARY"
