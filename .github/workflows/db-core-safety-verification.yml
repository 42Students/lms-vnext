# safety verification refresh: 2026-10-12T14:35Z
name: DB Core Safety Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/db-core-safety-verification.yml"
      - "tests/db09-collaboration-registered-pg-acceptance.mjs"
      - "tests/db09-share-registered-pg-acceptance.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact triggering commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "DB_SAFETY_VERIFY_SHA=$actual" >> "$GITHUB_ENV"
          echo "Verifying exact event commit $actual"
      - name: Execute fail-before-network safety suite
        run: node --test tests/db01-test-database-guard.test.mjs
      - name: Explicit disposable test reset and seed
        run: env -u DATABASE_URL npm run db:test:prepare
      - name: Explicit disposable local reset through shared helper
        run: npm run db:reset
      - name: Explicit disposable local seed through shared helper
        run: npm run db:seed
      - name: Journal remains valid after safety workflows
        run: npm run db:journal:verify
      # L01 accepted L08's two real, rollback-only DB09 handoffs.
      # The explicit isolation flags permit the controlled alias only on this
      # already disposable PostgreSQL 17 service; no production DB is contacted.
      - name: DB09 college-wide CRM principal and read-scope PostgreSQL negatives
        env:
          DB03_ISOLATED_TEST_DATABASE: "1"
          DB09_ISOLATED_TEST_DATABASE: "1"
        run: node tests/db09-collaboration-registered-pg-acceptance.mjs
      - name: DB09 secure-share lifecycle PostgreSQL negatives
        env:
          DB03_ISOLATED_TEST_DATABASE: "1"
          DB09_ISOLATED_TEST_DATABASE: "1"
        run: node tests/db09-share-registered-pg-acceptance.mjs
