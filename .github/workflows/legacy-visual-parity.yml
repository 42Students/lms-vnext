name: Legacy visual parity tooling

on:
  pull_request:
    paths:
      - ".github/workflows/legacy-visual-parity.yml"
      - "scripts/audit/visual-baseline-inventory.mjs"
      - "scripts/audit/legacy-pixel-compare.mjs"
      - "scripts/audit/capture-legacy-parity.mjs"
      - "tests/visual-baseline-inventory.test.mjs"
      - "tests/legacy-pixel-compare.test.mjs"
      - "tests/capture-legacy-parity-options.test.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/legacy-visual-parity.yml"
      - "scripts/audit/visual-baseline-inventory.mjs"
      - "scripts/audit/legacy-pixel-compare.mjs"
      - "scripts/audit/capture-legacy-parity.mjs"
      - "tests/visual-baseline-inventory.test.mjs"
      - "tests/legacy-pixel-compare.test.mjs"
      - "tests/capture-legacy-parity-options.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-reference-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify Node source syntax
        run: |
          node --check scripts/audit/visual-baseline-inventory.mjs
          node --check scripts/audit/legacy-pixel-compare.mjs
          node --check scripts/audit/capture-legacy-parity.mjs
      - name: Execute screenshot inventory and native pixel comparator unit tests
        run: npm run test:parity:visual
      - name: Confirm runbook exists
        run: test -f docs/audit/visual-parity-execution-runbook.md

  full-reference-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v7
      - name: Checkout independent legacy reference branch without merging histories
        uses: actions/checkout@v7
        with:
          ref: parity-baseline
          path: .reference
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit every packaged screenshot and capture coverage entry
        run: |
          node scripts/audit/visual-baseline-inventory.mjs \
            --root .reference \
            --json "$RUNNER_TEMP/legacy-visual-inventory.json"
      - name: Preserve structural audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-visual-reference-inventory
          path: ${{ runner.temp }}/legacy-visual-inventory.json
          if-no-files-found: ignore
      - name: Measure captured learner and admin visual baselines (expected differences)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/visual-gap-artifacts/learner-001" "$RUNNER_TEMP/visual-gap-artifacts/admin-001"
          code=0
          node scripts/audit/legacy-pixel-compare.mjs \
            --old .reference/old/learner/_learn_allAssignments__base__67d5d6264c.png \
            --new .reference/vnext/learner/_learn_allAssignments__base__7a987c859d.png \
            --out "$RUNNER_TEMP/visual-gap-artifacts/learner-001" || code=$?
          test "$code" -eq 1 || { echo "Expected visual mismatch learner-001 (exit 1); got $code"; exit 1; }
          code=0
          node scripts/audit/legacy-pixel-compare.mjs \
            --old .reference/old/admin/_college-admin_assignments__base__3795a67127.png \
            --new .reference/vnext/admin/_college_assignments__base__784426cf14.png \
            --out "$RUNNER_TEMP/visual-gap-artifacts/admin-001" || code=$?
          test "$code" -eq 1 || { echo "Expected visual mismatch admin-001 (exit 1); got $code"; exit 1; }
      - name: Preserve actual legacy-vNext comparison overlays and heatmaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-vnext-initial-gap-evidence
          path: ${{ runner.temp }}/visual-gap-artifacts
          if-no-files-found: ignore
