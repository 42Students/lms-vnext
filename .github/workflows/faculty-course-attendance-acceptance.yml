name: Faculty Course Attendance acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/faculty-course-attendance-acceptance.yml"
      - "tests/integration/faculty-c4-reports-audit-contact.test.ts"
      - "tests/e2e/faculty-course-attendance.spec.ts"
      - "tests/e2e/faculty-attendance-prototype.spec.ts"
      - "tests/unit/faculty-prototype-session-selection.test.ts"
      - "src/modules/attendance/faculty-prototype-session-selection.ts"
      - "src/components/attendance/faculty-prototype-attendance.tsx"
      - "src/modules/attendance/faculty-service.ts"
      - "src/components/attendance/faculty-attendance-workspace.tsx"
      - "src/app/(authenticated)/teacher/courses/*/attendanceDetail/**"
permissions:
  contents: read
concurrency:
  group: faculty-attendance-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB06_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migration journal
        run: npm run db:journal:verify
      - name: Reset and seed disposable PostgreSQL
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Registered Faculty attendance marking, correction, CAS and actor scope
        run: npx vitest run --config vitest.db.config.ts tests/integration/faculty-c4-reports-audit-contact.test.ts
      - name: Pure attendance model regressions
        run: >-
          npx vitest run
          tests/unit/faculty-attendance-edit-state.test.ts
          tests/unit/faculty-attendance-grid-model.test.ts
          tests/unit/faculty-learner-attendance-detail.test.ts
          tests/unit/faculty-prototype-session-selection.test.ts
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare isolated E2E PostgreSQL
        run: npm run db:e2e:prepare
      - name: Ephemeral authentication secrets
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Authenticated Faculty marking, correction and month report on desktop/mobile
        run: npx playwright test tests/e2e/faculty-course-attendance.spec.ts tests/e2e/faculty-attendance-prototype.spec.ts --workers=1
