name: Mentor code acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mentor-acceptance.yml"
      - "docs/design-system/UX-GUARD-WAIVERS.json"
      - "src/modules/projects/**"
      - "src/db/schema/projects.ts"
      - "drizzle/**"
      - "src/modules/activity/**"
      - "src/components/projects/**"
      - "src/app/(authenticated)/mentor/**"
      - "src/app/api/mentor/**"
      - "src/app/api/projects/**"
      - "tests/unit/mentor*.test.ts"
      - "scripts/db-e2e-prepare.ts"
      - "tests/unit/PROJ-BREAK-chat6-*.test.ts"
      - "tests/unit/PROJ-BREAK-chat9-member-candidate-privacy.test.ts"
      - "tests/integration/mentor*.test.ts"
      - "tests/integration/projects-p7b-meetings.test.ts"
      - "tests/integration/projects-p4-members.test.ts"
      - "tests/integration/learner-project-activity-filters.test.ts"
      - "tests/e2e/mentor-prototype-functional-matrix.spec.ts"
      - "tests/e2e/mentor-portfolio-state-acceptance.spec.ts"
      - "tests/e2e/w03-mentor-surfaces.spec.ts"
      - "tests/e2e/projects.spec.ts"

permissions:
  contents: read

# Dedicated product acceptance: global CI can fail independently for TPO,
# recruiter and admin. A green Mentor run does NOT certify external Google
# consent, provider email delivery, or deferred pixel-level visual acceptance.
concurrency:
  group: lms-vnext-mentor-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mentor-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Strict application typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Full Mentor unit, provider and adversarial source matrix
        run: |
          npx vitest run tests/unit/mentor- \
            tests/unit/PROJ-BREAK-chat9-member-candidate-privacy.test.ts \
            tests/unit/PROJ-BREAK-chat6-backlog-readiness-cross-scope.test.ts \
            tests/unit/PROJ-BREAK-chat6-delivery-grade-notices.test.ts
      - name: Repository lint and UX guard
        run: npm run lint

  mentor-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB06_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build clean disposable PostgreSQL 17 fixture
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Complete registered Mentor PostgreSQL tenant, lifecycle and mutation regression
        run: |
          npx vitest run --config vitest.db.registered.config.ts \
            tests/integration/mentor- \
            tests/integration/learner-project-activity-filters.test.ts \
            tests/integration/projects-p7b-meetings.test.ts \
            tests/integration/projects-p4-members.test.ts

  mentor-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
      MENTOR_E2E_SEED_PROJECT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare disposable Mentor browser fixture
        run: npm run db:e2e:prepare
      - name: Generate isolated browser session keys
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Run authenticated Mentor route and role matrix
        run: npx playwright test tests/e2e/mentor-prototype-functional-matrix.spec.ts tests/e2e/w03-mentor-surfaces.spec.ts tests/e2e/projects.spec.ts tests/e2e/mentor-portfolio-state-acceptance.spec.ts
