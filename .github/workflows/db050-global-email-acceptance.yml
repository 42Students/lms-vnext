name: DB-050 registered global email suppression acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/integration/db10-global-email-suppression-service.test.ts"
      - "tests/db10-global-email-suppression-contract.test.mjs"
      - ".github/workflows/db050-global-email-acceptance.yml"
      - "src/modules/operations/global-email-suppression-service.ts"
      - "src/modules/operations/outbound-delivery-envelope.ts"

permissions:
  contents: read

concurrency:
  group: db050-global-email-${{ github.ref }}
  cancel-in-progress: false

jobs:
  db050-registered-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Registered migration journal and HMAC contract regression
        run: |
          npm run db:journal:verify
          node --test tests/db10-global-email-suppression-contract.test.mjs
      - name: Reset, replay and seed clean disposable PostgreSQL 17
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Idempotent registered migration replay
        run: npm run db:migrate
      - name: Persist verified global email opt-out across two colleges and duplicate event
        env:
          DATABASE_URL: ""
          DB10_ISOLATED_TEST_DATABASE: "1"
        run: >-
          npx vitest run --config vitest.db.registered.config.ts
          tests/integration/db10-global-email-suppression-service.test.ts
