name: Generate academics schema artifact

on:
  push:
    branches:
      - academics-schema-gen

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Drizzle migration
        run: npm run db:generate

      - name: Upload generated drizzle directory
        uses: actions/upload-artifact@v4
        with:
          name: academics-drizzle-generated
          path: drizzle/
          if-no-files-found: error
          retention-days: 1
