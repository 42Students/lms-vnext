name: UX-G132 faculty scheduling confirmation acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/components/attendance/faculty-attendance-schedule-editor.tsx'
      - 'src/app/e2e/ux-g132-faculty-schedule/**'
      - 'tests/e2e/ux-g132-faculty-schedule.spec.ts'
      - 'tests/unit/ux-five-group-batch-20261107.test.ts'
      - '.github/workflows/ux-g132-faculty-schedule-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: ux-g132-faculty-schedule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  faculty-schedule-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ENV: development
      NODE_OPTIONS: '--max-old-space-size=6144'
      UX_G132_SCHEDULE_FIXTURE: '1'
      PLATFORM_HOSTS: 'localhost,127.0.0.1'
      PLAYWRIGHT_JSON_OUTPUT_NAME: 'ux-g132-faculty-results.json'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact-SHA and scoped source checks
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx eslint src/components/attendance/faculty-attendance-schedule-editor.tsx src/app/e2e/ux-g132-faculty-schedule/page.tsx tests/e2e/ux-g132-faculty-schedule.spec.ts tests/unit/ux-five-group-batch-20261107.test.ts
          npm run typecheck
      - name: Five-group safety contracts
        run: npx vitest run tests/unit/ux-five-group-batch-20261107.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive actual faculty editor confirmation and cancellation
        run: |
          npx playwright test tests/e2e/ux-g132-faculty-schedule.spec.ts --project=chromium --reporter=line,json
          node -e 'const s=require("./ux-g132-faculty-results.json").stats;console.log("G132 schedule:",s);if(s.expected!==3||s.unexpected!==0||s.flaky!==0||s.skipped!==0)process.exit(1)'
      - name: Preserve screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g132-faculty-schedule-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            ux-g132-faculty-results.json
          if-no-files-found: ignore
          retention-days: 14
