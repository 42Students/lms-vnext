# Distinct from the screenshot #03 Courses directory witness. This retained
# regression exercises legacy navigation, moderation, report and resource flows;
# failures remain visible and must not be silenced to make a prototype green.
name: Faculty cross-course deep-regression acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/faculty-course-legacy-regression.yml"
      - "tests/e2e/faculty-courses.spec.ts"
      - "tests/unit/faculty-course-month-attendance-model.test.ts"
      - "src/modules/courses/faculty-course-month-attendance-model.ts"
      - "src/app/(authenticated)/teacher/courses/page.tsx"
      - "src/components/courses/faculty-prototype-course-directory.tsx"
## Dedicated Faculty browser verification; repository-wide TypeScript
## remains a separate mandatory gate in CI.
permissions:
  contents: read
concurrency:
  group: faculty-cross-course-deep-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit-test absence-only monthly attendance
        run: npx vitest run tests/unit/faculty-course-month-attendance-model.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable browser database
        run: npm run db:e2e:prepare
      - name: Ephemeral E2E secrets
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Faculty legacy cross-course flows and advanced capability regression
        run: npx playwright test tests/e2e/faculty-courses.spec.ts --workers=1
