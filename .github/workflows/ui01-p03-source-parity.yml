name: UI-01 P03 — Source Parity (auth, admin shell, tenant setup)

on:
  push:
    paths:
      - "src/app/login/**"
      - "src/app/superadmin-login/**"
      - "src/app/auth/**"
      - "src/app/(authenticated)/admin/colleges/**"
      - "src/app/(authenticated)/admin/features/**"
      - "src/app/(authenticated)/admin/**"
      - "src/app/forbidden/**"
      - "src/app/maintenance/**"
      - "src/app/not-found.tsx"
      - "docs/planning/ui-inventory-ui01.json"
      - "docs/planning/ui-strings-ui01.json"
      - "tests/ui01-source-parity.test.mjs"
  pull_request:
    paths:
      - "src/app/login/**"
      - "src/app/superadmin-login/**"
      - "src/app/(authenticated)/admin/**"
      - "tests/ui01-source-parity.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui01-p03-source-parity:
    name: UI-01 P03 source parity (no browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run UI-01 source parity test
        run: node --test tests/ui01-source-parity.test.mjs

      - name: Verify inventory and catalogue files exist
        run: |
          test -f docs/planning/ui-inventory-ui01.json && echo "inventory OK" || (echo "MISSING: ui-inventory-ui01.json" && exit 1)
          test -f docs/planning/ui-strings-ui01.json && echo "strings OK" || (echo "MISSING: ui-strings-ui01.json" && exit 1)

      - name: Print surface count
        run: |
          node -e "
            const inv = JSON.parse(require('fs').readFileSync('docs/planning/ui-inventory-ui01.json','utf8'));
            const cat = JSON.parse(require('fs').readFileSync('docs/planning/ui-strings-ui01.json','utf8'));
            console.log('Surfaces:', inv.surfaces.length, '(total declared:', inv.totalSurfaces + ')');
            console.log('Missing:', inv.surfaces.filter(s => s.disposition === 'MISSING').length);
            console.log('Strings:', Object.keys(cat.strings).length, '(declared:', cat.totalStrings + ')');
          "
