name: UX-G063 learner placements journey acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/(authenticated)/learn/my-placements/calendar/**'
      - 'src/app/(authenticated)/learn/my-placements/interviews/**'
      - 'src/app/(authenticated)/learn/my-placements/jobs/**'
      - 'src/app/(authenticated)/learn/my-placements/notification-preferences/**'
      - 'src/app/(authenticated)/learn/my-placements/offers/**'
      - 'src/app/e2e/ux-g063-learner-placements/**'
      - 'tests/unit/ux-g063-learner-placements-journey.test.tsx'
      - 'tests/e2e/ux-g063-learner-placements.spec.ts'
      - '.github/workflows/ux-g063-learner-placements-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: ux-g063-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Lint scoped route and acceptance
        run: |
          npx eslint 'src/app/(authenticated)/learn/my-placements/jobs/page.tsx' 'src/app/(authenticated)/learn/my-placements/jobs/[jobId]/error.tsx' 'src/app/(authenticated)/learn/my-placements/notification-preferences/error.tsx' src/app/e2e/ux-g063-learner-placements tests/unit/ux-g063-learner-placements-journey.test.tsx tests/e2e/ux-g063-learner-placements.spec.ts
      - name: Learner placement recovery unit tests
        run: npx vitest run tests/unit/ux-g063-learner-placements-journey.test.tsx --reporter=dot
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile learner placement browser acceptance
        run: npx playwright test tests/e2e/ux-g063-learner-placements.spec.ts --project=chromium --reporter=line
      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Retain viewport evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g063-learner-placement-viewports
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
