name: UX-G139 course learning controls acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/components/courses/quiz-attempt-control.tsx
      - src/components/courses/resource-progress-control.tsx
      - src/components/courses/super-admin-content-directory-page.tsx
      - src/components/courses/super-admin-lesson-create.tsx
      - tests/unit/ux-g139-course-controls.test.ts
      - tests/e2e/ux-g139-course-controls.spec.ts
      - .github/workflows/ux-g139-course-controls-acceptance.yml

concurrency:
  group: ux-g139-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-course-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused UI lint
        run: |
          npx eslint src/components/courses/quiz-attempt-control.tsx src/components/courses/resource-progress-control.tsx src/components/courses/super-admin-content-directory-page.tsx src/components/courses/super-admin-lesson-create.tsx tests/unit/ux-g139-course-controls.test.ts tests/e2e/ux-g139-course-controls.spec.ts
      - name: Full TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Quiz progress, authoring and existing coursework regressions
        run: |
          npx vitest run tests/unit/ux-g139-course-controls.test.ts tests/unit/learner-course-page-parity.test.ts tests/unit/chat6-superadmin-middle-lessons-role-25.test.tsx
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable seeded database
        run: npm run db:e2e:prepare
      - name: Ephemeral browser credentials
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Browser 390/1280 and learner-denial acceptance
        run: npx playwright test tests/e2e/ux-g139-course-controls.spec.ts --project=chromium --reporter=line
      - name: Save UX screenshots and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g139-course-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
