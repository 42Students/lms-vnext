name: UX public recovery groups acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/app/maintenance/**
      - src/app/forbidden/**
      - src/app/request-demo/**
      - src/components/public/graceful-screen.tsx
      - src/components/marketing/demo-contact-actions.tsx
      - tests/e2e/ux-public-recovery-groups.spec.ts
      - .github/workflows/ux-public-recovery-acceptance.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check scoped source and browser test lint
        run: npx eslint src/app/maintenance/page.tsx src/app/maintenance/maintenance-recovery.tsx src/app/forbidden/page.tsx src/components/public/graceful-screen.tsx src/app/request-demo/page.tsx src/components/marketing/demo-contact-actions.tsx tests/e2e/ux-public-recovery-groups.spec.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile public UX browser acceptance
        run: npx playwright test tests/e2e/ux-public-recovery-groups.spec.ts --project=chromium --reporter=line
      - name: Typecheck all dependent TSX paths
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
