# Focused runtime and source regression for sensitive private CSV exports.
# Not a replacement for full API/tenant/RLS coverage or production step-up UX verification.
name: Security - private bulk export authorization and CSV encoding

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/api/admin/companies/export/**"
      - "src/app/api/admin/placements/hiring-report/export/**"
      - "src/app/api/college/companies/export/**"
      - "src/app/api/admin/course-progress/students/export/**"
      - "src/app/api/placements/tpo/audit/export/**"
      - "src/app/api/admin/people/export/**"
      - "src/app/api/admin/tenants/export/**"
      - "src/app/api/college/people/export/**"
      - "src/app/api/college/roles/export/**"
      - "src/app/api/admin/students/export/**"
      - "src/app/api/admin/faculty/export/**"
      - "src/app/api/admin/placements/applications/export/**"
      - "src/app/api/admin/placements/shortlisted/export/**"
      - "src/modules/people/college-people-export-model.ts"
      - "src/modules/people/admin-users-export-model.ts"
      - "src/modules/admin-ui/super-admin-scoped-csv-service.ts"
      - "src/security/csv-cell.ts"
      - "src/modules/placements/tpo-audit-csv-model.ts"
      - "src/modules/placements/tpo-registration-event-history-csv-model.ts"
      - "src/modules/verification/queue-export.ts"
      - "src/modules/projects/mentor-board-review-model.ts"
      - "src/modules/people/college-role-directory-export.ts"
      - "src/modules/colleges/admin-tenant-export-model.ts"
      - "src/modules/placements/admin-company-directory-export-model.ts"
      - "src/modules/placements/college-directory-csv.ts"
      - "src/modules/admin-ui/super-admin-scoped-csv-model.ts"
      - "tests/unit/chat4-superadmin-tenant-export-handler.test.ts"
      - "tests/unit/chat4-superadmin-tenant-route-guards.test.ts"
      - "tests/unit/chat4-superadmin-tenants-readiness-route-gates.test.ts"
      - "tests/unit/chat7-superadmin-student-progress-export-boundary.test.ts"
      - "tests/unit/chat13-super-admin-hiring-export-route.test.ts"
      - "tests/unit/security-shared-csv-cell.test.ts"
      - "tests/unit/security-college-company-export-cap.test.ts"
      - "src/auth/recent-device-auth.ts"
      - "tests/unit/private-bulk-csv-security.test.ts"
      - "tests/unit/chat13-super-admin-scoped-csv-runtime.test.ts"
      - "tests/unit/chat13-scoped-csv-export-page-size.test.ts"
      - ".github/workflows/security-private-exports.yml"
  push:
    branches: [main]
    paths:
      - "src/app/api/admin/companies/export/**"
      - "src/app/api/admin/placements/hiring-report/export/**"
      - "src/app/api/college/companies/export/**"
      - "src/app/api/admin/course-progress/students/export/**"
      - "src/app/api/placements/tpo/audit/export/**"
      - "src/app/api/admin/people/export/**"
      - "src/app/api/admin/tenants/export/**"
      - "src/app/api/college/people/export/**"
      - "src/app/api/college/roles/export/**"
      - "src/app/api/admin/students/export/**"
      - "src/app/api/admin/faculty/export/**"
      - "src/app/api/admin/placements/applications/export/**"
      - "src/app/api/admin/placements/shortlisted/export/**"
      - "src/modules/people/college-people-export-model.ts"
      - "src/modules/people/admin-users-export-model.ts"
      - "src/modules/admin-ui/super-admin-scoped-csv-service.ts"
      - "src/security/csv-cell.ts"
      - "src/modules/placements/tpo-audit-csv-model.ts"
      - "src/modules/placements/tpo-registration-event-history-csv-model.ts"
      - "src/modules/verification/queue-export.ts"
      - "src/modules/projects/mentor-board-review-model.ts"
      - "src/modules/people/college-role-directory-export.ts"
      - "src/modules/colleges/admin-tenant-export-model.ts"
      - "src/modules/placements/admin-company-directory-export-model.ts"
      - "src/modules/placements/college-directory-csv.ts"
      - "src/modules/admin-ui/super-admin-scoped-csv-model.ts"
      - "tests/unit/chat4-superadmin-tenant-export-handler.test.ts"
      - "tests/unit/chat4-superadmin-tenant-route-guards.test.ts"
      - "tests/unit/chat4-superadmin-tenants-readiness-route-gates.test.ts"
      - "tests/unit/chat7-superadmin-student-progress-export-boundary.test.ts"
      - "tests/unit/chat13-super-admin-hiring-export-route.test.ts"
      - "tests/unit/security-shared-csv-cell.test.ts"
      - "tests/unit/security-college-company-export-cap.test.ts"
      - "src/auth/recent-device-auth.ts"
      - "tests/unit/private-bulk-csv-security.test.ts"
      - "tests/unit/chat13-super-admin-scoped-csv-runtime.test.ts"
      - "tests/unit/chat13-scoped-csv-export-page-size.test.ts"
      - ".github/workflows/security-private-exports.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-private-exports-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  private-export-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unicode injection and fresh sign-in contracts
        run: npx vitest run tests/unit/private-bulk-csv-security.test.ts
      - name: Bulk CSV runtime stale-session and paging regressions
        run: npx vitest run tests/unit/chat13-super-admin-scoped-csv-runtime.test.ts tests/unit/chat13-scoped-csv-export-page-size.test.ts
      - name: Cross-module CSV encoding integration regressions
        run: npx vitest run tests/unit/security-shared-csv-cell.test.ts tests/unit/PROJ-BREAK-chat6-export-integrity.test.ts
      - name: Existing admin export route positive and negative contracts
        run: npx vitest run tests/unit/chat4-superadmin-tenant-export-handler.test.ts tests/unit/chat4-superadmin-tenant-route-guards.test.ts tests/unit/chat4-superadmin-tenants-readiness-route-gates.test.ts tests/unit/chat7-superadmin-student-progress-export-boundary.test.ts tests/unit/chat13-super-admin-hiring-export-route.test.ts
      - name: Bounded college company exports and stale-session denial
        run: npx vitest run tests/unit/security-college-company-export-cap.test.ts
      - name: TypeScript contract verification
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck

  tenant-export-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Seed and mutate disposable fixtures only; never connect to production.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check exact source and immutable migration journal
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm run db:journal:verify
      - name: Prepare disposable PostgreSQL 17 with current registered migrations
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: College people export authorization and foreign college exclusion
        run: npx vitest run --config vitest.db.config.ts tests/integration/college-people-export.test.ts
      - name: Super Admin tenant export scoped lifecycle and role denial
        run: npx vitest run --config vitest.db.config.ts tests/integration/super-admin-tenant-directory-export.test.ts
      - name: Verify no registered migrations were modified by the tests
        if: always()
        run: |
          npm run db:journal:verify
          test -z "$(git status --porcelain -- drizzle/)"
