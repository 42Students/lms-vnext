name: UX-G123 Universities journey acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/universities/**'
      - 'tests/ux-universities-group.test.mjs'
      - 'tests/e2e/ux-universities-journey.spec.ts'
      - '.github/workflows/ux-universities-acceptance.yml'

permissions:
  contents: read

jobs:
  public-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scoped lint and source contract tests
        run: |
          npx eslint src/app/universities/page.tsx src/app/universities/error.tsx src/app/universities/loading.tsx tests/e2e/ux-universities-journey.spec.ts
          node --test tests/ux-universities-group.test.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser acceptance
        run: npx playwright test tests/e2e/ux-universities-journey.spec.ts --project=chromium --reporter=line
      - name: Typecheck and UX guard
        run: |
          npm run typecheck
          npm run ux:guard
      - name: Preserve viewport screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g123-universities-${{ github.sha }}
          path: |
            ux-g123-evidence/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
