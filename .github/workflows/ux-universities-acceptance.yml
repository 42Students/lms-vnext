name: UX-G123 Universities journey acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/universities/**'
      - 'tests/ux-universities-group.test.mjs'
      - 'tests/e2e/ux-universities-journey.spec.ts'
      - '.github/workflows/ux-universities-acceptance.yml'

permissions:
  contents: read

jobs:
  public-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scoped lint and source contract tests
        run: |
          npx eslint src/app/universities/page.tsx src/app/universities/error.tsx src/app/universities/loading.tsx tests/e2e/ux-universities-journey.spec.ts
          node --test tests/ux-universities-group.test.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser acceptance
        run: npx playwright test tests/e2e/ux-universities-journey.spec.ts --project=chromium --reporter=line
      - name: Preserve viewport screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-g123-universities-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
