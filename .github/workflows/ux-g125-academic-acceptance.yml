name: UX-G125 academic component acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/components/academics/**'
      - 'tests/unit/ux-g125-academic-actions.test.ts'
      - 'tests/e2e/ux-g125-academic-actions.spec.ts'
      - '.github/workflows/ux-g125-academic-acceptance.yml'

permissions:
  contents: read

# Parallel chats push frequently: never cancel this exact-SHA verification
# when an unrelated main commit arrives.
concurrency:
  group: ux-g125-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: 'true'
      APP_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact source SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "$GITHUB_SHA" > ux-g125-source-sha.txt
      - name: Verify UX tracker, source lint and TypeScript
        run: |
          npm run ux:groups -- --check
          npx eslint \
            src/components/academics/academics-actions.tsx \
            src/components/academics/academics-create-panel.tsx \
            src/components/academics/college-academic-directory.tsx \
            src/components/academics/college-cohort-management.tsx \
            src/components/academics/college-hall-booking-action.tsx \
            src/components/academics/college-promotion-confirmation.tsx \
            src/components/academics/college-recurring-preview.tsx \
            src/components/academics/college-section-management.tsx \
            src/components/academics/college-semester-management.tsx \
            src/components/academics/section-operations.tsx \
            tests/unit/ux-g125-academic-actions.test.ts \
            tests/e2e/ux-g125-academic-actions.spec.ts
          npm run typecheck
      - name: Unit and source recovery regressions
        run: npx vitest run tests/unit/ux-g125-academic-actions.test.ts --reporter=dot
      - name: Prepare isolated test database
        run: npm run db:e2e:prepare
      - name: Issue ephemeral test identities
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Authenticated desktop/mobile and denied learner export
        run: npx playwright test tests/e2e/ux-g125-academic-actions.spec.ts --project=chromium --reporter=line
      - name: Archive exact-SHA viewport screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g125-academic-${{ github.sha }}
          path: |
            ux-g125-source-sha.txt
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
