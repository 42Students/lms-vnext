name: Faculty All Quizzes acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/faculty-all-quizzes-acceptance.yml"
      - "tests/e2e/faculty-all-quizzes.spec.ts"
      - "tests/e2e/faculty-quizzes-closure.spec.ts"
      - "tests/integration/faculty-section-authoring.test.ts"
      - "src/components/courses/faculty-choice-quiz-builder.tsx"
      - "src/modules/courses/faculty-quiz-authoring-*"
      - "src/components/courses/faculty-assessment-overview.tsx"
permissions:
  contents: read
concurrency:
  group: faculty-all-quizzes-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB06_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Registered journal
        run: npm run db:journal:verify
      - name: Prepare disposable PostgreSQL
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Registered quiz shuffle columns and authored-order persistence on PostgreSQL 17
        env:
          DB041_REGISTERED_PG: "YES"
        run: node --test tests/db041-registered-quiz-shuffle-pg.test.mjs
      - name: Faculty Quiz create edit publish close archive, audit, report and denial tests
        run: npx vitest run --config vitest.db.config.ts tests/integration/faculty-section-authoring.test.ts
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Seed disposable E2E database
        run: npm run db:e2e:prepare
      - name: Ephemeral E2E auth keys
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Faculty Quiz lifecycle, shuffle, attempted review and error recovery on desktop/mobile
        run: >-
          npx playwright test
          tests/e2e/faculty-all-quizzes.spec.ts
          tests/e2e/faculty-quizzes-closure.spec.ts
          --workers=1
