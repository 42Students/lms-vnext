name: UI-07 P03 — Source Parity (placements learner and admin)

on:
  push:
    paths:
      - "src/app/(authenticated)/admin/placements/**"
      - "src/app/(authenticated)/learn/placements/**"
      - "src/app/(authenticated)/placements/**"
      - "docs/planning/ui-inventory-ui07.json"
      - "tests/ui07-source-parity.test.mjs"
  pull_request:
    paths:
      - "src/app/(authenticated)/admin/placements/**"
      - "tests/ui07-source-parity.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui07-p03-source-parity:
    name: UI-07 P03 source parity (no browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run UI-07 source parity test
        run: node --test tests/ui07-source-parity.test.mjs
