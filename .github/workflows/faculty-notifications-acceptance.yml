name: Faculty Notifications acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/faculty-notifications-acceptance.yml"
      - "tests/integration/faculty-notifications-college-scope.test.ts"
      - "tests/integration/faculty-announcements-acceptance.test.ts"
      - "tests/unit/faculty-notifications-*.test.ts"
      - "tests/unit/faculty-notifications-*.test.tsx"
      - "tests/unit/faculty-notification-link-model.test.ts"
      - "tests/e2e/faculty-notifications.spec.ts"
      - "src/app/(authenticated)/teacher/notifications/**"
      - "src/components/activity/notification-toolbar.tsx"
      - "src/modules/announcements/readiness.ts"
      - "src/modules/activity/faculty-notification-service.ts"
      - "src/modules/activity/faculty-notifications-access.ts"
      - "src/modules/courses/faculty-inbox-query-model.ts"
      - "src/modules/courses/faculty-notification-link-model.ts"

permissions:
  contents: read
  statuses: write

concurrency:
  group: faculty-notifications-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB06_ISOLATED_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify registered migration journal
        run: npm run db:journal:verify
      - name: Prepare and seed disposable PostgreSQL 17
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Execute registered Faculty read/unread and cross-college PostgreSQL test
        run: >-
          npx vitest run --config vitest.db.config.ts
          tests/integration/faculty-notifications-college-scope.test.ts
          tests/integration/faculty-announcements-acceptance.test.ts
      - name: Execute Faculty inbox scope, deep link, query and UX acceptance
        run: >-
          npx vitest run
          tests/unit/faculty-notifications-closure.test.tsx
          tests/unit/faculty-notifications-access.test.ts
          tests/unit/faculty-notification-link-model.test.ts

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      DB10_ANNOUNCEMENTS_READY: DB10_VERIFIED
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable E2E database
        run: npm run db:e2e:prepare
      - name: Generate ephemeral E2E auth keys
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Execute authentic Faculty notification browser journey
        run: npx playwright test tests/e2e/faculty-notifications.spec.ts --workers=1

  record_result:
    name: Record exact-SHA Faculty Notifications acceptance
    if: ${{ always() }}
    needs: [postgres, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Publish immutable PostgreSQL/browser result to commit status
        uses: actions/github-script@v7
        with:
          script: |
            const postgres = "${{ needs.postgres.result }}";
            const browser = "${{ needs.browser.result }}";
            const passed = postgres === "success" && browser === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? "success" : "failure",
              context: "faculty-notifications-acceptance/pg-browser",
              description: passed
                ? "PostgreSQL, Faculty unit, and browser acceptance passed"
                : "Faculty Notifications acceptance is not green",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
