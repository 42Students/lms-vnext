# Isolated DB067 registered migration/claim verification; no provider calls.
# The production worker and DB-018 task acceptance remain separately gated.
name: DB067 registered outbound claims and suppression PG17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/db067-staged-outbound-pg17.yml"
      - "drizzle/0330_db067_outbound_fenced_worker_functions.sql"
      - "drizzle/meta/_journal.json"
      - "drizzle/meta/0330_snapshot.json"
      - "tests/integration/db067-global-email-pre-send.test.ts"

permissions:
  contents: read

concurrency:
  group: db067-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staged-outbound-dispatch-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
      DB067_DISPATCH_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify journal before diagnostic
        run: npm run db:journal:verify
      - name: Prepare clean disposable registered PG17 schema
        env:
          DATABASE_URL: ""
        run: npm run db:test:prepare
      - name: Verify all four registered functions after zero-to-head journal replay
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            DO \$\$ BEGIN
              IF to_regprocedure('db10_claim_outbound_messages(text,integer,integer)') IS NULL
                OR to_regprocedure('db10_check_outbound_pre_send(uuid,text,integer,text)') IS NULL
                OR to_regprocedure('db10_complete_outbound_claim(uuid,text,integer,text,text,text,timestamptz)') IS NULL
                OR to_regprocedure('db10_expire_unclaimed_outbound(integer)') IS NULL THEN
                RAISE EXCEPTION 'DB067 registered worker functions missing';
              END IF;
            END \$\$;"
      - name: Prove registered migration replay idempotence
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_test
        run: npm run db:migrate
      - name: Exercise registered two-worker claims, role denial, late opt-out against PG17
        env:
          DATABASE_URL: ""
        run: npx vitest run --config vitest.db.registered.config.ts tests/integration/db067-global-email-pre-send.test.ts
      - name: Explicit evidence limit
        if: always()
        run: |
          echo "DB067 SQL is now in the registered forward-only journal."
          echo "No trusted dispatcher role/grants, provider, producer cutover or DB018 global acceptance is asserted."
