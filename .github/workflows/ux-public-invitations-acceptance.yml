name: UX-G046 G057 public invitation acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/company-join/**'
      - 'src/app/hr-invite/**'
      - 'tests/ux-g046-g057-invitation-contract.test.mjs'
      - 'tests/e2e/ux-g046-g057-public-invitations.spec.ts'
      - 'tests/unit/UX-hr-invite-token-01.test.ts'
      - '.github/workflows/ux-public-invitations-acceptance.yml'

permissions:
  contents: read

jobs:
  invite-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check scoped JSX and browser spec lint
        run: |
          npx eslint 'src/app/company-join/[token]/page.tsx' 'src/app/company-join/[token]/loading.tsx' 'src/app/hr-invite/[token]/page.tsx' 'src/app/hr-invite/[token]/loading.tsx' tests/e2e/ux-g046-g057-public-invitations.spec.ts
          node --test tests/ux-g046-g057-invitation-contract.test.mjs
      - name: Existing company and HR invite flow regressions
        run: |
          npx vitest run \
            tests/unit/UX-company-join-01.test.ts \
            tests/unit/UX-hr-invite-token-01.test.ts \
            tests/unit/recruiter-invite-alias-model.test.ts \
            tests/unit/chat16-public-legacy-invite-handoff-16.test.ts \
            tests/unit/chat16-legacy-auth-invite-alias-pages-16.test.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop mobile invitation browser checks
        run: npx playwright test tests/e2e/ux-g046-g057-public-invitations.spec.ts --project=chromium --reporter=line
      - name: Preserve screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-g046-g057-browser-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
