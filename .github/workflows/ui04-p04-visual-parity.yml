name: UI-04 P04 Visual Parity — Courses and Learning Content

on:
  workflow_dispatch:
  schedule:
    # Run nightly at 02:30 UTC
    - cron: '30 2 * * *'

permissions:
  contents: read

jobs:
  visual-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (Chromium only)
        run: bunx playwright install --with-deps chromium

      - name: Create snapshot output directory
        run: mkdir -p tests/ui-snapshots/ui04

      - name: UI-04 visual parity — admin courses surfaces
        run: bunx playwright test tests/ui04-visual-parity.spec.ts --grep "Admin Courses"
        env:
          TEST_BASE_URL: https://testa.development.42lms.com
          PLAYWRIGHT_BASE_URL: https://testa.development.42lms.com

      - name: UI-04 visual parity — learner courses surfaces
        run: bunx playwright test tests/ui04-visual-parity.spec.ts --grep "Learner Courses"
        env:
          TEST_BASE_URL: https://testa.development.42lms.com
          PLAYWRIGHT_BASE_URL: https://testa.development.42lms.com

      - name: UI-04 visual parity — faculty courses surfaces
        run: bunx playwright test tests/ui04-visual-parity.spec.ts --grep "Faculty Courses"
        env:
          TEST_BASE_URL: https://testa.development.42lms.com
          PLAYWRIGHT_BASE_URL: https://testa.development.42lms.com

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui04-visual-parity-screenshots
          path: tests/ui-snapshots/ui04/
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui04-playwright-report
          path: playwright-report/
          retention-days: 14
