# Source-quality acceptance for DB19-P26 — TPO audit, notification outbox and alerts.
name: TPO audit notification outbox alerts source acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/db019-p26-field-review.test.mjs"
      - "docs/planning/db019-p26-field-review.json"
      - "tests/db019-p26-notification-scope.test.mjs"
      - '.github/workflows/db019-p26-source-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: db019-p26-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-quality:
    name: "DB19-P26 TPO audit/outbox field census"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact commit SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: "DB19-P26 source field census (no database)"
        run: node --test tests/db019-p26-field-review.test.mjs tests/db019-p26-notification-scope.test.mjs
      - name: Scope boundary
        if: always()
        run: |
          echo "DB19-P26 source-quality gate only."
          echo "Runtime PG17 producer/consumer acceptance and DB019/DB020 remain OPEN."
