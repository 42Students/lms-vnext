name: UX-G016 Admin placement drive workspace acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/(authenticated)/admin/placements/jobs/**'
      - 'src/app/(authenticated)/admin/placements/joining/**'
      - 'src/components/placements/placement-drive-workspace.tsx'
      - 'tests/e2e/ux-g016-admin-drive-workspace.spec.ts'
      - '.github/workflows/ux-g016-admin-workspace-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: ux-g016-drive-workspace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workspace-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: development
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_JSON_OUTPUT_NAME: ux-g016-drive-results.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact triggering revision and checks
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx eslint tests/e2e/ux-g016-admin-drive-workspace.spec.ts
          npm run ux:groups -- --check
      - name: TypeScript integrity
        run: npm run typecheck
      - name: Existing drive permissions, applications, scheduling and settings contracts
        run: |
          npx vitest run             tests/unit/chat13-superadmin-drive-pipeline.test.ts             tests/unit/chat13-admin-placement-directory-and-identity-adversarial.test.ts             tests/unit/super-admin-placement-applications-read.test.ts             tests/unit/chat13-superadmin-interview-operations.test.ts             tests/unit/chat13-admin-ui-placements-tenant-matrix.test.ts             --reporter=dot
      - name: Prepare isolated PostgreSQL browser fixture
        run: npm run db:e2e:prepare
      - name: Ephemeral test actors
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Chromium browser
        run: npx playwright install --with-deps chromium
      - name: All five pages desktop/mobile and learner denial
        run: |
          npx playwright test tests/e2e/ux-g016-admin-drive-workspace.spec.ts --project=chromium --reporter=line,json
          node -e 'const s=require("./ux-g016-drive-results.json").stats;if(s.expected!==4||s.unexpected!==0||s.flaky!==0||s.skipped!==0)process.exit(1)'
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g016-admin-drive-${{ github.run_id }}
          path: |
            test-results/**
            playwright-report/**
            ux-g016-drive-results.json
          if-no-files-found: ignore
          retention-days: 14
