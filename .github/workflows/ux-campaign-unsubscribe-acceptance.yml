name: UX-G027 campaign unsubscribe acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/campaign-unsubscribe/**'
      - 'src/components/placements/campaign-unsubscribe-confirm.tsx'
      - 'tests/ux-g027-unsubscribe-contract.test.mjs'
      - 'tests/e2e/ux-g027-campaign-unsubscribe.spec.ts'
      - '.github/workflows/ux-campaign-unsubscribe-acceptance.yml'

permissions:
  contents: read

jobs:
  scoped-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scoped source/accessibility and contract checks
        run: |
          npx eslint 'src/app/campaign-unsubscribe/[token]/page.tsx' \
            'src/app/campaign-unsubscribe/[token]/loading.tsx' \
            'src/app/campaign-unsubscribe/confirmed/page.tsx' \
            'src/app/campaign-unsubscribe/confirmed/loading.tsx' \
            src/components/placements/campaign-unsubscribe-confirm.tsx \
            tests/e2e/ux-g027-campaign-unsubscribe.spec.ts
          node --test tests/ux-g027-unsubscribe-contract.test.mjs
      - name: Existing opt-out and scope regression tests
        run: |
          npx vitest run \
            tests/unit/UX-campaign-unsubscribe-token-01.test.ts \
            tests/unit/UX-campaign-unsubscribe-confirmed-01.test.ts \
            tests/unit/chat16-public-unsubscribe-page-27.test.ts \
            tests/unit/chat16-campaign-unsubscribe-ssr-pages-16.test.ts \
            tests/unit/chat2-unsubscribe-graceful.test.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser desktop/mobile, failure and scope evidence
        run: npx playwright test tests/e2e/ux-g027-campaign-unsubscribe.spec.ts --project=chromium --reporter=line
      - name: Preserve screenshots and trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-g027-browser-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
