name: UX component groups acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/components/admin/tenant-settings-other-keys.tsx
      - src/components/electives/college-slot-manager.tsx
      - src/components/activity/activity-center.tsx
      - src/components/activity/learner-notifications-inbox.tsx
      - src/components/activity/notification-list.tsx
      - src/app/e2e/ux-component-groups/**
      - tests/e2e/ux-component-groups.spec.ts
      - .github/workflows/ux-component-groups-acceptance.yml

permissions:
  contents: read

# Parallel chats push frequently. Only the newest acceptance run is needed.
concurrency:
  group: ux-component-groups-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify source is exactly triggering SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Scoped UX source and test lint
        run: npx eslint src/components/admin/tenant-settings-other-keys.tsx src/components/electives/college-slot-manager.tsx src/components/activity/activity-center.tsx src/components/activity/learner-notifications-inbox.tsx src/components/activity/notification-list.tsx src/app/e2e/ux-component-groups/page.tsx src/app/e2e/ux-component-groups/ux-component-groups-harness.tsx tests/e2e/ux-component-groups.spec.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile UX component interaction acceptance
        run: npx playwright test tests/e2e/ux-component-groups.spec.ts --project=chromium --reporter=line
      - name: TypeScript
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      - name: Preserve responsive browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-g126-g130-g140-viewport-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
