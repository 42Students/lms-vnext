name: UX-G167 Activity CSV exports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/modules/activity/college-activity-export-*
      - src/modules/activity/super-admin-audit-export-*
      - tests/unit/college-activity-export-model.test.ts
      - tests/unit/super-admin-audit-export-model.test.ts
      - tests/e2e/ux-g167-activity-exports.spec.ts
      - .github/workflows/ux-g167-activity-exports-acceptance.yml
permissions:
  contents: read
concurrency:
  group: ux-g167-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact checkout commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify legacy activity-export regression paths
        run: |
          test -f tests/unit/college-activity-export-model.test.ts
          test -f tests/unit/super-admin-audit-export-model.test.ts
      - name: Focused static and CSV regressions
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npx eslint src/modules/activity/college-activity-export-model.ts src/modules/activity/college-activity-export-service.ts src/modules/activity/super-admin-audit-export-model.ts src/modules/activity/super-admin-audit-export-service.ts tests/unit/college-activity-export-model.test.ts tests/unit/super-admin-audit-export-model.test.ts tests/e2e/ux-g167-activity-exports.spec.ts
          npm run typecheck
          npx vitest run tests/unit/college-activity-export-model.test.ts tests/unit/super-admin-audit-export-model.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run db:e2e:prepare
      - name: Ephemeral test authentication
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
          # Development-only seeded contacts; production OTP and step-up stay strict.
          echo "AUTH_TEST_OTP=$(shuf -i 100000-999999 -n 1)" >> "$GITHUB_ENV"
          echo "AUTH_TEST_EMAILS=superadmin.seed@example.com,collegeadmin.seed@example.com" >> "$GITHUB_ENV"
          echo "AUTH_TEST_PHONES=+919000000001" >> "$GITHUB_ENV"
      - run: npx playwright test tests/e2e/ux-g167-activity-exports.spec.ts --project=chromium --reporter=line
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ux-g167-viewport-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
