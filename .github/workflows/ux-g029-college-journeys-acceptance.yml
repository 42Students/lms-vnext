name: UX-G029 College Admin six-route acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/(authenticated)/college/announcements/page.tsx'
      - 'src/app/(authenticated)/college/assignments/page.tsx'
      - 'src/app/(authenticated)/college/attendance/**'
      - 'tests/e2e/ux-g029-college-journeys.spec.ts'
      - 'tests/ux-admin-college-error-recovery.test.mjs'
      - '.github/workflows/ux-g029-college-journeys-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: ux-g029-college-journeys-${{ github.ref }}
  cancel-in-progress: false

jobs:
  college-admin-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      DB03_ISOLATED_TEST_DATABASE: "1"
      DB10_ANNOUNCEMENTS_READY: DB10_VERIFIED
      E2E_AUTH_ENABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: development
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_JSON_OUTPUT_NAME: ux-g029-college-results.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pinned source and scoped lint
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npx eslint             'src/app/(authenticated)/college/announcements/page.tsx'             tests/e2e/ux-g029-college-journeys.spec.ts
      - name: TypeScript integrity
        run: npm run typecheck
      - name: Existing college route and notice-policy regressions
        run: |
          npx vitest run             tests/unit/UX-college-college-announcements-01.test.ts             tests/unit/UX-college-college-assignments-01.test.ts             tests/unit/UX-college-college-attendance-01.test.ts             tests/unit/UX-college-college-attendance-corrections-01.test.ts             tests/unit/UX-college-college-attendance-departments-01.test.ts             tests/unit/UX-college-college-attendance-settings-01.test.ts             tests/unit/college-notice-inbox-model.test.ts             --reporter=dot
          node --test tests/ux-admin-college-error-recovery.test.mjs
      - name: Prepare fresh disposable database
        run: npm run db:e2e:prepare
      - name: Real college notice recipient and cross-tenant negative tests
        run: npx vitest run --config vitest.db.config.ts tests/integration/college-notice-inbox.test.ts --reporter=dot
      - name: Ephemeral test-only authentication keys
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser six page journeys and learner denial on desktop and mobile
        run: |
          npx playwright test tests/e2e/ux-g029-college-journeys.spec.ts --project=chromium --reporter=line,json
          node -e 'const s=require("./ux-g029-college-results.json").stats;if(s.expected!==4||s.unexpected!==0||s.flaky!==0||s.skipped!==0)process.exit(1)'
      - name: Preserve screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-g029-college-journeys-${{ github.run_id }}
          path: |
            test-results/**
            playwright-report/**
            ux-g029-college-results.json
          if-no-files-found: ignore
          retention-days: 14
