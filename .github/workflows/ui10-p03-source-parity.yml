name: UI-10 P03 Source Parity (global gate)

on:
  push:
    paths:
      - "docs/tracker.json"
      - "docs/planning/ui-inventory-ui*.json"
      - "docs/planning/ui-strings-ui*.json"
      - "tests/ui*-source-parity.test.mjs"
      - "tests/ui10-source-parity.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui10-global-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run UI-10 global gate test
        run: node --test tests/ui10-source-parity.test.mjs
