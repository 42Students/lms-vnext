name: Faculty Assignment Grading prototype acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/faculty-assignment-grading-prototype-acceptance.yml"
      - "src/app/(authenticated)/teacher/report/assignment/[contentId]/grade/page.tsx"
      - "src/components/courses/faculty-prototype-inline-grader.tsx"
      - "src/modules/courses/faculty-grading-selection-model.ts"
      - "tests/unit/faculty-grading-selection-model.test.ts"
      - "tests/e2e/faculty-assignment-grading-prototype.spec.ts"
permissions:
  contents: read
concurrency:
  group: faculty-grading-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_vnext_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_vnext_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lms_vnext_e2e
      E2E_AUTH_ENABLED: "true"
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Filter-scoped grading deep link unit contracts
        run: npx vitest run tests/unit/faculty-grading-selection-model.test.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable browser PostgreSQL
        run: npm run db:e2e:prepare
      - name: Ephemeral Faculty identity
        shell: bash
        run: |
          echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_HOSTS=localhost,127.0.0.1" >> "$GITHUB_ENV"
      - name: Faculty #10 Grading prototype desktop-mobile browser
        run: npx playwright test tests/e2e/faculty-assignment-grading-prototype.spec.ts --workers=1
      - name: Enforce global TypeScript after focused Faculty browser
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
