services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms_vnext
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms_vnext"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lms_vnext_postgres:/var/lib/postgresql/data

volumes:
  lms_vnext_postgres:
